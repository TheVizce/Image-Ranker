	}
	// ===================== /TAG-FILTER =====================

	// ===================== TAG-STATISTIK =====================
	let tagStatsTag = null, tagStatsSort = { key: 'avg', dir: -1 }, tagStatsRows = [];

	function niceStep(range, maxBins) {
		const raw = range / maxBins;
		const mag = Math.pow(10, Math.floor(Math.log10(raw)));
		for (const m of [1, 2, 2.5, 5, 10]) if (m * mag >= raw) return m * mag;
		return 10 * mag;
	}
	const medianOf = arr => { const a = [...arr].sort((x, y) => x - y), n = a.length; return n ? (n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2) : 0; };

	async function openTagStats(tagName) {
		const ctx = await loadFilterContext(currentTab);
		if (ctx.defs.length === 0) { alert("In diesem Tab gibt es noch keine Eigenschaften."); return; }
		if (tagName) tagStatsTag = tagName;
		if (!ctx.defsByName.has(tagStatsTag)) tagStatsTag = ctx.defs[0].tagName;
		const def = ctx.defsByName.get(tagStatsTag), type = tagTypeOf(def);
		const imgs = ctx.images; // nach Elo sortiert, Index+1 = globaler Rang
		const rankOf = new Map(imgs.map((im, i) => [im.id, i + 1]));
		const overall = imgs.reduce((a, i) => a + i.elo, 0) / (imgs.length || 1);
		const groups = new Map(); // key -> { label, items: [] }
		const add = (key, label, im) => { if (!groups.has(key)) groups.set(key, { label: label, items: [] }); groups.get(key).items.push(im); };
		let corr = null;

		if (type === 'number') {
			const pts = [];
			imgs.forEach(im => { const v = getTagValuesAs(im, tagStatsTag, 'number'); const n = v.length ? parseTagNumber(v[0]) : NaN; if (isFinite(n)) pts.push({ im: im, n: n }); else add('__none__', '(keine Zahl)', im); });
			if (pts.length) {
				const lo = Math.min(...pts.map(q => q.n)), hi = Math.max(...pts.map(q => q.n));
				const step = hi > lo ? niceStep(hi - lo, 8) : 1;
				const start = Math.floor(lo / step) * step;
				pts.forEach(q => {
					const b = Math.floor((q.n - start) / step + 1e-9), a = start + b * step, e = a + step;
					const fmt = x => String(Math.round(x * 1000) / 1000);
					add('b' + String(1000000 + b), fmt(a) + ' – ' + fmt(e), q.im);
				});
				if (pts.length >= 3) {
					const mx = pts.reduce((a, q) => a + q.n, 0) / pts.length, my = pts.reduce((a, q) => a + q.im.elo, 0) / pts.length;
					let sxy = 0, sxx = 0, syy = 0;
					pts.forEach(q => { sxy += (q.n - mx) * (q.im.elo - my); sxx += (q.n - mx) ** 2; syy += (q.im.elo - my) ** 2; });
					corr = (sxx > 0 && syy > 0) ? { r: sxy / Math.sqrt(sxx * syy), n: pts.length } : null;
				}
			}
		} else {
			(Array.isArray(def.options) ? def.options : []).forEach(o => groups.set(tagKey(o), { label: o, items: [] }));
			imgs.forEach(im => {
				const vals = getTagValuesAs(im, tagStatsTag, type);
				if (!vals.length) add('__none__', '(kein Wert)', im);
				else vals.forEach(v => add(tagKey(v), v, im));
			});
			groups.forEach((g, k) => { if (g.items.length === 0) groups.delete(k); });
		}

		tagStatsRows = [...groups.entries()].map(([key, g]) => {
			const elos = g.items.map(i => i.elo), w = g.items.reduce((a, i) => a + i.wins, 0), l = g.items.reduce((a, i) => a + i.losses, 0);
			const best = g.items.reduce((a, i) => (rankOf.get(i.id) < rankOf.get(a.id) ? i : a), g.items[0]);
			return { key: key, label: g.label, none: key === '__none__', count: g.items.length, avg: elos.reduce((a, b) => a + b, 0) / elos.length,
				med: medianOf(elos), win: (w + l) ? w / (w + l) : null, best: best, bestRank: rankOf.get(best.id) };
		});

		let h = '<div style="max-width:760px; margin:0 auto;"><h2 style="margin:0 0 10px 0;">🏷️ Tag-Statistik (Tab „' + escHtml(currentTab) + '“)</h2>';
		h += '<div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">Eigenschaft: <select onchange="openTagStats(this.value)" style="background:#1a1a1a; border:1px solid #333; color:#eee; border-radius:4px; padding:5px 8px;">' +
			ctx.defs.map(d => '<option value="' + escHtml(d.tagName) + '"' + (d.tagName === tagStatsTag ? ' selected' : '') + '>' + escHtml(d.tagName) + ' (' + TAG_TYPES[tagTypeOf(d)] + ')</option>').join('') +
			'</select><span style="color:#888; font-size:0.85em;">Ø Elo aller Bilder: <b>' + Math.round(overall) + '</b></span></div>';
		if (corr) {
			const r = corr.r, strength = Math.abs(r) < 0.2 ? 'kaum Zusammenhang' : Math.abs(r) < 0.5 ? 'schwacher Zusammenhang' : Math.abs(r) < 0.8 ? 'deutlicher Zusammenhang' : 'starker Zusammenhang';
			h += '<div style="background:#111; border:1px solid #222; border-radius:8px; padding:8px 12px; margin-bottom:12px;">Korrelation Wert ↔ Elo: <b>' + (Math.round(r * 100) / 100) + '</b> (' + strength + (r > 0.2 ? ', höhere Werte haben tendenziell mehr Elo' : r < -0.2 ? ', höhere Werte haben tendenziell weniger Elo' : '') + '), n = ' + corr.n + '</div>';
		}
		if (type === 'multi') h += '<div style="color:#666; font-size:0.8em; margin-bottom:8px;">Bilder mit mehreren Werten zählen in jeder ihrer Gruppen mit.</div>';
		h += '<div id="tag-stats-table"></div></div>';
		showModal(h);
		window._tagStatsOverall = overall;
		renderTagStatsTable();
	}

	function sortTagStats(key) {
		tagStatsSort = { key: key, dir: tagStatsSort.key === key ? -tagStatsSort.dir : (key === 'label' ? 1 : -1) };
		renderTagStatsTable();
	}
	function renderTagStatsTable() {
		const el = document.getElementById('tag-stats-table');
		if (!el) return;
		const { key, dir } = tagStatsSort;
		const rows = [...tagStatsRows].sort((a, b) => {
			if (a.none !== b.none) return a.none ? 1 : -1; // „kein Wert“ immer unten
			const x = a[key], y = b[key];
			if (typeof x === 'string') return dir * x.localeCompare(y, 'de');
			return dir * ((x === null ? -1 : x) - (y === null ? -1 : y));
		});
		const th = (k, label, al) => '<th onclick="sortTagStats(\'' + k + '\')" style="cursor:pointer; padding:6px 8px; text-align:' + (al || 'right') + ';">' + label + (key === k ? (dir < 0 ? ' ▼' : ' ▲') : '') + '</th>';
		let h = '<table style="width:100%; border-collapse:collapse;"><thead><tr style="color:#888; font-size:0.8em; border-bottom:1px solid #333;">' +
			th('label', 'Wert', 'left') + th('count', 'Bilder') + th('avg', 'Ø Elo') + th('med', 'Median') + th('win', 'Siegquote') + th('bestRank', 'Bestes Bild', 'left') + '</tr></thead><tbody>';
		const ov = window._tagStatsOverall;
		rows.forEach(r => {
			const d = Math.round(r.avg - ov);
			h += '<tr style="border-bottom:1px solid #222;">' +
				'<td style="padding:6px 8px;' + (r.none ? 'color:#888; font-style:italic;' : '') + '">' + escHtml(String(r.label)) + '</td>' +
				'<td style="padding:6px 8px; text-align:right;">' + r.count + '</td>' +
				'<td style="padding:6px 8px; text-align:right;"><b>' + Math.round(r.avg) + '</b> <span style="font-size:0.8em; color:' + (d > 0 ? 'var(--win, #2ecc71)' : d < 0 ? 'var(--loss, #e74c3c)' : '#888') + ';">' + (d > 0 ? '+' : '') + d + '</span></td>' +
				'<td style="padding:6px 8px; text-align:right;">' + Math.round(r.med) + '</td>' +
				'<td style="padding:6px 8px; text-align:right;">' + (r.win === null ? '–' : Math.round(r.win * 100) + ' %') + '</td>' +
				'<td style="padding:6px 8px;"><a href="#" onclick="showDetailsByID(' + r.best.id + '); return false;" title="Details öffnen" style="color:inherit; text-decoration:underline dotted; text-underline-offset:3px; cursor:pointer;">' + escHtml(r.best.name || '') + '</a> <span style="color:#777; font-size:0.8em;">(#' + r.bestRank + ')</span></td></tr>';
		});
		el.innerHTML = h + '</tbody></table>';
	}
	// ===================== /TAG-STATISTIK =====================

	// ===================== RIVALEN =====================
	function escHtml(t) {
		return String(t === undefined || t === null ? '' : t)
			.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
	}

	function getRivalTagWeight(tab, tagName) {
		const tw = settings.tagWeights && settings.tagWeights[tab];
		if (tw && Object.prototype.hasOwnProperty.call(tw, tagName) && typeof tw[tagName] === 'number') return tw[tagName];
		return RIVAL_DEFAULT_TAG_WEIGHT;
	}

	// Vorschläge: Bilder im selben Tab mit Übereinstimmungen bei den Eigenschaften (gewichtet), ohne bereits bekannte (bestätigt/abgelehnt)
	//   Exakt:            gleicher Wert -> volles Gewicht
	//   Mehrfachauswahl:  Anteil gemeinsamer Werte (gemeinsam / insgesamt) * Gewicht
	//   Zahl (±):         Abstand <= Toleranz -> volles Gewicht
	// defsByName: Map Eigenschaftsname -> Definition
	function computeRivalSuggestions(img, tabImages, defsByName, limit) {
		const known = new Set((img.rivals || []).map(r => r.id));
		const result = [];

		tabImages.forEach(other => {
			if (other.id == img.id || known.has(other.id)) return;
			let score = 0;
			const shared = [];
			defsByName.forEach((def, tagName) => {
				const weight = getRivalTagWeight(img.tab, tagName);
				if (!(weight > 0)) return;
				const type = tagTypeOf(def);
				const mine = getTagValuesAs(img, tagName, type);
				if (mine.length === 0) return;
				const theirs = getTagValuesAs(other, tagName, type);
				if (theirs.length === 0) return;

				if (type === 'number') {
					const a = parseTagNumber(mine[0]), b = parseTagNumber(theirs[0]);
					if (isFinite(a) && isFinite(b) && Math.abs(a - b) <= getTagTolerance(def)) {
						score += weight;
						shared.push(tagName + ': ' + mine[0] + (a !== b ? ' ≈ ' + theirs[0] : ''));
					}
				} else if (type === 'multi') {
					const theirKeys = new Set(theirs.map(tagKey));
					const common = mine.filter(v => theirKeys.has(tagKey(v)));
					if (common.length > 0) {
						const union = new Set([...mine.map(tagKey), ...theirKeys]).size;
						score += weight * common.length / union;
						shared.push(tagName + ': ' + common.join(', '));
					}
				} else if (tagKey(mine[0]) === tagKey(theirs[0])) {
					score += weight;
					shared.push(tagName + ': ' + mine[0]);
				}
			});
			if (score > 0) result.push({ img: other, score: score, shared: shared });
		});

		// Höchster Score zuerst, bei Gleichstand die mit der ähnlichsten Elo
		result.sort((a, b) => (b.score - a.score) || (Math.abs(a.img.elo - img.elo) - Math.abs(b.img.elo - img.elo)));
		return result.slice(0, limit || RIVAL_SUGGESTION_COUNT);
	}

	function buildRivalSection(img, tabImages, tagDefs) {
		const urlOf = i => imgUrl(i, 'thumb');
		const byId = {};
		tabImages.forEach(i => { byId[i.id] = i; });

		const rivals = img.rivals || [];
		const confirmed = rivals.filter(r => r.status === 'confirmed' && byId[r.id]);
		const dismissedCount = rivals.filter(r => r.status === 'dismissed' && byId[r.id]).length;
		const confirmedIds = new Set(confirmed.map(r => r.id));
		const suggestions = computeRivalSuggestions(img, tabImages, new Map(tagDefs.map(d => [d.tagName, d])));

		const labelStyle = 'color:#888; font-size:0.8em; text-transform:uppercase; font-weight:bold; letter-spacing:1px;';
		let h = '<div style="margin-bottom:20px; background:#111; padding:12px; border-radius:8px; border:1px solid #222; font-size:0.85em;">';
		h += '<div style="' + labelStyle + ' margin-bottom:8px;">Rivalen</div>';

		// Bestätigte Rivalen
		if (confirmed.length === 0) {
			h += '<div style="color:#555; font-style:italic; margin-bottom:8px;">Noch keine Rivalen.</div>';
		} else {
			h += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">';
			confirmed.forEach(r => {
				const o = byId[r.id];
				h += '<div onclick="showDetailsByID(' + o.id + ')" title="Details öffnen" style="display:flex; align-items:center; gap:6px; background:#1a1a1a; border:1px solid #333; border-radius:20px; padding:3px 8px 3px 3px; cursor:pointer;">' +
					'<img src="' + urlOf(o) + '" style="width:26px; height:26px; border-radius:50%; object-fit:cover;">' +
					'<span style="font-weight:bold;">' + escHtml(o.name) + '</span>' +
					'<span style="color:#666; font-size:0.85em;">' + Math.round(o.elo) + '</span>' +
					'<span onclick="event.stopPropagation(); setRivalStatus(' + img.id + ', ' + o.id + ', \'dismissed\')" title="Rivalen entfernen" style="color:#ff6b6b; padding:0 3px; font-size:0.9em;">✕</span>' +
				'</div>';
			});
			h += '</div>';
		}

		// Manuell hinzufügen (Namenssuche per Datalist)
		const options = tabImages
			.filter(i => i.id != img.id && !confirmedIds.has(i.id))
			.map(i => '<option value="' + escHtml(i.name) + '"></option>').join('');
		h += '<div style="display:flex; gap:6px; margin-bottom:4px;">' +
			'<input id="rival-add-input" list="rival-add-list" placeholder="Rivalen per Namen hinzufügen..." onkeydown="if(event.key===\'Enter\') addRivalByName(' + img.id + ')" style="flex:1; min-width:0; background:#1a1a1a; border:1px solid #333; color:#eee; border-radius:4px; padding:5px 8px; font-size:0.9em;">' +
			'<datalist id="rival-add-list">' + options + '</datalist>' +
			'<button onclick="addRivalByName(' + img.id + ')" style="padding:5px 12px;">+ Rivale</button>' +
		'</div>';

		// Vorschläge
		if (suggestions.length > 0) {
			h += '<div style="' + labelStyle + ' margin:12px 0 4px 0;">Vorschläge (nach gemeinsamen Eigenschaften)</div>';
			suggestions.forEach(sug => {
				const o = sug.img;
				h += '<div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid #1d1d1d;">' +
					'<img src="' + urlOf(o) + '" style="width:32px; height:32px; border-radius:4px; object-fit:cover; cursor:pointer;" onclick="showDetailsByID(' + o.id + ')">' +
					'<div style="flex:1; min-width:0;">' +
						'<div><b>' + escHtml(o.name) + '</b> <span style="color:#666; font-size:0.85em;">' + Math.round(o.elo) + ' Elo</span></div>' +
						'<div style="font-size:0.8em; color:#777; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escHtml(sug.shared.join(' · ')) + '">' + escHtml(sug.shared.join(' · ')) + '</div>' +
					'</div>' +
					'<button onclick="setRivalStatus(' + img.id + ', ' + o.id + ', \'confirmed\')" title="Als Rivalen bestätigen" style="padding:3px 10px; background:var(--win); color:#000;">✓</button>' +
					'<button class="secondary" onclick="setRivalStatus(' + img.id + ', ' + o.id + ', \'dismissed\')" title="Vorschlag ablehnen" style="padding:3px 10px;">✕</button>' +
				'</div>';
			});
		}

		if (dismissedCount > 0) {
			h += '<div style="margin-top:8px;"><span onclick="resetDismissedRivals(' + img.id + ')" style="color:#666; font-size:0.85em; cursor:pointer; text-decoration:underline;">' + dismissedCount + ' abgelehnte zurücksetzen</span></div>';
		}

		h += '</div>';
		return h;
	}

	function idbGet(store, id) {
		return new Promise(r => { store.get(id).onsuccess = e => r(e.target.result); });
	}

	// Rivalenstatus für ein Paar setzen (symmetrisch). status: 'confirmed' | 'dismissed' | null (Eintrag entfernen)
	async function setRivalStatus(aId, bId, status, after) {
		aId = Number(aId); bId = Number(bId);
		const tx = db.transaction("images", "readwrite");
		const store = tx.objectStore("images");
		const a = await idbGet(store, aId);
		const b = await idbGet(store, bId);
		if (!a || !b) return;

		[[a, bId], [b, aId]].forEach(([image, otherId]) => {
			image.rivals = (image.rivals || []).filter(r => r.id != otherId);
			if (status) image.rivals.push({ id: otherId, status: status });
			store.put(image);
		});

		tx.oncomplete = () => { if (after) after(); else showDetailsByID(aId); };
	}

	async function addRivalByName(imgId) {
		const input = document.getElementById('rival-add-input');
		const name = input ? input.value.trim().toLowerCase() : '';
		if (!name) return;

		const all = await new Promise(r => db.transaction("images").objectStore("images").getAll().onsuccess = e => r(e.target.result));
		const self = all.find(i => i.id == imgId);
		if (!self) return;

		const hits = all.filter(i => i.tab === self.tab && i.id != imgId && String(i.name).trim().toLowerCase() === name);
		if (hits.length === 0) { alert("Kein Bild mit diesem Namen in diesem Tab gefunden."); return; }
		if (hits.length > 1) { alert("Der Name ist nicht eindeutig (" + hits.length + " Treffer). Bitte einen der Einträge umbenennen."); return; }

		await setRivalStatus(imgId, hits[0].id, 'confirmed');
	}

	// Alle abgelehnten Vorschläge dieses Bildes wieder freigeben (beidseitig)
	// ===== RIVALEN-ZENTRALE (tabübergreifende Vorschläge + Netzwerk-Graph) =====
	// Zustand lebt nur, solange das Fenster offen ist. Rivalen gibt es nur innerhalb eines Tabs.
	let rivalHub = null;
	const RH_PAGE = 60;

	async function openRivalHub(view) {
		const ctx = await loadFilterContext(currentTab);
		if (ctx.images.length < 2) { alert("Für Rivalen braucht der Tab mindestens zwei Bilder."); return; }
		rivalHub = { tab: currentTab, images: ctx.images, defsByName: ctx.defsByName, byId: new Map(ctx.images.map(i => [i.id, i])),
			view: view || (rivalHub && rivalHub.view) || 'list', minScore: 1, query: '', shown: RH_PAGE, sugg: null, showSugg: true, focus: null, graph: null };
		rivalHubComputeSuggestions();
		showModal('<div id="rh-root"></div>');
		document.getElementById('modal').classList.add('list-mode');
		renderRivalHub();
	}

	// Alle Paare bewerten (symmetrisch, pro Paar der höhere der beiden Scores)
	function rivalHubComputeSuggestions() {
		const h = rivalHub, pairs = new Map();
		h.images.forEach(a => {
			computeRivalSuggestions(a, h.images, h.defsByName, 1e9).forEach(s => {
				const lo = Math.min(a.id, s.img.id), hi = Math.max(a.id, s.img.id), key = lo + '-' + hi;
				const old = pairs.get(key);
				if (!old || s.score > old.score) pairs.set(key, { a: h.byId.get(lo), b: h.byId.get(hi), score: s.score, shared: s.shared.map(x => x.split(':')[0] === x ? x : x) });
			});
		});
		// computeRivalSuggestions ignoriert Paare, die bei a schon bekannt sind -> Gegenseite prüfen
		h.sugg = [...pairs.values()].filter(p => !(p.a.rivals || []).some(r => r.id == p.b.id) && !(p.b.rivals || []).some(r => r.id == p.a.id))
			.sort((x, y) => (y.score - x.score) || (Math.abs(x.a.elo - x.b.elo) - Math.abs(y.a.elo - y.b.elo)));
	}

	function renderRivalHub() {
		const h = rivalHub, root = document.getElementById('rh-root');
		if (!h || !root) return;
		const confirmed = rivalHubEdges().length;
		root.innerHTML = '<h2 style="margin-top:0;">🕸️ Rivalen-Zentrale <small style="font-size:0.5em;color:#888;">Tab: ' + escHtml(h.tab) + '</small></h2>' +
			'<div class="rh-tabs"><button class="rh-tab' + (h.view === 'list' ? ' on' : '') + '" onclick="rivalHubView(\'list\')">💡 Vorschläge (' + h.sugg.length + ')</button>' +
			'<button class="rh-tab' + (h.view === 'graph' ? ' on' : '') + '" onclick="rivalHubView(\'graph\')">🕸️ Netzwerk (' + confirmed + ' Verbindungen)</button></div>' +
			'<div id="rh-view"></div>';
		if (h.view === 'list') renderRivalHubList(); else renderRivalHubGraph();
	}
	function rivalHubView(v) { rivalHub.view = v; renderRivalHub(); }

	function rivalHubEdges() {
		const h = rivalHub, out = [];
		h.images.forEach(a => (a.rivals || []).forEach(r => {
			if (r.status === 'confirmed' && a.id < r.id && h.byId.has(r.id)) out.push([a.id, r.id]);
		}));
		return out;
	}

	function renderRivalHubList() {
		const h = rivalHub, view = document.getElementById('rh-view');
		const maxScore = h.sugg.length ? Math.ceil(h.sugg[0].score) : 1;
		const q = h.query.trim().toLowerCase();
		const list = h.sugg.filter(p => p.score >= h.minScore && (!q || p.a.name.toLowerCase().includes(q) || p.b.name.toLowerCase().includes(q) || p.shared.some(s => s.toLowerCase().includes(q))));
		const side = i => '<div class="rh-side" onclick="showDetailsByID(' + i.id + ')" title="Details öffnen"><img src="' + imgUrl(i, 'thumb') + '" alt=""><span>' + escHtml(i.name) + '</span><span>Elo ' + Math.round(i.elo) + '</span></div>';
		let html = '<div class="rh-bar"><label>Mindest-Übereinstimmung <input type="range" id="rh-min" min="0.5" max="' + Math.max(maxScore, 1) + '" step="0.5" value="' + Math.min(h.minScore, Math.max(maxScore, 1)) + '" oninput="rivalHubSetMin(this.value)"> <b id="rh-min-val">' + h.minScore + '</b></label>' +
			'<input type="text" id="rh-q" placeholder="Suche (Name oder Eigenschaft)" value="' + escHtml(h.query) + '" oninput="rivalHubSetQuery(this.value)">' +
			'<span>' + list.length + ' Vorschläge</span>' +
			'<button class="nav-btn" style="padding:5px 12px;" onclick="rivalHubResetDismissed()">Abgelehnte zurücksetzen</button></div>';
		if (list.length === 0) html += '<div class="rh-empty">Keine Vorschläge für diese Einstellung.<br><small>Vorschläge entstehen aus gemeinsamen Eigenschaften (Gewichte in den Einstellungen).</small></div>';
		else {
			html += '<div class="rh-list">' + list.slice(0, h.shown).map(p =>
				'<div class="rh-row" data-a="' + p.a.id + '" data-b="' + p.b.id + '">' + side(p.a) +
				'<div class="rh-mid"><div><span class="rh-score">' + (Math.round(p.score * 10) / 10) + '</span> Übereinstimmung · ΔElo ' + Math.round(Math.abs(p.a.elo - p.b.elo)) + '</div>' +
				'<div class="rh-chips">' + p.shared.map(s => '<i>' + escHtml(s) + '</i>').join('') + '</div>' +
				'<div class="rh-btns"><button class="ok" onclick="rivalHubDecide(' + p.a.id + ',' + p.b.id + ',\'confirmed\')">⚔️ Rivalen</button><button class="no" onclick="rivalHubDecide(' + p.a.id + ',' + p.b.id + ',\'dismissed\')">✕ Nein</button></div></div>' + side(p.b) + '</div>').join('') + '</div>';
			if (list.length > h.shown) html += '<div style="text-align:center;margin-top:14px;"><button class="nav-btn" onclick="rivalHub.shown += RH_PAGE; renderRivalHubList();">Mehr anzeigen (' + (list.length - h.shown) + ' weitere)</button></div>';
		}
		const keepFocus = document.activeElement && document.activeElement.id === 'rh-q';
		view.innerHTML = html;
		if (keepFocus) { const el = document.getElementById('rh-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
	}
	function rivalHubSetMin(v) { rivalHub.minScore = Number(v); rivalHub.shown = RH_PAGE; renderRivalHubList(); }
	function rivalHubSetQuery(v) { rivalHub.query = v; rivalHub.shown = RH_PAGE; renderRivalHubList(); }

	function rivalHubApplyLocal(aId, bId, status) {
		const h = rivalHub;
		[[aId, bId], [bId, aId]].forEach(([x, y]) => {
			const im = h.byId.get(x); if (!im) return;
			im.rivals = (im.rivals || []).filter(r => r.id != y);
			if (status) im.rivals.push({ id: y, status: status });
		});
	}
	async function rivalHubDecide(aId, bId, status) {
		const h = rivalHub;
		await setRivalStatus(aId, bId, status, () => {
			if (rivalHub !== h) return;
			rivalHubApplyLocal(aId, bId, status);
			h.sugg = h.sugg.filter(p => !(p.a.id == aId && p.b.id == bId) && !(p.a.id == bId && p.b.id == aId));
			h.graph = null;
			// nur die Zeile entfernen (Scrollposition bleibt), Zähler aktualisieren
			const row = document.querySelector('.rh-row[data-a="' + Math.min(aId, bId) + '"][data-b="' + Math.max(aId, bId) + '"]');
			if (row) row.remove();
			const tabs = document.querySelectorAll('.rh-tab');
			if (tabs[0]) tabs[0].textContent = '💡 Vorschläge (' + h.sugg.length + ')';
			if (tabs[1]) tabs[1].textContent = '🕸️ Netzwerk (' + rivalHubEdges().length + ' Verbindungen)';
			const sp = document.querySelector('.rh-bar span'); if (sp) sp.textContent = document.querySelectorAll('.rh-row').length + ' Vorschläge';
		});
	}
	async function rivalHubResetDismissed() {
		const h = rivalHub;
		const n = h.images.reduce((s, i) => s + (i.rivals || []).filter(r => r.status === 'dismissed').length, 0) / 2;
		if (!n) { alert("Es gibt keine abgelehnten Paare."); return; }
		if (!confirm(n + " abgelehnte Paare wieder als Vorschläge zulassen?")) return;
		const tx = db.transaction("images", "readwrite"), store = tx.objectStore("images");
		h.images.forEach(i => {
			if ((i.rivals || []).some(r => r.status === 'dismissed')) { i.rivals = i.rivals.filter(r => r.status !== 'dismissed'); store.put(i); }
		});
		tx.oncomplete = () => { if (rivalHub !== h) return; rivalHubComputeSuggestions(); renderRivalHub(); };
	}

	// ---- Netzwerk-Graph (eigene Kräfte-Simulation, SVG) ----
	function rivalHubBuildGraph() {
		const h = rivalHub, edges = rivalHubEdges().map(e => ({ a: e[0], b: e[1], kind: 'rival' }));
		if (h.showSugg) h.sugg.slice(0, 40).forEach(p => edges.push({ a: p.a.id, b: p.b.id, kind: 'sugg' }));
		const ids = new Set(); edges.forEach(e => { ids.add(e.a); ids.add(e.b); });
		const nodes = [...ids].map((id, k) => {
			const ang = k * 2.399963, rad = 30 * Math.sqrt(k + 1);
			return { id: id, img: h.byId.get(id), x: Math.cos(ang) * rad, y: Math.sin(ang) * rad, vx: 0, vy: 0, deg: 0, fixed: false };
		});
		const nById = new Map(nodes.map(n => [n.id, n]));
		edges.forEach(e => { e.na = nById.get(e.a); e.nb = nById.get(e.b); e.na.deg++; e.nb.deg++; });
		// Cluster = Zusammenhangskomponenten der bestätigten Rivalen (Vorschläge bilden keine Cluster)
		const parent = new Map(nodes.map(n => [n.id, n.id]));
		const find = x => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
		edges.filter(e => e.kind === 'rival').forEach(e => parent.set(find(e.a), find(e.b)));
		const groups = new Map();
		nodes.forEach(n => { const r = find(n.id); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(n); });
		const clusters = [...groups.values()].sort((a, b) => b.length - a.length);
		clusters.forEach((c, i) => { c.hue = (i * 137.5 + 210) % 360; c.idx = i; c.forEach(n => { n.cl = c; }); });
		const g = { nodes: nodes, edges: edges, clusters: clusters, vb: { x: -400, y: -300, w: 800, h: 600 }, alpha: 1 };
		for (let i = 0; i < 320; i++) rivalHubStep(g);
		rivalHubFit(g);
		return g;
	}
	function rivalHubStep(g) {
		const N = g.nodes, a = g.alpha;
		for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
			const p = N[i], q = N[j]; let dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
			if (d2 < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 0.5; }
			if (d2 > 160000) continue;
			const f = 5200 / d2 * a, d = Math.sqrt(d2);
			p.vx += dx / d * f; p.vy += dy / d * f; q.vx -= dx / d * f; q.vy -= dy / d * f;
		}
		g.edges.forEach(e => {
			const dx = e.nb.x - e.na.x, dy = e.nb.y - e.na.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
			const rest = e.kind === 'rival' ? 90 : 150, k = (e.kind === 'rival' ? 0.06 : 0.006) * (d - rest) / d;
			e.na.vx += dx * k; e.na.vy += dy * k; e.nb.vx -= dx * k; e.nb.vy -= dy * k;
		});
		N.forEach(n => {
			n.vx -= n.x * 0.004; n.vy -= n.y * 0.004;      // leichte Schwerkraft zur Mitte
			if (!n.fixed) { n.x += n.vx; n.y += n.vy; }
			n.vx *= 0.6; n.vy *= 0.6;
		});
		g.alpha = Math.max(0.05, g.alpha * 0.985);
	}
	function rivalHubFit(g) {
		if (!g.nodes.length) return;
		let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
		g.nodes.forEach(n => { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x); y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y); });
		const pad = 60, w = Math.max(x1 - x0 + 2 * pad, 200), hh = Math.max(y1 - y0 + 2 * pad, 150);
		const svg = document.getElementById('rh-svg'), ratio = svg && svg.clientWidth ? svg.clientHeight / svg.clientWidth : 0.75;
		let W = w, H = w * ratio; if (H < hh) { H = hh; W = hh / ratio; }
		g.vb = { x: (x0 + x1) / 2 - W / 2, y: (y0 + y1) / 2 - H / 2, w: W, h: H };
	}
	const rhR = n => 15 + Math.min(14, n.deg * 2.2);
	const rhColor = (n, l) => 'hsl(' + Math.round(n.cl.hue) + ',70%,' + (l || 58) + '%)';

	function renderRivalHubGraph() {
		const h = rivalHub, view = document.getElementById('rh-view');
		const hasRivals = rivalHubEdges().length > 0;
		if (!hasRivals && !h.showSugg) h.showSugg = true;
		view.innerHTML = '<div class="rh-bar"><label><input type="checkbox" id="rh-sg" ' + (h.showSugg ? 'checked' : '') + ' onchange="rivalHub.showSugg=this.checked; rivalHub.graph=null; renderRivalHubGraph();"> Beste Vorschläge als gestrichelte Linien (40)</label>' +
			'<span>Bild ziehen = verschieben · Hintergrund ziehen = Ansicht · Zoom: Mausrad/＋－ · Tippen: Details</span></div>' +
			'<div class="rh-graphwrap"><svg id="rh-svg" xmlns="http://www.w3.org/2000/svg"></svg>' +
			'<div class="rh-zoom"><button onclick="rivalHubZoom(0.8)">＋</button><button onclick="rivalHubZoom(1.25)">－</button><button onclick="rivalHubRefit()" title="Alles zeigen">⤢</button></div><div class="rh-tip" id="rh-tip" style="display:none;"></div></div>' +
			'<div class="rh-clusters" id="rh-clusters"></div>';
		if (!h.graph) h.graph = rivalHubBuildGraph();
		if (!h.graph.nodes.length) {
			document.querySelector('.rh-graphwrap').innerHTML = '<div class="rh-empty">Noch keine Verbindungen.<br><small>Bestätige unter „Vorschläge“ ein paar Rivalen – dann entstehen hier Cluster.</small></div>';
			return;
		}
		rivalHubFit(h.graph);
		drawRivalHubGraph(true);
		bindRivalHubGraph();
	}

	function drawRivalHubGraph(full) {
		const h = rivalHub, g = h.graph, svg = document.getElementById('rh-svg');
		if (!svg) return;
		svg.setAttribute('viewBox', g.vb.x + ' ' + g.vb.y + ' ' + g.vb.w + ' ' + g.vb.h);
		const dim = n => h.focus !== null && n.cl.idx !== h.focus;
		if (full || !svg.querySelector('.rh-n')) {
			let s = '<defs>' + g.nodes.map(n => '<clipPath id="rhc' + n.id + '"><circle r="' + rhR(n) + '"/></clipPath>').join('') + '</defs>';
			s += '<g id="rh-edges">' + g.edges.map((e, i) => '<line data-e="' + i + '" stroke="' + (e.kind === 'rival' ? rhColor(e.na, 60) : '#888') + '" stroke-width="' + (e.kind === 'rival' ? 2.5 : 1.3) + '"' + (e.kind === 'rival' ? '' : ' stroke-dasharray="5 5" opacity="0.45"') + '/>').join('') + '</g>';
			s += '<g id="rh-nodes">' + g.nodes.map(n => '<g class="rh-n" data-id="' + n.id + '" style="cursor:pointer"><circle r="' + (rhR(n) + 3) + '" fill="' + rhColor(n) + '"/><image href="' + imgUrl(n.img, 'thumb') + '" x="' + (-rhR(n)) + '" y="' + (-rhR(n)) + '" width="' + (2 * rhR(n)) + '" height="' + (2 * rhR(n)) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#rhc' + n.id + ')"/></g>').join('') + '</g>';
			svg.innerHTML = s;
			document.getElementById('rh-clusters').innerHTML = g.clusters.filter(c => c.length > 1).map(c => {
				const rivalsIn = c.filter(n => g.edges.some(e => e.kind === 'rival' && (e.na === n || e.nb === n))).length;
				const top = c.slice().sort((a, b) => b.img.elo - a.img.elo).slice(0, 3).map(n => escHtml(n.img.name)).join(', ');
				const avg = Math.round(c.reduce((s, n) => s + n.img.elo, 0) / c.length);
				return '<div class="rh-cl' + (h.focus === c.idx ? ' on' : '') + '" onclick="rivalHubFocus(' + c.idx + ')"><b style="background:hsl(' + Math.round(c.hue) + ',70%,58%)"></b>' +
					'Cluster ' + (c.idx + 1) + ' · ' + c.length + ' Bilder · Ø Elo ' + avg + '<br><span style="color:#888">' + top + '</span></div>';
			}).join('');
		}
		svg.querySelectorAll('line[data-e]').forEach(l => {
			const e = g.edges[l.dataset.e];
			l.setAttribute('x1', e.na.x); l.setAttribute('y1', e.na.y); l.setAttribute('x2', e.nb.x); l.setAttribute('y2', e.nb.y);
			l.style.opacity = h.focus !== null && (dim(e.na) || dim(e.nb)) ? 0.08 : '';
		});
		svg.querySelectorAll('.rh-n').forEach(el => {
			const n = g.nodes.find(x => x.id == el.dataset.id);
			el.setAttribute('transform', 'translate(' + n.x + ',' + n.y + ')');
			el.style.opacity = dim(n) ? 0.15 : '';
		});
	}
	function rivalHubFocus(i) { const h = rivalHub; h.focus = h.focus === i ? null : i; renderRivalHubGraph(); }
	function rivalHubZoom(f, cx, cy) {
		const vb = rivalHub.graph.vb; cx = cx === undefined ? vb.x + vb.w / 2 : cx; cy = cy === undefined ? vb.y + vb.h / 2 : cy;
		vb.x = cx - (cx - vb.x) * f; vb.y = cy - (cy - vb.y) * f; vb.w *= f; vb.h *= f; drawRivalHubGraph();
	}
	function rivalHubRefit() { rivalHubFit(rivalHub.graph); drawRivalHubGraph(); }

	function bindRivalHubGraph() {
		const h = rivalHub, g = h.graph, svg = document.getElementById('rh-svg'), tip = document.getElementById('rh-tip');
		const toWorld = ev => { const r = svg.getBoundingClientRect(); return { x: g.vb.x + (ev.clientX - r.left) / r.width * g.vb.w, y: g.vb.y + (ev.clientY - r.top) / r.height * g.vb.h }; };
		let drag = null, moved = false, raf = 0;
		const kick = () => { if (raf) return; raf = requestAnimationFrame(function tick() {
			raf = 0; if (rivalHub !== h || h.graph !== g) return;
			g.alpha = Math.max(g.alpha, 0.3); for (let i = 0; i < 2; i++) rivalHubStep(g); drawRivalHubGraph();
			if (drag && drag.node) raf = requestAnimationFrame(tick);
		}); };
		svg.addEventListener('pointerdown', ev => {
			const el = ev.target.closest('.rh-n'); moved = false;
			svg.setPointerCapture(ev.pointerId); svg.classList.add('drag');
			if (el) { const n = g.nodes.find(x => x.id == el.dataset.id); n.fixed = true; drag = { node: n, id: n.id }; }
			else drag = { pan: true, sx: ev.clientX, sy: ev.clientY, vx: g.vb.x, vy: g.vb.y };
		});
		svg.addEventListener('pointermove', ev => {
			if (!drag) {
				const el = ev.target.closest && ev.target.closest('.rh-n');
				if (el) { const n = g.nodes.find(x => x.id == el.dataset.id); tip.style.display = 'block'; tip.textContent = n.img.name + ' · Elo ' + Math.round(n.img.elo); } else tip.style.display = 'none';
				return;
			}
			moved = true;
			if (drag.node) { const w = toWorld(ev); drag.node.x = w.x; drag.node.y = w.y; kick(); }
			else { const r = svg.getBoundingClientRect(); g.vb.x = drag.vx - (ev.clientX - drag.sx) / r.width * g.vb.w; g.vb.y = drag.vy - (ev.clientY - drag.sy) / r.height * g.vb.h; drawRivalHubGraph(); }
		});
		const end = () => {
			svg.classList.remove('drag');
			if (drag && drag.node) {
				drag.node.fixed = false;
				if (!moved) { const id = drag.id; drag = null; showDetailsByID(id); return; }
			}
			drag = null;
		};
		svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
		svg.addEventListener('wheel', ev => { ev.preventDefault(); const w = toWorld(ev); rivalHubZoom(ev.deltaY > 0 ? 1.12 : 0.89, w.x, w.y); }, { passive: false });
	}

	async function resetDismissedRivals(imgId) {
		imgId = Number(imgId);
		const tx = db.transaction("images", "readwrite");
		const store = tx.objectStore("images");
		const img = await idbGet(store, imgId);
		if (!img) return;

		const ids = (img.rivals || []).filter(r => r.status === 'dismissed').map(r => r.id);
		img.rivals = (img.rivals || []).filter(r => r.status !== 'dismissed');
		store.put(img);

		for (const otherId of ids) {
			const other = await idbGet(store, otherId);
			if (other && other.rivals) {
				other.rivals = other.rivals.filter(r => !(r.id == imgId && r.status === 'dismissed'));
				store.put(other);
			}
		}
		tx.oncomplete = () => showDetailsByID(imgId);
	}

	function exportRankingsToCSV() {
		db.transaction("images").objectStore("images").getAll().onsuccess = function(e) {
			const allImgs = e.target.result;
			// nur Bilder des aktuellen Tabs filtern und nach Elo sortieren
			const tabImgs = allImgs
				.filter(img => img.tab === currentTab)
				.sort((a, b) => b.elo - a.elo);
	
			if (tabImgs.length === 0) {
				alert("Keine Bilder im aktuellen Tab zum Exportieren vorhanden.");
				return;
			}
	
			// CSV-Header definieren
			let csvContent = "Rang;Name;Elo;Wins;Losses;Matches Gesamt;Winrate (%)\n";
	
			// Datenzeilen generieren
			tabImgs.forEach((img, index) => {
				const rank = index + 1;
				// Hochkommas im Namen maskieren, um CSV-Parsing-Fehler zu vermeiden
				const safeName = `"${(img.name || 'Unbenannt').replace(/"/g, '""')}"`;
				const elo = Math.round(img.elo);
				const wins = img.wins || 0;
				const losses = img.losses || 0;
				const total = wins + losses;
				const winrate = total > 0 ? ((wins / total) * 100).toFixed(1) : "0.0";
	
				csvContent += `${rank};${safeName};${elo};${wins};${losses};${total};${winrate}\n`;
			});
	
			// Blob mit UTF-8-BOM erstellen (damit Excel Umlaute korrekt darstellt)
			const blob = new Blob(["\ufeff" + csvContent], { type: "text/csv;charset=utf-8;" });
			const url = URL.createObjectURL(blob);
			
			// Unsichtbaren Link erzeugen und Klick auslösen
			const a = document.createElement("a");
			a.href = url;
			const dateStr = new Date().toISOString().slice(0, 10);
			a.download = `Rangliste_${currentTab}_${dateStr}.csv`;
			document.body.appendChild(a);
			a.click();
			
			// Aufräumen
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
		};
	}

	async function populateMatchupStudio() {
		const selectA = document.getElementById('leftCharSelect');
		const selectB = document.getElementById('rightCharSelect');
		if (!selectA || !selectB) return;
	
		selectA.innerHTML = '<option>Lade Daten...</option>';
		selectB.innerHTML = '<option>Lade Daten...</option>';
	
		const allImages = await new Promise(r => db.transaction("images").objectStore("images").getAll().onsuccess = e => r(e.target.result));
		studioIdx = await getMatchIndex(); // gemeinsamer Index: nur lesen, nicht verändern
		studioDefs = await getTagDefinitionsForTab(currentTab);
	
		studioCurrentImages = allImages.filter(i => i.tab === currentTab).sort((a, b) => b.elo - a.elo);
		studioIds = new Set(studioCurrentImages.map(i => Number(i.id)));
	
		if (studioCurrentImages.length < 2) {
			selectA.innerHTML = '<option>Zu wenige Einträge in diesem Tab</option>';
			selectB.innerHTML = '<option>Zu wenige Einträge in diesem Tab</option>';
			return;
		}
	
		selectA.innerHTML = '';
		selectB.innerHTML = '';
	
		// Dropdowns befüllen
		studioCurrentImages.forEach((img) => {
			const title = img.name || img.title || `Eintrag #${img.id}`;
			selectA.add(new Option(title, img.id));
			selectB.add(new Option(title, img.id));
		});
	
		// AUSWAHL-PERSISTENZ: Prüfen, ob die letzten IDs noch im aktuellen Tab existieren
		const existsA = studioCurrentImages.some(img => img.id == lastStudioIdA);
		const existsB = studioCurrentImages.some(img => img.id == lastStudioIdB);
	
		if (lastStudioIdA !== null && lastStudioIdB !== null && existsA && existsB && lastStudioIdA !== lastStudioIdB) {
			selectA.value = lastStudioIdA;
			selectB.value = lastStudioIdB;
		} else {
			// Fallback: Ersten zwei Einträge
			selectA.selectedIndex = 0;
			selectB.selectedIndex = 1;
		}
	
		updateMatchupStudio();
	}
	
	function studioSetPair(idA, idB, hint) {
		document.getElementById('leftCharSelect').value = idA;
		document.getElementById('rightCharSelect').value = idB;
		updateMatchupStudio();
		const h = document.getElementById('studioHint');
		if (h) h.textContent = hint || '';
	}
	const studioPlayedCount = (a, b) => (studioIdx ? (opponentsOf(studioIdx, a.id).get(Number(b.id)) || 0) : 0);

	function studioPickRandom() {
		const imgs = studioCurrentImages;
		if (imgs.length < 2) return;
		const rnd = () => imgs[Math.floor(Math.random() * imgs.length)];
		let a, b, tries = 0;
		do { a = rnd(); b = rnd(); tries++; } while ((a === b || studioPlayedCount(a, b) > 0) && tries < 80);
		if (a === b) b = imgs.find(i => i !== a);
		const n = studioPlayedCount(a, b);
		studioSetPair(a.id, b.id, n === 0 ? 'Noch nie gegeneinander gespielt' : 'Haben schon ' + n + 'x gegeneinander gespielt');
	}

	async function studioPickRival() {
		const idA = document.getElementById('leftCharSelect').value;
		const imgA = studioCurrentImages.find(i => i.id == idA);
		if (!imgA) return;
		let cands = (imgA.rivals || []).filter(r => r.status === 'confirmed')
			.map(r => studioCurrentImages.find(i => i.id == r.id)).filter(Boolean);
		let hint = 'Bestätigter Rivale';
		if (!cands.length) {
			const defsByName = new Map(studioDefs.map(d => [d.tagName, d]));
			cands = computeRivalSuggestions(imgA, studioCurrentImages, defsByName).slice(0, 5).map(x => x.img);
			hint = 'Vorschlag nach Eigenschaften (noch nicht bestätigt)';
		}
		if (!cands.length) {
			const h = document.getElementById('studioHint');
			if (h) h.textContent = (imgA.name || 'A') + ' hat keine Rivalen und keine passenden Vorschläge.';
			return;
		}
		// Bevorzugt den Rivalen, gegen den A am seltensten gespielt hat
		const min = Math.min(...cands.map(c => studioPlayedCount(imgA, c)));
		const pool = cands.filter(c => studioPlayedCount(imgA, c) === min);
		const b = pool[Math.floor(Math.random() * pool.length)];
		const n = studioPlayedCount(imgA, b);
		studioSetPair(imgA.id, b.id, hint + ' · ' + (n === 0 ? 'noch nie gespielt' : n + 'x gespielt'));
	}

	function updateMatchupStudio() {
		const selectA = document.getElementById('leftCharSelect');
		const selectB = document.getElementById('rightCharSelect');
		if (!selectA || !selectB || !studioIdx) return;
	
		const idA = selectA.value;
		const idB = selectB.value;
	
		// Zuletzt gewählte IDs merken
		lastStudioIdA = idA;
		lastStudioIdB = idB;
	
		const imgA = studioCurrentImages.find(i => i.id == idA);
		const imgB = studioCurrentImages.find(i => i.id == idB);
		if (!imgA || !imgB) return;
	
		const n = studioCurrentImages.length;
		const coverage = img => n > 1 ? Math.floor((distinctOpponentCount(studioIdx, img.id, studioIds) / (n - 1)) * 100) : 0;
		const rankOf = img => studioCurrentImages.findIndex(i => i.id === img.id) + 1;
		const rateOf = img => (img.wins + img.losses) ? img.wins / (img.wins + img.losses) : 0;
		const getUrl = img => (img.blob instanceof Blob) ? imgUrl(img) : (img.blob || img.url || img.src || '');
	
		// Köpfe: Bild, Name, Elo, Eigenschaften
		[[imgA, 'Left'], [imgB, 'Right']].forEach(([img, side]) => {
			const el = document.getElementById('studio' + side + 'Img');
			el.src = getUrl(img);
			el.classList.toggle('fit-contain-img', isFitContain(img.tab));
			el.style.objectPosition = `center ${(img.y !== undefined ? img.y : 50)}%`;
			document.getElementById('studio' + side + 'Name').innerText = img.name || 'Eintrag ' + img.id;
			document.getElementById('studio' + side + 'Elo').innerHTML = `<b>${Math.round(img.elo)}</b> Elo · Platz ${rankOf(img)} von ${n}`;
			const tagsEl = document.getElementById('studio' + side + 'Tags');
			tagsEl.innerHTML = studioDefs
				.filter(d => img.tags && img.tags[d.tagName] && String(img.tags[d.tagName].value || '').trim() !== '')
				.map(d => '<span>' + escHtml(d.tagName) + ': ' + escHtml(String(img.tags[d.tagName].value)) + '</span>').join('');
		});
	
		// Direkte Duelle (neueste zuerst)
		const direct = matchesOf(studioIdx, idA)
			.filter(m => m.leftId == idB || m.rightId == idB)
			.sort((x, y) => (y.time || 0) - (x.time || 0));
		let winsA = 0, winsB = 0;
		const historyList = document.getElementById('studioMatchHistoryList');
		historyList.innerHTML = '';
		direct.forEach(m => {
			const aIsLeft = (m.leftId == idA);
			const winnerWasLeft = (m.winnerId === 'left' || m.winnerId == m.leftId);
			const aWon = (aIsLeft && winnerWasLeft) || (!aIsLeft && !winnerWasLeft);
			if (aWon) winsA++; else winsB++;
			const winner = aWon ? imgA : imgB;
			const li = document.createElement('li');
			li.className = 'st-row';
			li.innerHTML = '<span><span class="dot" style="background:' + (aWon ? 'var(--accent, #3b82f6)' : 'var(--accent-r, #f39c12)') + ';"></span>' + escHtml(winner.name || '') + '</span>' +
				'<span class="d">' + (m.time ? new Date(m.time).toLocaleDateString('de-DE') : '') + '</span>';
			historyList.appendChild(li);
		});
		if (!direct.length) historyList.innerHTML = '<li class="st-empty">Die beiden haben noch nicht gegeneinander gespielt.</li>';
	
		const total = direct.length;
		const winrateA = total > 0 ? (winsA / total) * 100 : 50;
		document.getElementById('studioScoreLeft').innerText = winsA;
		document.getElementById('studioScoreRight').innerText = winsB;
		document.getElementById('studioWinrateBarLeft').style.width = winrateA + '%';
		document.getElementById('studioMatchCount').innerText = `${total} Duell${total !== 1 ? 'e' : ''} absolviert`;
		const expA = 1 / (1 + Math.pow(10, (imgB.elo - imgA.elo) / 400));
		document.getElementById('studioExpect').innerText = `${Math.round(expA * 100)} : ${Math.round((1 - expA) * 100)}`;
	
		// Vergleichstabelle: das bessere Ergebnis je Zeile wird hervorgehoben
		const rows = [
			['Platz', rankOf(imgA), rankOf(imgB), v => '#' + v, true],
			['Elo', Math.round(imgA.elo), Math.round(imgB.elo), v => v, false],
			['Winrate', Math.round(rateOf(imgA) * 100), Math.round(rateOf(imgB) * 100), v => v + '%', false],
			['Duelle', imgA.wins + imgA.losses, imgB.wins + imgB.losses, v => v, false],
			['Abdeckung', coverage(imgA), coverage(imgB), v => v + '%', false],
			['Serie', imgA.streak || 0, imgB.streak || 0, v => (v > 0 ? '+' : '') + v, false],
			['Höchste Elo', Math.round(Math.max(imgA.peak || 0, imgA.elo)), Math.round(Math.max(imgB.peak || 0, imgB.elo)), v => v, false]
		];
		let cmp = '';
		rows.forEach(([label, va, vb, fmt, lowerBetter]) => {
			const better = va === vb ? 0 : ((lowerBetter ? va < vb : va > vb) ? 1 : 2);
			const cmpRow = label === 'Duelle' || label === 'Abdeckung'; // hier ist "mehr" kein Qualitätsmerkmal
			cmp += '<div class="v l' + (!cmpRow && better === 1 ? ' win' : '') + '">' + fmt(va) + '</div><div class="k">' + label + '</div><div class="v r' + (!cmpRow && better === 2 ? ' win' : '') + '">' + fmt(vb) + '</div>';
		});
		document.getElementById('studioCompare').innerHTML = cmp;
	
		updateIndirectComparison(idA, idB);
	}
	
	function forceSelectedMatchup() {
		const idA = document.getElementById('leftCharSelect').value;
		const idB = document.getElementById('rightCharSelect').value;
	
		if (idA === idB) {
			alert("Bitte zwei unterschiedliche Charaktere auswählen!");
			return;
		}
	
		const imgA = studioCurrentImages.find(i => i.id == idA);
		const imgB = studioCurrentImages.find(i => i.id == idB);
	
		if (typeof closeModal === 'function') closeModal();
	
		curL = imgA;
		curR = imgB;
	
		curL.globalRank = studioCurrentImages.findIndex(img => img.id === curL.id) + 1;
		curR.globalRank = studioCurrentImages.findIndex(img => img.id === curR.id) + 1;
	
		displaySide('left', curL);
		displaySide('right', curR);
		if (typeof updateProbDisplay === 'function') updateProbDisplay();
		if (typeof updateH2HStats === 'function') updateH2HStats();
	}
	
	function updateIndirectComparison(idA, idB) {
		const box = document.getElementById('studioIndirectComparison');
		if (!box || !studioIdx) return;
	
		const getOpponents = myId => {
			const opps = {};
			matchesOf(studioIdx, myId).forEach(m => {
				const oppId = (m.leftId == myId) ? m.rightId : m.leftId;
				if (oppId == idA || oppId == idB) return;
				if (!opps[oppId]) opps[oppId] = { wins: 0, total: 0 };
				opps[oppId].total++;
				const iAmLeft = (m.leftId == myId);
				const leftWon = (m.winnerId === 'left' || m.winnerId == m.leftId);
				if ((iAmLeft && leftWon) || (!iAmLeft && !leftWon)) opps[oppId].wins++;
			});
			return opps;
		};
	
		const oppsA = getOpponents(idA);
		const oppsB = getOpponents(idB);
		const commonIds = Object.keys(oppsA).filter(id => oppsB[id]);
	
		if (commonIds.length === 0) {
			box.innerHTML = '<span class="st-empty">Keine gemeinsamen Gegner vorhanden.</span>';
			return;
		}
	
		let html = '<div class="st-empty" style="margin-bottom:6px;">Siegquote von A : B gegen den jeweiligen Gegner</div><ul>';
		commonIds.forEach(oppId => {
			const oppChar = studioCurrentImages.find(i => i.id == oppId);
			const oppName = oppChar ? (oppChar.name || oppChar.title) : 'Eintrag #' + oppId;
			const rateA = Math.round((oppsA[oppId].wins / oppsA[oppId].total) * 100);
			const rateB = Math.round((oppsB[oppId].wins / oppsB[oppId].total) * 100);
			html += `<li class="st-row"><span>vs. <b>${escHtml(oppName || '')}</b></span>
				<span><span style="color:${rateA >= rateB ? 'var(--win, #2ecc71)' : 'var(--loss, #e74c3c)'}">${rateA}%</span> : 
				<span style="color:${rateB >= rateA ? 'var(--win, #2ecc71)' : 'var(--loss, #e74c3c)'}">${rateB}%</span></span></li>`;
		});
		html += '</ul>';
		box.innerHTML = html;
	}
</script>
