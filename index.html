<!DOCTYPE html>
<html lang="de">
<head>
<script>
    // Darstellung früh setzen, damit die Seite nicht kurz im anderen Design aufblitzt
    (function () {
        var t = 'arena';
        try { t = localStorage.getItem('theme') || 'arena'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t === 'plain' ? 'plain' : 'arena');
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f0f">
    <title>Image Ranker</title>
    <style>
		:root { 
            --bg: #0f0f0f; 
            --card: #1a1a1a; 
            --text: #eee; 
            --accent: #0078d7;  /* Akzentfarbe (per Tab änderbar) */
            --side-l: #0078d7;  /* Linke Seite im Duell (fest Blau) */
            --accent-r: #f39c12; /* Rechte Seite (Orange/Gold) */
            --win: #2ecc71; 
            --loss: #e74c3c; 
            --sidebar-left-w: 210px;
            --sidebar-right-w: 360px;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        @media screen and (max-width: 1500px) {
			body {
				zoom: 0.85;
				
				/* Dehnt die Seite vertikal aus, um den leeren Balken unten auszufüllen */
				min-height: 117.65vh; 
				box-sizing: border-box;
			}
		}
        /* Navigation & Header */
        #tabs { background: #000; padding: 8px; display: flex; gap: 6px; border-bottom: 2px solid var(--accent); align-items: center; overflow-x: auto; }
        .tab-container { display: flex; align-items: center; background: #2a2a2a; border-radius: 4px; overflow: hidden; }
        .tab { padding: 6px 12px; cursor: pointer; white-space: nowrap; font-size: 0.9em; }
        .tab.active { background: var(--accent); font-weight: bold; }
        .tab-delete { padding: 6px 8px; background: #333; cursor: pointer; color: #ff6b6b; border-left: 1px solid #111; }

        #controls { padding: 8px 15px; background: #161616; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #333; flex-wrap: wrap; }
        button { padding: 6px 14px; background: var(--accent); border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        button.danger { background: #d9534f; }
        button.secondary { background: #333; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Workspace Layout */
        #workspace { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            gap: 8px; /* NEU: Abstand zu den Sidebars nochmals minimiert */
            padding: 0 4px; 
        }
        
        /* FIX: Basis-Sidebar-Klasse nutzt jetzt die schlankere linke Breite */
        .sidebar { 
            width: var(--sidebar-left-w); 
            background: #0a0a0a; 
            padding: 12px 10px; /* Leicht kompakteres Innenpadding */
            border-right: 1px solid #222; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            overflow: hidden; 
            flex-shrink: 0; /* Verhindert, dass die Sidebar gequetscht wird */
        }
        
        /* FIX: Rechte Sidebar bekommt gezielt ihr breiteres Maß für die Rangliste */
        #sidebar-right { 
            width: var(--sidebar-right-w);
            border-right: none; 
            border-left: 1px solid #222; 
        }
		.sidebar h3 { margin: 0 0 5px 0; font-size: 0.8em; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
		
		/* NEU: Scrollbarer Bereich für die Top-Liste */
		#top20-list { 
			flex: 1; 
			overflow-y: auto; 
			padding-right: 4px;
			display: flex;
			flex-direction: column;
			gap: 8px;
			opacity: 0;
            transition: opacity 0.15s ease-in-out;
		}
		/* Klasse zum synchronen Aufdecken */
        #top20-list.ready {
            opacity: 1;
        }
		/* NEU: Feste Box für das letzte Duell unter der Liste */
		#last-match-container {
			flex-shrink: 0;
			border-top: 1px solid #222;
			padding-top: 10px;
			margin-top: auto;
			display: flex;
			flex-direction: column;
			gap: 8px;
			background: #0a0a0a;
		}

        /* Ranking Elements & Badges */
        .rank-item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #161616; border-radius: 5px; cursor: pointer; border: 1px solid transparent; font-size: 0.85em; transition: 0.2s; }
        .rank-item:hover { border-color: var(--accent); background: #222; }
        .rank-item img { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; }
        .change-indicator { font-weight: bold; margin-left: auto; font-size: 0.75em; }
        .up { color: var(--win); }
        .down { color: var(--loss); }

        /* History Log */
        .log-item { background: #161616; padding: 10px; border-radius: 6px; font-size: 0.75em; border-left: 3px solid var(--win); margin-bottom: 5px; }
        .log-images { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
        .log-img { width: 28px; height: 28px; border-radius: 3px; object-fit: cover; }

        /* Voting Central Area */
        #voting-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 10px; 
            position: relative; 
            width: 100%; /* Vergewissert sich, dass der Raum genutzt wird */
        }
        
        #matchup-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            gap: 30px; /* Angenehmer Abstand zwischen den beiden Bildern */
            flex: 1; 
            max-width: 100%; /* FIX: Erlaubt den Bildern, den freien Platz links/rechts auszufüllen */
        }
        
		.image-container { 
            flex: 1; 
            height: 86vh;
            max-height: 86vh; 
            aspect-ratio: 2 / 3; 
            max-width: 650px; 
            background: #111; 
            border-radius: 14px; 
            cursor: pointer; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            justify-content: space-between;
            /* Wichtig für das geschmeidige Hovern der Rahmenfarbe und des Sprung-Effekts */
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        [id="container-left"] {
            border: 5px solid rgba(59, 130, 246, 0.25);
        }
        [id="container-left"]:hover { 
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-5px);
        }

        [id="container-right"] {
            border: 5px solid rgba(234, 179, 8, 0.25);
        }
        [id="container-right"]:hover { 
            border-color: #eab308;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
            transform: translateY(-5px);
        }

        /* Bilder-Handling bleibt unverändert */
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            opacity: 0;
            transition: opacity 0.22s ease-in-out;
        }
        .image-container.ready img {
            opacity: 1;
        }
		
		.img-display { 
			flex: 1; /* Nimmt den restlichen Platz ein */
			background-size: cover; 
			background-position: center; 
			pointer-events: none; 
		}
        .glass-footer {
			background: rgba(0, 0, 0, 0.5) !important;
			backdrop-filter: blur(12px) saturate(180%);
			-webkit-backdrop-filter: blur(12px) saturate(180%);
			padding: 15px; 
			text-align: center; 
			border-top: 1px solid rgba(255,255,255,0.1);
		}
        #prob-container { width: 140px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #win-chance-bar { width: 16px; height: 250px; background: #222; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column-reverse; border: 1px solid #444; }
        #chance-l { background: var(--side-l); transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; }
        #chance-r { background: #666; transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; }

        /* Feedback Toast */
        .toast { position: absolute; font-weight: bold; font-size: 2em; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 100; text-shadow: 0 4px 12px rgba(0,0,0,0.9); }
        @keyframes floatUp { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(1.2); opacity: 0; } }

        /* Modals & Details */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; overflow-y: auto; padding: 40px; }
        .modal-content { background: var(--card); max-width: 950px; margin: auto; padding: 30px; border-radius: 16px; position: relative; border: 1px solid #333; }
        #search-box { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
		.graph-container { 
			position: relative;
			background: #0d0d0d; 
			border: 1px solid #222; 
			height: 180px; /* Auf 180px erhöht für ausreichend Platz */
			width: 100%; 
			padding: 20px 10px 10px 10px; /* 20px Padding oben verhindert das Hineinragen in die Überschrift */
			margin-top: 10px; 
			margin-bottom: 25px;
			border-radius: 6px; 
			box-sizing: border-box;
			overflow: visible; /* Damit Hover-Dots und Labels nicht abgeschnitten werden */
		}
		
		/* Gestrichelte Orientierungslinien */
		.graph-line {
			position: absolute;
			left: 0;
			right: 0;
			border-top: 1px dashed rgba(255, 255, 255, 0.15);
			pointer-events: none;
			z-index: 1;
		}
		
		.graph-line-label {
			position: absolute;
			right: 8px;
			top: -9px;
			font-size: 0.65em;
			font-family: monospace;
			color: #888;
			background: #0d0d0d;
			padding: 0 4px;
			border-radius: 2px;
		}
		
		/* H2H Box & Balken */
		.h2h-box { 
			width: 100%; background: #1a1a1a; padding: 10px; 
			border-radius: 8px; border: 1px solid #333; font-size: 0.75em; 
		}
		.h2h-bar-bg { 
			height: 6px; 
			background: var(--accent-r); /* Hintergrund ist jetzt die Farbe der rechten Seite */
			border-radius: 3px; 
			margin: 8px 0; 
			overflow: hidden; 
			display: flex; 
		}
		.h2h-bar-fill { background: var(--side-l); height: 100%; transition: width 0.5s; }
		
		/* Bestehendes Rank-Badge bleibt gleich */
		.rank-badge {
			position: absolute; 
			top: 15px; 
			left: 15px; 
			background: rgba(0,0,0,0.6); 
			padding: 4px 10px; 
			border-radius: 6px; 
			font-size: 0.8em; 
			font-weight: bold;
			border: 1px solid rgba(255,255,255,0.2);
			backdrop-filter: blur(5px);
			z-index: 10;
		}
		
		/* Peak-Badge unter dem Rank-Badge */
		.peak-badge {
			position: absolute; 
			top: 48px; /* Direkt unter dem Rank-Badge */
			left: 15px; 
			background: rgba(241, 196, 15, 0.9); 
			color: #000; /* Schwarz auf Gold für maximalen Kontrast */
			padding: 2px 8px; 
			border-radius: 4px; 
			font-size: 0.7em; 
			font-weight: 900;
			text-transform: uppercase;
			z-index: 10;
			box-shadow: 0 2px 5px rgba(0,0,0,0.3);
		}
		
		/* Streak-Badge mit dynamischen Farben */
		.streak-badge {
			position: absolute; 
			top: 15px; 
			right: 15px; 
			padding: 4px 12px; 
			border-radius: 20px; 
			font-size: 0.8em; 
			font-weight: bold;
			/* Diese Werte werden via JS überschrieben */
			background: rgba(0,0,0,0.5); 
			color: #fff;
			border: 1px solid #fff;
			animation: pulse 2s infinite;
			text-shadow: 0 1px 2px rgba(0,0,0,0.5);
			z-index: 10;
		}
		
		@keyframes pulse {
			0% { transform: scale(1); opacity: 1; }
			50% { transform: scale(1.05); opacity: 0.8; }
			100% { transform: scale(1); opacity: 1; }
		}
		/* Scrollbar-Styling für die Matchup-Tabelle */
		div::-webkit-scrollbar {
			width: 6px;
		}
		div::-webkit-scrollbar-track {
			background: #111;
		}
		div::-webkit-scrollbar-thumb {
			background: #333;
			border-radius: 3px;
		}
		div::-webkit-scrollbar-thumb:hover {
			background: var(--accent);
		}
		/* Styling für die Ranglisten-Tabelle */
		.leaderboard-table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 15px;
		}
		
		.leaderboard-table th {
			background: #1a1a1a;
			color: #888;
			font-size: 0.8em;
			text-transform: uppercase;
			letter-spacing: 1px;
			padding: 12px 10px;
			text-align: left;
		}
		
		.leaderboard-table td {
			padding: 10px;
			border-bottom: 1px solid #222;
			vertical-align: middle;
		}
		
		/* Kompakte Form-Dots für die Tabellenzeile */
		/* Kompakte Anordnung für die Form-Anzeige im Modal-Ranking */
		.form-dot-container {
			display: flex;
			gap: 4px;
			align-items: center;
		}
		.form-dot {
			width: 18px;
			height: 18px;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 4px;
			font-size: 0.7em;
			font-weight: bold;
		}
		.form-dot.w { background: var(--win); color: #000; }
		.form-dot.l { background: var(--loss); color: #fff; }
		.form-dot.t { background: #f1c40f; color: #000; }
		.outside-tag-container {
			/* Dynamische Anordnung: höchstens 4 pro Reihe, gleich breite Felder, letzte Reihe mittig.
			   Die Spaltenzahl (--cols) setzt die Anzeige je nach Anzahl der Eigenschaften. */
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 6px;
			padding: 10px;
			background: rgba(0, 0, 0, 0.3);
			border-top: 1px solid rgba(255, 255, 255, 0.05);
			width: 100%;
			box-sizing: border-box;
		}
		
		/* Die einzelnen Tags/Eigenschaften darin */
		.outside-tag-container > div, 
		.outside-tag-container > span {
			display: block;
			box-sizing: border-box;
			flex: 0 0 calc((100% - (var(--cols, 4) - 1) * 6px) / var(--cols, 4));
			min-width: 0;
			text-align: center;
			font-size: 0.75em;
			padding: 4px 2px;
			background: rgba(255, 255, 255, 0.07);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 4px;
			color: #ddd;
			/* Sorgt dafür, dass langer Text den Rahmen nicht sprengt */
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis; 
		}
		
		/* Optionale Mobile-Optimierung: Wenn der Bildschirm zu schmal wird, 
		rutschen die Eigenschaften automatisch unter die Kacheln */
		@media (max-width: 900px) {
			#matchup-container {
				flex-wrap: wrap;
				justify-content: center;
			}
			.outside-tag-container {
				min-width: 100%; /* Nimmt mobile die volle Breite unter/über dem Bild ein */
				order: 10; /* Setzt sie im Fluss nach unten */
			}
		}
	/* ==========================================
	MATCHUP STUDIO MODAL & LAYOUT
	========================================== */
	
	/* 1. Äußeres Overlay: Perfekt auf dem Bildschirm zentriert */
	#matchupStudioModal {
		position: fixed;
		top: 0;
		left: 0;
		width: 100vw;
		height: 100vh;
		background: rgba(0, 0, 0, 0.75);
		backdrop-filter: blur(4px);
		display: flex;
		align-items: center;     /* Vertikal zentrieren */
		justify-content: center; /* Horizontal zentrieren */
		z-index: 1000;
	}
	
	/* 2. Grauer Modal-Hintergrund (.modal-content): Groß, breit und umschließend */
	#matchupStudioModal .modal-content {
		background: #18181c;
		border: 1px solid #333;
		border-radius: 12px;
		padding: 24px;
		box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
		
		width: 92vw;
		max-width: 1300px;
		height: auto;
		max-height: 88vh;
		
		display: flex;
		flex-direction: column;
		box-sizing: border-box;
		overflow-y: auto;
	}
	
	/* 3. Haupt-Container im Modal */
	.matchup-studio-container {
		width: 100%;
		color: #eee;
		display: flex;
		flex-direction: column;
		gap: 16px;
		box-sizing: border-box;
	}
	
	.swap-btn {
		background: #222;
		border: 1px solid #444;
		color: #fff;
		border-radius: 6px;
		padding: 9px 16px;
		cursor: pointer;
		margin-top: 18px;
		font-size: 1.1em;
		transition: background 0.2s, transform 0.1s;
	}
	
	.swap-btn:hover {
		background: #333;
		transform: scale(1.05);
	}
	
	.btn-force-match {
		margin-top: 10px;
		padding: 10px 20px;
		background: #f1c40f;
		color: #111;
		font-weight: bold;
		border: none;
		border-radius: 6px;
		cursor: pointer;
		font-size: 0.95em;
		transition: transform 0.1s ease, background 0.2s ease;
	}
	
	.btn-force-match:hover {
		transform: scale(1.02);
		background: #f39c12;
	}
	
	.detail-box {
		background: #111;
		padding: 14px;
		border-radius: 8px;
		border: 1px solid #222;
		font-size: 0.9rem;
		display: flex;
		flex-direction: column;
		height: 220px; /* Feste, kompakte Höhe für beide Boxen */
		box-sizing: border-box;
	}
	
	.detail-box h4 {
		margin: 0 0 10px 0;
		color: var(--accent, #3b82f6);
		font-size: 0.8em;
		text-transform: uppercase;
		letter-spacing: 1px;
		flex-shrink: 0;
	}
	
	/* 5. Dynamisch scrollbare Listen in den festen Detailboxen */
	#studioIndirectComparison, 
	#studioMatchHistoryList,
	.history-mini-list {
		flex: 1;
		height: 100%;
		overflow-y: auto;
		margin: 0;
		padding-right: 6px;
		list-style: none;
		font-size: 0.85em;
		color: #aaa;
	}
	
	/* Dezent gestylter Scrollbalken */
	#studioIndirectComparison::-webkit-scrollbar,
	#studioMatchHistoryList::-webkit-scrollbar,
	.history-mini-list::-webkit-scrollbar {
		width: 5px;
	}
	
	#studioIndirectComparison::-webkit-scrollbar-thumb,
	#studioMatchHistoryList::-webkit-scrollbar-thumb,
	.history-mini-list::-webkit-scrollbar-thumb {
		background: rgba(255, 255, 255, 0.2);
		border-radius: 3px;
	}
	/* Pro Tab einstellbar (Einstellungen → Bilddarstellung): ganzes Bild statt Zuschnitt */
	.fit-contain {
		background-size: contain !important;
		background-repeat: no-repeat !important;
		background-position: center center !important;
		background-color: rgba(0, 0, 0, 0.4); /* Dezent abgedunkelter Rand */
	}

/* =====================================================================
   DARSTELLUNG "ARENA"  (umschaltbar in den Einstellungen; ohne Attribut gilt das schlichte Design)
   Konzept: Zwei Ecken (links Kobalt, rechts Bernstein), die Bilder stehen im Licht ihrer Ecke.
   ===================================================================== */
html[data-theme="arena"] {
    --bg: #17162a;
    --card: #211f38;
    --text: #ece9f7;
    --accent: #7b96ff;      /* Akzentfarbe (per Tab änderbar) */
    --side-l: #7b96ff;      /* linke Ecke im Duell: Kobalt (fest) */
    --accent-r: #ffb43a;    /* rechte Ecke: Bernstein */
    --win: #5fd6a0;
    --loss: #ff7070;
    --surface: #1f1d35;
    --surface-2: #272546;
    --line: #34315a;
    --muted: #9893bd;
    --radius: 14px;
}
html[data-theme="arena"] body {
    font-family: 'Bricolage Grotesque', 'Segoe UI Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-variant-numeric: tabular-nums;
    background:
        radial-gradient(ellipse 55% 70% at 18% 62%, rgba(123,150,255,0.13), transparent 70%),
        radial-gradient(ellipse 55% 70% at 82% 62%, rgba(255,180,58,0.10), transparent 70%),
        var(--bg);
    background-attachment: fixed;
    letter-spacing: 0.005em;
}

/* Reiter: ruhige Textleiste mit Unterstrich statt Kästchen */
html[data-theme="arena"] #tabs { background: transparent; border-bottom: 1px solid var(--line); padding: 10px 18px 0; gap: 18px; }
html[data-theme="arena"] #tab-list { gap: 4px !important; }
html[data-theme="arena"] .tab-container { background: transparent; border-radius: 0; overflow: visible; position: relative; }
html[data-theme="arena"] .tab { padding: 8px 14px 11px; color: var(--muted); font-size: 0.95em; border-bottom: 3px solid transparent; transition: color .15s, border-color .15s; }

/* =====================================================================

<body>

<div id="tabs">

</div>

<script>
    /* =====================================================================
       ENTWICKLER-NOTIZEN (nur Kommentar, ändert nichts am Verhalten)
       ---------------------------------------------------------------------
       Eine einzige HTML-Datei: <style> (Basis, dann Themes/Module/Handy ganz unten), HTML-Gerüst, dieses Skript.
       Das Skript ist in Abschnitte gegliedert, im Code über "// ===== NAME =====" zu finden:
         EINSTELLUNGEN · Duell/Matchmaking (loadMatchup, submitVote) · Rangliste/Seitenleiste · Details (showDetailsByID)
         Statistik (openStats) · BACKUP-HINWEIS · BACKUP-DATEI (ZIP) · Import/Export · Rückgängig · Tabs
         EINSTELLUNGSFENSTER · RANGLISTE (Spalten/Kacheln/Mehrfachauswahl) · DETAIL-NAVIGATION & RANG-VERLAUF
         STATISTIK-INSIGHTS · TAB-AKZENTFARBE · LIGHTBOX · BILDER HOCHLADEN/DUPLIKATE · DATENPFLEGE · MATCH-CACHE
         BILD-URLS & VORSCHAUBILDER · EIGENSCHAFTS-WERTE · ANZEIGE-EINSTELLUNGEN · TAGESZIEL · TAG-FILTER
         TAG-STATISTIK · RIVALEN · Matchup Studio
       Datenhaltung:
         IndexedDB "ImageRankerDB" (v8): images, matches, tagDefinitions, thumbs.
           image: {id, tab, name, blob, elo, wins, losses, streak, peak, history[], y, tags{Name:{value, values?}}, rivals[{id,status}], links[], hash}
           match: {id, leftId, rightId, winnerId:'left'|'right', delta (Betrag), tab, time}
           tagDefinition: {id, tab, tagName, type:'exact'|'multi'|'number', options[], tolerance}
         localStorage: tabs, activeTab, focusId/focusCount, settings (wird im Backup mitgesichert), matchFilters,
                       theme, uiPrefs, rankView, lastBackupAt (diese vier nur pro Gerät)
       Konventionen:
         · Matches werden über getMatches()/getMatchIndex() gelesen (Cache); nach direkten Schreibzugriffen invalidateMatchCache().
         · Keine confirm()/prompt() innerhalb einer offenen IndexedDB-Transaktion (sie läuft sonst ab).
         · Neue Einstellungen: DEFAULT_SETTINGS + sanitizeSettings() ergänzen, dann Eingabe im Einstellungsfenster.
         · Farben in JS-erzeugtem HTML als var(--surface, #alt) schreiben, damit beide Designs (Arena/Schlicht) passen.
         · Handy-Layout steht gesammelt im CSS-Block "SMARTPHONE" am Ende des <style>.
       ===================================================================== */
    let db = null;
    let currentTab = localStorage.getItem('activeTab') || "Standard";
    let tabs = JSON.parse(localStorage.getItem('tabs')) || ["Standard"];
    let curL = null, curR = null;
    // Rückgängig: pro Tab ein Stapel der letzten Duelle (nur Duell-Felder werden zurückgesetzt, Tags/Rivalen bleiben unberührt)
    const UNDO_LIMIT = 50;
    const undoStacks = {};   // Tab -> [{ tab, L, R, matchId, logEl, focusBefore }]

	// base: Werte, auf die bei fehlenden/ungültigen Einträgen zurückgefallen wird (Standard: DEFAULT_SETTINGS)
	function sanitizeSettings(raw, base) {
		const d = base || DEFAULT_SETTINGS;
		const r = (raw && typeof raw === 'object') ? raw : {};
		const num = (v, min, max, def) => {
			if (v === null || v === undefined || v === '') return def;
			const n = Number(v);
			return isFinite(n) ? Math.min(max, Math.max(min, n)) : def;
		};
		const out = {
			matchupMode: Object.prototype.hasOwnProperty.call(MATCHUP_MODES, r.matchupMode) ? r.matchupMode : d.matchupMode,
			focusMatches: Math.round(num(r.focusMatches, 1, 100000, d.focusMatches)),
			eloWindow: Math.round(num(r.eloWindow, 10, 2000, d.eloWindow)),
			shareOutside: num(r.shareOutside, 0, 1, d.shareOutside),
			shareRival: num(r.shareRival, 0, 1, d.shareRival),
			uncertainBelow: Math.round(num(r.uncertainBelow, 0, 500, d.uncertainBelow)),
			newbieBoost: r.newbieBoost === undefined ? !!d.newbieBoost : (r.newbieBoost === true || r.newbieBoost === 'true'),
			tagWeights: {},
			dailyGoals: {},
			tagOrder: {},
			imageFit: {},
			tabAccent: {}
		};
		const to = (r.tagOrder && typeof r.tagOrder === 'object') ? r.tagOrder : d.tagOrder;
		Object.keys(to || {}).forEach(tab => {
			if (Array.isArray(to[tab])) {
				const names = to[tab].filter(n => typeof n === 'string' && n !== '');
				if (names.length) out.tagOrder[tab] = names.filter((n, i) => names.indexOf(n) === i);
			}
		});
		const fit = (r.imageFit && typeof r.imageFit === 'object') ? r.imageFit : d.imageFit;
		Object.keys(fit || {}).forEach(tab => { if (fit[tab] === 'contain') out.imageFit[tab] = 'contain'; });
		const ta = (r.tabAccent && typeof r.tabAccent === 'object') ? r.tabAccent : d.tabAccent;
		Object.keys(ta || {}).forEach(tab => { if (/^#[0-9a-fA-F]{6}$/.test(String(ta[tab]))) out.tabAccent[tab] = String(ta[tab]).toLowerCase(); });
		const dg = (r.dailyGoals && typeof r.dailyGoals === 'object') ? r.dailyGoals : d.dailyGoals;
		Object.keys(dg || {}).forEach(tab => {
			const n = Math.round(Number(dg[tab]));
			if (isFinite(n) && n >= 1) out.dailyGoals[tab] = Math.min(100000, n);
		});
		if (out.shareOutside + out.shareRival > 1) out.shareOutside = 1 - out.shareRival;
		const src = (r.tagWeights && typeof r.tagWeights === 'object') ? r.tagWeights : d.tagWeights;
		Object.keys(src).forEach(tab => {
			const tw = src[tab];
			if (!tw || typeof tw !== 'object') return;
			Object.keys(tw).forEach(tag => {
				const n = Number(tw[tag]);
				if (isFinite(n) && n >= 0) {
					if (!out.tagWeights[tab]) out.tagWeights[tab] = {};
					out.tagWeights[tab][tag] = Math.min(100, n);
				}
			});
		});
		return out;
	}

	// Die Logik-Funktion, die alles berechnet
	function getRating(elo, minRange, maxRange) {
		// Falls min und max gleich sind (z.B. nur 1 Bild), ist es automatisch ein "A" oder "S"
		if (maxRange === minRange) {
			return { score: 100, tierLabel: 'S', color: '#ff4d4d' };
		}
	
		// Die dynamische Score-Formel
		// $Score = \frac{Elo - Min}{Max - Min} \cdot 100$
		let score = ((elo - minRange) / (maxRange - minRange)) * 100;
		score = Math.max(0, Math.min(100, Math.round(score)));
	
		// Tier aus der Config finden
		const tier = RATING_CONFIG.tiers.find(t => score >= t.min) || RATING_CONFIG.tiers[RATING_CONFIG.tiers.length - 1];
	
		return { score, tierLabel: tier.label, color: tier.color };
	}

	async function updateRanking() {
		// IndexedDB Abfragen für Bilder und Matches
		const all = await new Promise(r => db.transaction("images").objectStore("images").getAll().onsuccess = e => r(e.target.result));
		const matchIdx = await getMatchIndex();

		const currentRanks = {};
		const listIdSet = new Set(list.map(i => Number(i.id)));
		list.forEach((img, i) => {
			currentRanks[img.id] = i + 1; // Speichert den aktuellen Rang für alle Bilder
		});
	
		// 2. Rang-Snapshot in den 10-Matches-History-Buffer schieben
		rankHistoryBuffer.push({ ...currentRanks });
		if (rankHistoryBuffer.length > 10) {
			rankHistoryBuffer.shift(); // Ältester Stand fällt weg (rollendes 10-Match-Fenster)
		}
	
		// Hilfsfunktion zum Erstellen eines Ranking-Items
		const createRankItem = (img, rank) => {

			div.className = 'rank-item'; 
			div.onclick = () => showDetailsByID(img.id);
			
			div.style.display = 'flex';
			div.style.alignItems = 'center';
			div.style.justifyContent = 'space-between';

		// --- A. ABDECKUNG (COVERAGE) BERECHNEN ---

		if (list.length > 1) {

		}
		
		// --- B. BADGES ZUSAMMENSTELLEN ---
		let badges = ''; 
		if (img.elo >= (img.peak || 0) && (img.wins + img.losses >= 5)) badges += '⭐';
		if (img.streak >= 3) badges += '🔥';
		if (img.streak <= -3) badges += '❄️';
		if (img.wins + img.losses < 5) badges += '🆕';
		
	
			const formattedRank = String(rank).padStart(3, '0');
			
			// Haupt-Inhaltsbereich links
			const contentLeft = document.createElement('div');
			contentLeft.style.cssText = "display:flex; align-items:center; gap:8px; min-width:0; flex:1;";
			
			const rankB = document.createElement('b');
			rankB.style.cssText = "font-family:monospace; flex-shrink:0;";

			const infoDiv = document.createElement('div');

			const nameRow = document.createElement('div');
			nameRow.style.cssText = "display:flex; align-items:center; gap:4px; width:100%;";
			
			const nameB = document.createElement('b');
			nameB.style.cssText = "white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; min-width:0; flex:1;";
			nameB.title = `${img.name} (Abdeckung: ${coveragePercent}%)`;
			nameB.textContent = img.name;

				const badgeSpan = document.createElement('span');
				badgeSpan.style.cssText = "flex-shrink:0; white-space:nowrap;";
				badgeSpan.textContent = badges;
				badgeSpan.title = coveragePercent >= 100 ? "100% Abdeckung gegen alle Einträge" : `Abdeckung: ${coveragePercent}%`;

			const eloSmall = document.createElement('small');
			eloSmall.style.cssText = "display:block; color:#aaa; margin-top:1px;";
			eloSmall.textContent = `${Math.round(img.elo)} Elo • ${coveragePercent}% Cov`;
			
			infoDiv.appendChild(nameRow);
			infoDiv.appendChild(eloSmall);
			
			contentLeft.appendChild(rankB);
			contentLeft.appendChild(avatarImg);
			contentLeft.appendChild(infoDiv);
			
			div.appendChild(contentLeft);
			
			// --- C. PERSISTENTE CHANGE-INDIKATOREN (RECHTS) ---
			const indicatorDiv = document.createElement('div');
			indicatorDiv.style.cssText = "flex-shrink:0;";
			
			// Vergleicht mit dem Stand von vor 10 Matches aus dem Buffer (oder previousRankMap als Fallback)
			const referenceMap = (rankHistoryBuffer.length > 0) ? rankHistoryBuffer[0] : (typeof previousRankMap !== 'undefined' ? previousRankMap : null);
			
			if (referenceMap && referenceMap[img.id]) {
				const diff = referenceMap[img.id] - rank;
				if (diff > 0) {
					indicatorDiv.className = "change-indicator up";
					indicatorDiv.textContent = `▲ ${diff}`;
					indicatorDiv.title = `+${diff} Plätze in den letzten Matches`;

			} else {
				indicatorDiv.style.width = "35px";

			div.appendChild(indicatorDiv);

		// 3. Rendere Top 100 in den scrollbaren Bereich
		list.slice(0, 50).forEach((img, i) => {
			cont.appendChild(createRankItem(img, i + 1));
		});
		
		// CSS-Tipp: Damit nur ca. 10 Einträge sichtbar sind und danach gescrollt wird,

		// 2. FOKUS-UMFELD SECTION (Nur sichtbar, wenn focusId aktiv ist)
		let focusCont = document.getElementById('focus-neighborhood-container');
		if (!focusCont) {

			focusCont.id = 'focus-neighborhood-container';

				title.innerText = `🎯 Fokus-Umfeld (#${focusIndex + 1})`;
				focusCont.appendChild(title);
		
				// Bereich von -2 bis +2 Plätzen um den Fokus-Eintrag
				const startIdx = Math.max(0, focusIndex - 3);
				const endIdx = Math.min(list.length - 1, focusIndex + 3);
		
				for (let i = startIdx; i <= endIdx; i++) {
					const item = list[i];
					const rankItem = createRankItem(item, i + 1);
		
					// Den eigentlichen Fokus-Eintrag optisch hervorheben
					if (item.id == focusId) {
						rankItem.style.border = "1px solid #3b82f6";
						rankItem.style.background = "rgba(59, 130, 246, 0.1)";
					}
		
					focusCont.appendChild(rankItem);
				}
			}
		}
		
		
		// 3. LETZTES DUELL SECTION (Mit Deduplizierung gegenüber dem Fokus)
		const lastEntry = undoTop();
		if (lastEntry && lastMatchCont) {
			const title = document.createElement('h3');
			title.style.cssText = "margin: 15px 0 5px 0; font-size: 0.8em; color: var(--accent); text-transform: uppercase; letter-spacing: 1px;";
			title.innerText = "Letztes Duell";
			lastMatchCont.appendChild(title);
		
			const lastMatchItems = [];
			[lastEntry.L.id, lastEntry.R.id].forEach(id => {
				// Falls dieser Duellant bereits im Fokus-Umfeld gezeigt wird, überspringen wir ihn auf Wunsch
				const isAlreadyInFocus = (focusCount > 0 && focusId !== null && id == focusId);
		
				if (!isAlreadyInFocus) {
					const imgData = list.find(img => img.id === id);
					if (imgData) {
						lastMatchItems.push({ 
							data: imgData, 
							rank: currentRanks[id] 
						});
					}
				}
			});
		
			// Nach Rang sortieren
			lastMatchItems.sort((a, b) => a.rank - b.rank);
		
			// Render-Karten anhängen
			if (lastMatchItems.length > 0) {
				lastMatchItems.forEach(item => {
					lastMatchCont.appendChild(createRankItem(item.data, item.rank));

		}

		const sidebarImgs = cont.querySelectorAll('img');
		const lastMatchImgs = lastMatchCont.querySelectorAll('img');
		const decodePromises = [];
	
		// 1. Die wichtigsten Avatare der Top-Liste überwachen (max. Top 20)
		const checkLimit = Math.min(sidebarImgs.length, 20);
		for (let i = 0; i < checkLimit; i++) {
			if (sidebarImgs[i]) {
				decodePromises.push(sidebarImgs[i].decode().catch(() => Promise.resolve()));
			}
		}
	
		// 2. Zusätzlich die Bilder aus dem "Letzten Duell" überwachen
		lastMatchImgs.forEach(img => {
			decodePromises.push(img.decode().catch(() => Promise.resolve()));
		});
	
		// Failsafe-Timer: Nach maximal 250ms wird alles in jedem Fall sichtbar gemacht
		const sidebarTimeout = new Promise(resolve => setTimeout(resolve, 250));
	
		Promise.race([
			Promise.all(decodePromises),
			sidebarTimeout
		]).then(() => {
			requestAnimationFrame(() => {
				cont.classList.add('ready');
			});
		});
	}
	
	async function updateH2HStats() {
		const matchIdx = await getMatchIndex();
		const rb = document.getElementById('rival-badge');
		if (rb) {
			const isRival = !!(curL && curR && (curL.rivals || []).some(r => r.status === 'confirmed' && r.id == curR.id));
			rb.style.display = isRival ? 'inline-block' : 'none';
		}
		
		// Alle Matches zwischen diesen beiden Bildern
		const relevant = matchesOf(matchIdx, curL.id).filter(m => m.leftId == curR.id || m.rightId == curR.id);
	
		let winsL = 0, winsR = 0;
		relevant.forEach(m => {
			// Prüft, ob Bild L gewonnen hat (entweder als linkes oder rechtes Bild im Match)
			const curLWon = (m.winnerId === 'left' && m.leftId == curL.id) || (m.winnerId === 'right' && m.rightId == curL.id);
			
			if (curLWon) {
				winsL++;
			} else {
				winsR++;
			}
		});
	
		const total = relevant.length;
		document.getElementById('h2h-count').innerText = `${total} Duell${total !== 1 ? 'e' : ''}`;
		document.getElementById('h2h-win-l').innerText = winsL;
		document.getElementById('h2h-win-r').innerText = winsR;
		
		// Balken-Logik (50% bei 0 Matches, sonst prozentual)
		document.getElementById('h2h-bar-fill').style.width = total === 0 ? "50%" : (winsL / total * 100) + "%";
	}
	
	// Wählt den Gegner im STANDARD-Modus: Rivale / Zufall von außerhalb / Elo-Nachbar
	function pickStandardOpponent(left, candidates, matchIdx) {
		const cfg = {
			...STANDARD_MATCHMAKING,
			eloWindow: settings.eloWindow,
			shareOutside: settings.shareOutside,
			shareRival: settings.shareRival
		};
		const pick = arr => arr[Math.floor(Math.random() * arr.length)];

		// Wiederholungssperre (nur, wenn dadurch noch Kandidaten übrig bleiben)
		let pool = candidates;
		if (cfg.avoidRepeatPair && lastVotedPair) {
			const filtered = candidates.filter(c => !isSamePair(lastVotedPair, left.id, c.id));
			if (filtered.length > 0) pool = filtered;
		}

		// Elo-Nachbarn: Fenster, bei zu wenig Kandidaten die nächsten N nach Elo
		const byDistance = [...pool].sort((a, b) => Math.abs(a.elo - left.elo) - Math.abs(b.elo - left.elo));
		let neighbors = byDistance.filter(c => Math.abs(c.elo - left.elo) <= cfg.eloWindow);
		if (neighbors.length < cfg.minNeighbors) neighbors = byDistance.slice(0, cfg.minNeighbors);
		const neighborIds = new Set(neighbors.map(c => c.id));
		const outside = pool.filter(c => !neighborIds.has(c.id));

		// Bestätigte Rivalen (nur aus dem aktuellen Tab / Kandidatenkreis)
		const rivalIds = new Set((left.rivals || []).filter(r => r.status === 'confirmed').map(r => r.id));
		const rivals = pool.filter(c => rivalIds.has(c.id));

		const roll = Math.random();

		// 1. Rivale (bevorzugt den, gegen den am seltensten gespielt wurde)
		if (roll < cfg.shareRival && rivals.length > 0) {
			const oppMap = opponentsOf(matchIdx, left.id);
			const counts = {};
			rivals.forEach(r => { counts[r.id] = oppMap.get(Number(r.id)) || 0; });
			const minCount = Math.min(...rivals.map(r => counts[r.id]));
			return pick(rivals.filter(r => counts[r.id] === minCount));
		}

		// 2. Zufälliger Gegner von außerhalb des Elo-Bereichs
		if (roll >= cfg.shareRival && roll < cfg.shareRival + cfg.shareOutside && outside.length > 0) {
			return pick(outside);
		}

		// 3. Elo-Nachbar (auch Fallback für alle anderen Fälle)
		return pick(neighbors.length > 0 ? neighbors : pool);
	}

	function isSamePair(pair, idA, idB) {
		return (pair[0] == idA && pair[1] == idB) || (pair[0] == idB && pair[1] == idA);
	}

	async function loadMatchup() {
        const all = await new Promise(r => db.transaction("images").objectStore("images").getAll().onsuccess = e => r(e.target.result));
        const matchIdx = await getMatchIndex();
        
        const list = all.filter(i => i.tab === currentTab).sort((a,b) => b.elo - a.elo);
        if (list.length < 2) return;

        // Duell-Filter: schränkt nur die Auswahl der Duellanten ein. Elo und Ränge bleiben global (list).
        let pool = list;
        const mf = matchFilters[currentTab];
        if (filterIsActive(mf)) {
            const defsByName = await getDefsByName(currentTab);
            const filtered = list.filter(i => imageMatchesFilter(i, mf, defsByName));
            if (filtered.length >= 2) pool = filtered;
            updateFilterUI({ matching: filtered.length, total: list.length, tooFew: filtered.length < 2 });
        } else {
            updateFilterUI(null);
        }
    
        // Variablen für diese Runde initialisieren
        curL = null;
        curR = null;
    
        // Nach "Rückgängig": das zuletzt gewertete Duell erneut zeigen
        if (forcedPair) {
            const a = list.find(i => i.id == forcedPair[0]);
            const b = list.find(i => i.id == forcedPair[1]);
            forcedPair = null;
            if (a && b && a.id !== b.id) { curL = a; curR = b; }
        }
    
        // --- 1. LINKES BILD (CURL) BESTIMMEN ---
        if (!curL && focusCount > 0 && focusId !== null) {
            curL = list.find(i => i.id == focusId);
            if (!curL) {
                focusId = null;
                focusCount = 0;
            }
        }
        
        // Nur wenn KEIN Fokus aktiv ist (oder der Fokus ungültig war), wird curL bestimmt
        if (!curL) {
            if (settings.matchupMode === "COVERAGE") {
                // Das Bild mit den wenigsten verschiedenen Gegnern (bei Gleichstand das mit der höchsten Elo)
                const listIds = new Set(pool.map(i => Number(i.id)));
                const coverageMap = {};
                pool.forEach(img => { coverageMap[img.id] = distinctOpponentCount(matchIdx, img.id, listIds); });
                const sortedByCoverage = [...pool].sort((a,b) => coverageMap[a.id] - coverageMap[b.id]);
                curL = sortedByCoverage[0];
            } 
            
            // Fallback: Wenn STANDARD aktiv ist ODER die Modus-Sortierung oben kein Bild geliefert hat
            if (!curL) {
                const avgM = pool.reduce((s, i) => s + (i.wins + i.losses), 0) / pool.length;
                const underdogs = pool.filter(i => (i.wins + i.losses) < avgM);
                const poolL = (underdogs.length > 0 && Math.random() > 0.3) ? underdogs : pool;
                curL = poolL[Math.floor(Math.random() * poolL.length)];
            }
        }
        
        // Sicherheitsnetz: Falls curL IMMER NOCH null ist (sollte unmöglich sein), brechen wir sauber ab
        if (!curL) return;
        
        // --- 2. RECHTES BILD (CURR) GEZIELT DAZU MATCHEN ---
        let potR = pool.filter(i => i.id !== curL.id);
        if (potR.length === 0) return;
        
        if (!curR && settings.matchupMode === "COVERAGE") {
            // Gegner, gegen den das linke Bild bisher am seltensten gespielt hat (bei Gleichstand zufällig)
            const oppMap = opponentsOf(matchIdx, curL.id);
            const groups = {};
            potR.forEach(img => {
                const count = oppMap.get(Number(img.id)) || 0;
                if (!groups[count]) groups[count] = [];
                groups[count].push(img);
            });
            const minCount = Math.min(...Object.keys(groups).map(Number));
            const bestOpponents = groups[minCount];
            curR = bestOpponents[Math.floor(Math.random() * bestOpponents.length)];
        } 
        
        // STANDARD (oder COVERAGE nicht möglich): Elo-Nachbarn / Außerhalb / Rivalen
        if (!curR) {
            curR = pickStandardOpponent(curL, potR, matchIdx);
        }
    
        // --- 3. RANGBERECHNUNG & DISPLAY ---
        curL.globalRank = list.findIndex(img => img.id === curL.id) + 1;
        curR.globalRank = list.findIndex(img => img.id === curR.id) + 1;
    
        // Kontext für die Coverage-Anzeige (bezogen auf alle Bilder des Tabs, nicht auf den Filter)
        duelCtx = { tab: currentTab, idx: matchIdx, ids: new Set(list.map(i => Number(i.id))), n: list.length };
        updateDailyProgress(list.length);

        // 1. NUR die Bilder in den Containern unsichtbar machen (passend zum CSS)
        const containers = document.querySelectorAll('.image-container');
        containers.forEach(c => c.classList.remove('ready'));

        // 2. Jetzt die Daten in die UI injizieren (displaySide schreibt die neuen src-Pfade)
        displaySide('left', curL); 
        displaySide('right', curR);
        updateProbDisplay();
        await updateH2HStats();

        // 3. Beide Bilder vollständig dekodieren lassen, bevor sie eingeblendet werden (höchstens 800 ms warten)
        const preload = img => { const im = new Image(); im.src = imgUrl(img); return im.decode().catch(() => {}); };
        await Promise.race([
            Promise.all([preload(curL), preload(curR)]),
            new Promise(resolve => setTimeout(resolve, 800))
        ]);
        requestAnimationFrame(() => {
            containers.forEach(c => c.classList.add('ready'));
        });
	}
	async function submitVote(result) {
		if (!curL || !curR) return;
		lastVotedPair = [curL.id, curR.id];
		
		// Snapshot für Platzierungs-Anzeige
		const all = await new Promise(r => db.transaction('images').objectStore('images').getAll().onsuccess = e => r(e.target.result));
		const listBefore = all.filter(i => i.tab === currentTab).sort((a,b) => b.elo - a.elo);
		previousRankMap = {};
		listBefore.forEach((img, i) => { previousRankMap[img.id] = i + 1; });
	
		const tx = db.transaction(['images', 'matches'], 'readwrite');
		const undoEntry = { tab: currentTab, L: duelFields(curL), R: duelFields(curR), focusBefore: { id: focusId, count: focusCount }, matchId: undefined, logEl: null };
	
		// Elo-Berechnung: scoreL ist jetzt nur noch 1 (Sieg) oder 0 (Niederlage)
		const gamesMin = Math.min(curL.wins + curL.losses, curR.wins + curR.losses);
		const k = (settings.newbieBoost && gamesMin < settings.uncertainBelow) ? 48 : 32;
		const expL = 1 / (1 + Math.pow(10, (curR.elo - curL.elo) / 400));
		const scoreL = result === 'left' ? 1 : 0; 
		const delta = k * (scoreL - expL);
	
		showToast(result === 'left' ? 'img-left' : 'img-right', delta);
	
		// Elo-Werte anpassen
		curL.elo += delta; 
		curR.elo -= delta;
	
		// Stats und Streaks aktualisieren
		if (result === 'left') { 
			curL.wins++; 
			curR.losses++; 
			
			// Gewinner: Wenn vorher im Minus (Pechsträhne), starte bei 1, sonst +1
			curL.streak = (curL.streak > 0) ? curL.streak + 1 : 1; 
			
			// Verlierer: Wenn vorher im Plus (Siegesserie), starte bei -1, sonst weiter ins Minus
			curR.streak = (curR.streak < 0) ? curR.streak - 1 : -1; 
		} else { 
			curR.wins++; 
			curL.losses++; 
			
			// Gewinner: Gleiches Spiel für Rechts
			curR.streak = (curR.streak > 0) ? curR.streak + 1 : 1; 
			
			// Verlierer: Gleiches Spiel für Links
			curL.streak = (curL.streak < 0) ? curL.streak - 1 : -1; 
		}
	
		// Historie und Peak speichern
		[curL, curR].forEach(img => {
			if (!img.history) img.history = [1200];
			img.history.push(Math.round(img.elo));
			img.peak = Math.max(img.peak || 1200, img.elo);
			tx.objectStore('images').put(img);
		});
	
		// Nach der Elo-Berechnung und Streak-Aktualisierung:
		if (result === 'left') {
			if (curL.elo > (curL.peak || 0)) {
				curL.peak = curL.elo;
				curL.isNewPeak = true; // Temporärer Marker für das Badge
			} else {
				curL.isNewPeak = false;
			}
			curR.isNewPeak = false; // Verlierer kann keinen Peak haben
		} else {
			if (curR.elo > (curR.peak || 0)) {
				curR.peak = curR.elo;
				curR.isNewPeak = true;
			} else {
				curR.isNewPeak = false;
			}
			curL.isNewPeak = false;
		}
	
		// Match in die Datenbank schreiben
		const matchRec = { 
			leftId: curL.id, 
			rightId: curR.id, 
			winnerId: result, 
			delta: Math.abs(delta), 
			tab: currentTab, 
			time: Date.now() 
		};
		let newMatchId;
		tx.objectStore('matches').add(matchRec).onsuccess = e => { newMatchId = e.target.result; };
	
		tx.oncomplete = () => {
			addMatchToCache({ ...matchRec, id: newMatchId });
			// Marathon-Countdown
			if (focusCount > 0) {
				focusCount--;
				if (focusCount <= 0) {
					focusId = null;
				}
			}
	
			undoEntry.matchId = newMatchId;
			undoEntry.logEl = addToLog(result, delta);
			const stack = undoStacks[undoEntry.tab] || (undoStacks[undoEntry.tab] = []);
			stack.push(undoEntry);
			if (stack.length > UNDO_LIMIT) stack.shift();
			refreshUI();
		};
	}

			const pct = count / DAILY_GOAL;
			if (pct >= 1.5)  return { color: '#bd93f9', label: '🔥 Super produktiv', badgeColor: 'rgba(189, 147, 249, 0.2)' };
			if (pct >= 1.0)  return { color: '#50fa7b', label: '✅ Ziel erreicht', badgeColor: 'rgba(80, 250, 123, 0.2)' };
			if (pct >= 0.5)  return { color: '#ffb86c', label: '🟧 Knapp drunter', badgeColor: 'rgba(255, 184, 108, 0.2)' };
			return { color: '#ff5555', label: '🔴 Verfehlt', badgeColor: 'rgba(255, 85, 85, 0.2)' };

		const DAYS_TO_SHOW = 30;
		const now = new Date();
		const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
		
		const todayMatchesCount = allTabMatches.filter(m => m.time && m.time >= todayStart).length;
		const todayStatus = getGoalStatus(todayMatchesCount);
	
		// Verlauf der letzten 30 Tage generieren
		const dailyStats = [];
		let totalPeriodMatches = 0;
		let daysGoalAchieved = 0;
	
		for (let i = DAYS_TO_SHOW - 1; i >= 0; i--) {
			const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
			const dayStart = d.getTime();
			const dayEnd = dayStart + 86400000;
			
			const count = allTabMatches.filter(m => m.time && m.time >= dayStart && m.time < dayEnd).length;
			totalPeriodMatches += count;
			if (count >= DAILY_GOAL) daysGoalAchieved++;
	
			let label = '&nbsp;';
			if (i === 0) {
				label = 'Heute';
			} else if (i % 5 === 0) {
				label = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
			}
	
			const status = getGoalStatus(count);
	
			dailyStats.push({ 
				label: label, 
				count: count, 
				dateStr: d.toLocaleDateString('de-DE'),
				color: status.color,
				statusLabel: status.label
			});
		}
	
		// Y-Achse: Quadratwurzel-Skalierung verhindert, dass Extremtage normale Balken ersticken
        const rawMax = Math.max(...dailyStats.map(s => s.count), DAILY_GOAL);
        const maxDailyMatchesSq = Math.sqrt(rawMax);

		// ---------------------------------------------------------------------
	
		const possiblePairs = (list.length * (list.length - 1)) / 2;
		const uniquePairsMap = {};

			if(m.leftId && m.rightId) {
				const pairKey = [m.leftId, m.rightId].sort().join('-');
				if (!uniquePairsMap[pairKey]) uniquePairsMap[pairKey] = { [m.leftId]: 0, [m.rightId]: 0, total: 0 };
				const winnerRealId = (m.winnerId === 'left') ? m.leftId : m.rightId;
				uniquePairsMap[pairKey][winnerRealId]++;
				uniquePairsMap[pairKey].total++;
				if (opponentTracker[m.leftId]) opponentTracker[m.leftId].add(m.rightId);

    // --- Helfer-Logik (Display, Scroll, Tabs, Export) ---
	// Kleine Hilfsfunktion für den Tag-Bau
	function createTagElement(tagName, tag, container) {
		const tBadge = document.createElement('div');
		tBadge.style = `
			background: rgba(255, 255, 255, 0.06);
			color: #eee;
			padding: 6px 4px;
			border-radius: 4px;
			font-size: 0.75em;
			border: 1px solid rgba(255, 255, 255, 0.1);
			text-align: center;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		`;
		tBadge.title = `${tagName}: ${tag.value}`;
		tBadge.innerHTML = `<span>${tag.value}</span>`;
		container.appendChild(tBadge);
	}
	
	let duelCtx = null;
	function displaySide(side, img) {
        const url = imgUrl(img);
        
        const container = document.getElementById(`img-${side}`) || document.getElementById(`container-${side}`);
        const d = document.getElementById(`display-${side}`);
        
        // Setzt die ID für das CSS, falls sie noch auf dem alten Stand war
        if (container) {
            container.id = `container-${side}`;
        }
        
        d.classList.toggle('fit-contain', isFitContain(img.tab || currentTab));
        if (container) { container.classList.remove('duel-in'); void container.offsetWidth; container.classList.add('duel-in'); }

        d.style.backgroundImage = `url("${url}")`;
        d.style.backgroundPositionY = (img.y || 50) + "%";
        
        document.getElementById(`name-${side}`).innerText = img.name;
        const totalMatches = img.wins + img.losses;
        const winRate = (totalMatches === 0) ? 0 : Math.round((img.wins / totalMatches) * 100);
        
        let covTxt = '';
        if (duelCtx && duelCtx.tab === currentTab && duelCtx.n > 1) {
            const cov = Math.floor((distinctOpponentCount(duelCtx.idx, img.id, duelCtx.ids) / (duelCtx.n - 1)) * 100);
            covTxt = ` | Cov: <span style="color:white">${cov}%</span>`;
        }
        const statsEl = document.getElementById(`stats-${side}`);
        statsEl.innerHTML = 
            `Elo: <span style="color:white">${Math.round(img.elo)}</span> | Win: <span style="color:white">${winRate}%</span>` + covTxt +
            ` | Duelle: <span style="color:white">${totalMatches}</span>`;

        // Cockpit: Verlauf, Trend, Gewinn-/Verlustpunkte und letzte Aktivität
        let meta = document.getElementById(`meta-${side}`);
        if (!meta) { meta = document.createElement('div'); meta.id = `meta-${side}`; meta.className = 'cp-meta'; statsEl.after(meta); }
        const opp = (side === 'left') ? curR : curL;
        if (opp && opp !== img) {
            const hist = (img.history && img.history.length ? img.history : [Math.round(img.elo)]).slice(-24);
            const lo = Math.min(...hist), hi = Math.max(...hist), span = Math.max(1, hi - lo);
            const pts = hist.map((v, i) => (hist.length === 1 ? 0 : (i / (hist.length - 1)) * 96 + 2).toFixed(1) + ',' + (24 - ((v - lo) / span) * 20 - 2).toFixed(1)).join(' ');
            const col = side === 'left' ? 'var(--side-l)' : 'var(--accent-r)';
            const full = img.history || [];
            const back = full.length > 5 ? full[full.length - 6] : (full[0] !== undefined ? full[0] : img.elo);
            const trend = Math.round(img.elo - back);
            const exp = 1 / (1 + Math.pow(10, (opp.elo - img.elo) / 400));
            const gain = Math.round(32 * (1 - exp)), lose = Math.round(32 * exp);
            let last = 'noch nie gespielt';
            if (duelCtx && duelCtx.tab === currentTab) {
                const ms = matchesOf(duelCtx.idx, img.id);
                let t = 0; for (const m of ms) if (m.time > t) t = m.time;
                if (t) { const dd = Math.floor((dayStartMs() - new Date(new Date(t).getFullYear(), new Date(t).getMonth(), new Date(t).getDate()).getTime()) / 86400000); last = dd <= 0 ? 'heute gespielt' : dd === 1 ? 'zuletzt gestern' : 'zuletzt vor ' + dd + ' Tagen'; }
            }
            meta.innerHTML = '<svg width="100" height="26" viewBox="0 0 100 26" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>' +
                '<span class="' + (trend > 0 ? 'up' : trend < 0 ? 'down' : '') + '" title="Elo-Veränderung der letzten 5 Duelle">' + (trend > 0 ? '▲ +' + trend : trend < 0 ? '▼ −' + Math.abs(trend) : '– ±0') + '</span>' +
                '<span title="Elo-Punkte bei Sieg / Niederlage"><b class="up">+' + gain + '</b> / <b class="down">−' + lose + '</b></span>' +
                '<span>' + last + '</span>';
        } else { meta.innerHTML = ''; }
    
        container.querySelectorAll('.rank-badge, .streak-badge, .peak-badge, .tag-badge-container').forEach(b => b.remove());
    
        // 2. Rank Badge (bleibt auf dem Bild)
        const rBadge = document.createElement('div');
        rBadge.className = 'rank-badge';
        rBadge.innerText = `#${img.globalRank}`;
        container.appendChild(rBadge);
    
        // 3. Peak Badge (bleibt auf dem Bild)
        if (img.elo >= (img.peak || 0) && totalMatches >= 5) {
            const pBadge = document.createElement('div');
            pBadge.className = 'peak-badge';
            pBadge.innerHTML = `⭐ PEAK`;
            container.appendChild(pBadge);
        }
    
        // 4. Streak Badge (bleibt auf dem Bild)
        if (img.streak >= 3 || img.streak <= -3) {
            const sBadge = document.createElement('div');
            sBadge.className = 'streak-badge';
            sBadge.innerHTML = img.streak >= 3 ? `🔥 ${img.streak}` : `❄️ ${Math.abs(img.streak)}`;
            container.appendChild(sBadge);
        }
    
        // 5. Tag-Badges (Eigenschaften) im 4-Spalten-Grid
        renderTagBadges(side, img);
    }

    // Zeigt nur Eigenschaften, die es im Tab noch gibt (gelöschte werden ausgeblendet), in der eingestellten Reihenfolge
    async function renderTagBadges(side, img) {
        const outsidePropsContainer = document.getElementById(`properties-${side}`);
        if (!outsidePropsContainer) return;
        const defs = await getTagDefinitionsForTab(img.tab || currentTab);
        const stillCurrent = (side === 'left' ? curL : curR) === img;
        if (!stillCurrent) return; // inzwischen wurde ein anderes Bild geladen
        outsidePropsContainer.innerHTML = '';
        let hasVisibleTags = false;
        defs.forEach(def => {
            const tag = img.tags && img.tags[def.tagName];
            if (tag && tag.value && String(tag.value).trim() !== "") {
                hasVisibleTags = true;
                createTagElement(def.tagName, tag, outsidePropsContainer);
            }
        });
        // Spalten je nach Anzahl: bis 4 alle in einer Reihe, darüber gleichmäßig verteilt (5 → 3+2, 6 → 3+3, 7 → 4+3, 8 → 4+4)
        const n = outsidePropsContainer.children.length;
        const rows = Math.max(1, Math.ceil(n / 4));
        outsidePropsContainer.style.setProperty('--cols', String(Math.max(1, Math.ceil(n / rows))));
        outsidePropsContainer.style.display = hasVisibleTags ? 'flex' : 'none';
    }

    function updateProbDisplay() {
		const expL = 1 / (1 + Math.pow(10, (curR.elo - curL.elo) / 400));
		document.getElementById('chance-l').style.height = (expL * 100) + "%";
		document.getElementById('chance-r').style.height = ((1 - expL) * 100) + "%";
		
		// Optional: Den Text oben auch zweifarbig machen
		const percL = Math.round(expL * 100);
		const percR = Math.round((1 - expL) * 100);
		document.getElementById('prob-text').innerHTML = 
			`<span style="color:var(--side-l)">${percL}</span> / <span style="color:var(--accent-r)">${percR}</span>`;
		const gapEl = document.getElementById('elo-gap');
		if (gapEl) {
			const diff = Math.round(Math.abs(curL.elo - curR.elo));
			const fav = curL.elo >= curR.elo ? curL : curR;
			gapEl.innerHTML = diff < 5 ? 'Auf Augenhöhe' : '<b>' + diff + '</b> Elo Abstand<br>Favorit: ' + escHtml(fav.name || '');
		}
	}

	function addToLog(result, delta) {
		const log = document.getElementById('history-log');
		const item = document.createElement('div');
		item.className = 'log-item';
		
		// Farben basierend auf der Seite zuweisen (Links = Blau, Rechts = Gelb)
		const sideColor = (result === 'left') ? '#3b82f6' : '#eab308';
		item.style.borderColor = sideColor;
	
		const urlL = imgUrl(curL, 'thumb');
		const urlR = imgUrl(curR, 'thumb');
		
		// Sieger und Verlierer ermitteln
		const winnerName = (result === 'left' ? curL.name : curR.name);
		const loserName  = (result === 'left' ? curR.name : curL.name);
		const roundedDelta = Math.round(Math.abs(delta));
	
		// Tooltip für das gesamte Log-Item festlegen
		item.title = `Sieger: ${winnerName} | Verlierer: ${loserName}`;
	
		item.innerHTML = `
			<div style="font-weight:bold; color:${sideColor}">${winnerName}</div>
			<div class="log-images">
				<img src="${urlL}" class="log-img" style="border-color: rgba(59, 130, 246, 0.3)" title="${curL.name}">
				vs 
				<img src="${urlR}" class="log-img" style="border-color: rgba(234, 179, 8, 0.3)" title="${curR.name}">
				<span style="color:${sideColor}; font-weight:bold; margin-left:auto;">+${roundedDelta} Elo</span>
			</div>
		`;
	
		log.prepend(item); 
		if (log.children.length > 15) log.lastChild.remove();
		return item;
	}
