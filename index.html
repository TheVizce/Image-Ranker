    async function exportFullSystem() {
        // 1. Hole parallel die Daten aus beiden Tabellen ("images" und "matches")
        // (Sollte dein Store für die Duelle anders heißen, z.B. "history", passe das Wort "matches" hier an)
        const allImages = await new Promise(r => db.transaction("images").objectStore("images").getAll().onsuccess = e => r(e.target.result));
        const allMatches = await new Promise(r => {
            try {
                db.transaction("matches").objectStore("matches").getAll().onsuccess = e => r(e.target.result);
            } catch (err) {
                console.warn("Der Store 'matches' konnte nicht ausgelesen werden. Eventuell heißt er anders?", err);
                r([]); // Fallback auf leeres Array, falls der Store nicht existiert
            }
        });

        const allTagDefinitions = await new Promise(r => {
            try {
                db.transaction("tagDefinitions").objectStore("tagDefinitions").getAll().onsuccess = e => r(e.target.result);
            } catch (err) {
                console.warn("Der Store 'tagDefinitions' konnte nicht ausgelesen werden.", err);
                r([]);
            }
        });

        // 2. Bilder als eigene Dateien ins ZIP (keine Base64-Aufblähung, keine riesigen Textstrings)
        const files = [];
        const processedImages = allImages.map(img => {
            if (img.blob instanceof Blob) {
                const name = 'img/' + img.id + extForType(img.blob.type);
                files.push({ name, data: img.blob });
                return { ...img, blob: undefined, blobFile: name, blobType: img.blob.type || '' };
            }
            return img;
        });

        // 3. Backup-Objekt mit TABS, IMAGES, MATCHES, Eigenschaften und Einstellungen
        const backupObject = {
            format: 'ranker-zip-1',
            tabs,
            images: processedImages,
            matches: allMatches,
            tagDefinitions: allTagDefinitions,
            settings: settings,
            exportedAt: Date.now()
        };

        // 4. ZIP bauen und herunterladen
        try {
            const zip = await buildZip([{ name: 'backup.json', data: new Blob([JSON.stringify(backupObject)], { type: 'application/json' }) }, ...files], (i, n) => showBusy('Backup wird erstellt… ' + i + '/' + n));
            const d = new Date(), pad = n => String(n).padStart(2, '0');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(zip);
            a.download = 'ranker_backup_' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.zip';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 60000);
            setLastBackupAt(backupObject.exportedAt);
            updateBackupChip();
        } finally { showBusy(''); }
    }

    // ===================== BACKUP-HINWEIS (wann war das letzte Backup?) =====================
    // Pro Gerät: Zeitpunkt des letzten Exports/Imports. Zeigt, wie lange das her ist und wie viele Duelle seitdem dazukamen.
    const BACKUP_WARN_DAYS = 7, BACKUP_WARN_MATCHES = 300;
    function getLastBackupAt() { try { return Number(localStorage.getItem('lastBackupAt')) || 0; } catch (e) { return 0; } }
    function setLastBackupAt(t) { try { localStorage.setItem('lastBackupAt', String(t)); } catch (e) {} }
    function agoText(t) {
        const min = Math.floor((Date.now() - t) / 60000);
        if (min < 1) return 'gerade eben';
        if (min < 60) return 'vor ' + min + ' Min';
        const h = Math.floor(min / 60);
        if (h < 24) return 'vor ' + h + ' Std';
        const d = Math.floor(h / 24);
        return 'vor ' + d + (d === 1 ? ' Tag' : ' Tagen');
    }
    async function updateBackupChip() {
        const el = document.getElementById('backup-chip');
        if (!el || !db) return;
        const last = getLastBackupAt();
        let fresh = 0;
        try { fresh = (await getMatches()).filter(m => (Number(m.time) || 0) > last).length; } catch (e) {}
        let txt, warn;
        if (!last) { txt = '💾 Noch kein Backup'; warn = fresh > 0; }
        else {
            txt = '💾 ' + agoText(last) + (fresh ? ' · +' + fresh + ' Duelle' : '');
            warn = (Date.now() - last) > BACKUP_WARN_DAYS * 86400000 || fresh >= BACKUP_WARN_MATCHES;
        }
        el.textContent = txt;
        el.style.borderColor = warn ? 'var(--accent-r, #f39c12)' : '';
        el.style.color = warn ? 'var(--accent-r, #f39c12)' : '';
        el.title = 'Backup jetzt exportieren' + (last ? ' (letztes: ' + new Date(last).toLocaleString('de-DE') + ')' : '');
    }

    // ===================== BACKUP-DATEI (ZIP) =====================
    // Ein Backup ist ein ZIP (ohne Kompression, Bilder liegen schon komprimiert vor) mit backup.json und img/<id>.<ext>.
    // Alte Backups (eine einzige JSON-Datei mit Base64-Bildern) lassen sich weiterhin importieren.
    const extForType = t => ({ 'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp', 'image/gif': '.gif', 'image/avif': '.avif' })[t] || '.bin';
    const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
    function crc32(bytes) { let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
    async function buildZip(entries, onProgress) {
        if (entries.length > 65000) throw new Error('Zu viele Dateien für ein ZIP-Backup.');
        const enc = new TextEncoder(), parts = [], central = [];
        const now = new Date();
        const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
        const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
        let offset = 0, i = 0;
        for (const e of entries) {
            if (onProgress && (i++ % 20 === 0)) { onProgress(i, entries.length); await new Promise(r => setTimeout(r, 0)); }
            const name = enc.encode(e.name);
            const size = e.data.size;
            if (size > 0xFFFFFFFE || offset > 0xFFFFFFFE) throw new Error('Backup zu groß für das ZIP-Format (4 GB).');
            const crc = crc32(new Uint8Array(await e.data.arrayBuffer()));
            const lh = new DataView(new ArrayBuffer(30));
            lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
            lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
            lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
            parts.push(lh.buffer, name, e.data);
            const ch = new DataView(new ArrayBuffer(46));
            ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
            ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
            ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
            ch.setUint32(42, offset, true);
            central.push(ch.buffer, name);
            offset += 30 + name.length + size;
        }
        const cdSize = central.reduce((n, p) => n + (p.byteLength !== undefined ? p.byteLength : p.length), 0);
        const end = new DataView(new ArrayBuffer(22));
        end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
        end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
        return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
    }
    // Liest das Inhaltsverzeichnis eines ZIPs; Dateiinhalte werden erst bei Bedarf als Blob-Ausschnitt geholt
    async function readZip(file) {
        const size = file.size, tailLen = Math.min(size, 65557);
        const tail = new DataView(await file.slice(size - tailLen, size).arrayBuffer());
        let eocd = -1;
        for (let i = tailLen - 22; i >= 0; i--) { if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
        if (eocd < 0) throw new Error('Keine gültige ZIP-Datei.');
        const count = tail.getUint16(eocd + 10, true), cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
        if (cdOff === 0xFFFFFFFF) throw new Error('ZIP64-Dateien werden nicht unterstützt.');
        const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
        const dec = new TextDecoder(), entries = new Map();
        let p = 0;
        for (let n = 0; n < count && p + 46 <= cd.byteLength; n++) {
            if (cd.getUint32(p, true) !== 0x02014b50) break;
            const method = cd.getUint16(p + 10, true), csize = cd.getUint32(p + 20, true);
            const nl = cd.getUint16(p + 28, true), el = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true), lho = cd.getUint32(p + 42, true);
            entries.set(dec.decode(new Uint8Array(cd.buffer, p + 46, nl)), { method, csize, lho });
            p += 46 + nl + el + cl;
        }
        const blobOf = async (name, type) => {
            const e = entries.get(name);
            if (!e) return null;
            const lh = new DataView(await file.slice(e.lho, e.lho + 30).arrayBuffer());
            const start = e.lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
            const raw = file.slice(start, start + e.csize, type || '');
            if (e.method === 0) return raw;
            if (e.method === 8 && typeof DecompressionStream === 'function') return new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob().then(b => type ? b.slice(0, b.size, type) : b);
            throw new Error('Nicht unterstützte ZIP-Kompression bei ' + name);
        };
        return { entries, blobOf };
    }
    // Backup-Datei (ZIP oder altes JSON) einlesen. Ergebnis: Daten-Objekt, dessen Bilder entweder ein Blob oder (alt) ein data:-String sind.
    async function loadBackupData(file) {
        const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
        if (head[0] === 0x50 && head[1] === 0x4B) {
            const zip = await readZip(file);
            const metaBlob = await zip.blobOf('backup.json');
            if (!metaBlob) throw new Error('backup.json fehlt im ZIP.');
            const data = JSON.parse(await metaBlob.text());
            if (!data.images || !Array.isArray(data.images)) throw new Error('Ungültiges Backup-Format.');
            for (const im of data.images) {
                if (im.blobFile) { im.blob = await zip.blobOf(im.blobFile, im.blobType); delete im.blobFile; delete im.blobType; }
            }
            return data;
        }
        return JSON.parse(await file.text());
    }

	async function importFullSystem(file) {
        if(!file) return; 
        {
            try {
                showBusy('Backup wird gelesen…');
                let data;
                try { data = await loadBackupData(file); } finally { showBusy(''); }
                
                if (!data.images || !Array.isArray(data.images)) {
                    throw new Error("Ungültiges Backup-Format.");
                }

                // Sicherheitsabfrage: Backup und aktuelle Daten gegenüberstellen
                const curImgs = await idbGetAll(db.transaction("images").objectStore("images"));
                const curMatches = await idbGetAll(db.transaction("matches").objectStore("matches"));
                const lastOf = ms => ms.reduce((m, x) => Math.max(m, Number(x.time) || 0), 0);
                const fmt = t => t ? new Date(t).toLocaleString('de-DE') : 'unbekannt';
                const bMatches = Array.isArray(data.matches) ? data.matches : [];
                const bLast = lastOf(bMatches), cLast = lastOf(curMatches);
                let msg = "Achtung: Der Import ERSETZT alle aktuellen Daten.\n\n" +
                    "Backup:   " + data.images.length + " Bilder, " + bMatches.length + " Duelle, letztes Duell " + fmt(bLast) +
                    (data.exportedAt ? ", exportiert " + fmt(data.exportedAt) : "") + "\n" +
                    "Aktuell:  " + curImgs.length + " Bilder, " + curMatches.length + " Duelle, letztes Duell " + fmt(cLast) + "\n\n";
                if (cLast > bLast || curMatches.length > bMatches.length) {
                    msg += "⚠️ Das Backup wirkt ÄLTER als die aktuellen Daten – es würden Duelle verloren gehen!\n(Tipp: vorher einen Export machen.)\n\n";
                }
                msg += "Wirklich importieren?";
                if (!confirm(msg)) { document.getElementById('backup-input').value = ''; return; }

                // 1. Bilder vorbereiten und Blobs konvertieren (IDs BEIBEHALTEN!)
                const preparedImages = [];
                for(let i = 0; i < data.images.length; i++) {
                    let imageCopy = JSON.parse(JSON.stringify(data.images[i]));
                    if(typeof data.images[i].blob === 'string' && data.images[i].blob.startsWith('data:')) {
                        try {
                            const res = await fetch(data.images[i].blob); 
                            imageCopy.blob = await res.blob();
                        } catch (fErr) {
                            imageCopy.blob = data.images[i].blob;
                        }
                    } else {
                        imageCopy.blob = data.images[i].blob;
                    }
                    
                    // WICHTIGSTE ÄNDERUNG: Wir behalten die originale ID aus dem Backup!
                    // Falls aus irgendeinem Grund keine ID da ist, nutzen wir den Index
                    if (data.images[i].id !== undefined) {
                        imageCopy.id = data.images[i].id;
                    }
                    
                    preparedImages.push(imageCopy);
                }

                // 2. Transaktion für BEIDE Stores öffnen
                const tx = db.transaction(["images", "matches", "tagDefinitions", "thumbs"], "readwrite");
                tx.objectStore("thumbs").clear(); // werden nach dem Neuladen automatisch neu erzeugt
                
                // IMAGES SCHREIBEN
                const imgStore = tx.objectStore("images");
                imgStore.clear();
                for(let img of preparedImages) {
                    // .put() statt .add(), damit die feste ID erzwungen wird
                    imgStore.put(img);
                }
                
                // MATCHES SCHREIBEN
                const matchStore = tx.objectStore("matches");
                matchStore.clear();
                if (data.matches && Array.isArray(data.matches)) {
                    for(let match of data.matches) {
                        let matchCopy = { ...match };
                        // Auch bei den Matches die originale ID und Verknüpfungen zwingend behalten!
                        if (match.id !== undefined) {
                            matchCopy.id = match.id;
                        }
                        matchStore.put(matchCopy);
                    }
                }
                
                // TAG-DEFINITIONEN SCHREIBEN (nur, wenn das Backup welche enthält – ältere Backups lassen die vorhandenen unberührt)
                if (data.tagDefinitions && Array.isArray(data.tagDefinitions)) {
                    const tagStore = tx.objectStore("tagDefinitions");
                    tagStore.clear();
                    for (let def of data.tagDefinitions) {
                        tagStore.put({ ...def });
                    }
                }
                
                // EINSTELLUNGEN wiederherstellen (nur, wenn das Backup welche enthält)
                if (data.settings && typeof data.settings === 'object') {
                    localStorage.setItem('settings', JSON.stringify(sanitizeSettings(data.settings)));
                }
                
                // 3. LocalStorage für die Registerkarten/Tabs sichern
                if (data.tabs) {
                    localStorage.setItem('tabs', JSON.stringify(data.tabs));
                }
                
                tx.oncomplete = () => {
                    setLastBackupAt(Number(data.exportedAt) || Date.now());
                    alert("Import erfolgreich! Alle IDs und Verknüpfungen wurden exakt wiederhergestellt.");
                    location.reload();
                };

                tx.onerror = (err) => {
                    console.error("Datenbank-Transaktion fehlgeschlagen:", err);
                    alert("Fehler beim Schreiben der Daten.");
                };

            } catch (err) {
                console.error("Import-Fehler:", err);
                alert("Import fehlgeschlagen: " + err.message);
            }
        }
    }

    function renderTabs() {
        const cont = document.getElementById('tab-list'); cont.innerHTML = '';
        tabs.forEach(t => {
            const div = document.createElement('div'); div.className = 'tab-container';
            const acc = settings.tabAccent && settings.tabAccent[t];
            div.innerHTML = `<div class="tab ${t === currentTab ? 'active' : ''}" onclick="switchTab('${t}')"${acc ? ' style="box-shadow: inset 0 -3px 0 ' + acc + ';"' : ''}>${t}</div>`;
            if(t !== "Standard") div.innerHTML += `<div class="tab-delete" onclick="deleteTab('${t}')">&times;</div>`;
            cont.appendChild(div);
        });
    }
    function switchTab(t) { currentTab = t; localStorage.setItem('activeTab', t); refreshUI(); }
    function addTab() { const n = prompt("Name:"); if(n && !tabs.includes(n)) { tabs.push(n); localStorage.setItem('tabs', JSON.stringify(tabs)); switchTab(n); } }
    // Löscht alle Bilder (samt Vorschaubildern) und Duelle eines Tabs
    async function wipeTab(tabName, tx) {
        const imgStore = tx.objectStore("images");
        const allI = await new Promise(r => imgStore.getAll().onsuccess = e => r(e.target.result));
        const mine = allI.filter(i => i.tab === tabName);
        mine.forEach(i => { imgStore.delete(i.id); tx.objectStore("thumbs").delete(i.id); });
        const mStore = tx.objectStore("matches");
        const allM = await new Promise(r => mStore.getAll().onsuccess = e => r(e.target.result));
        allM.filter(m => m.tab === tabName).forEach(m => mStore.delete(m.id));
        return mine;
    }
    async function deleteTab(t) {
        if(!confirm(`Löschen?`)) return;
        const tx = db.transaction(["images", "matches", "thumbs"], "readwrite");
        const mine = await wipeTab(t, tx);
        tx.oncomplete = () => {
            mine.forEach(i => forgetImage(i.id));
            invalidateMatchCache();
            delete undoStacks[t];
            tabs = tabs.filter(x => x !== t); localStorage.setItem('tabs', JSON.stringify(tabs)); switchTab("Standard");
        };
    }
    async function deleteImage(id) {
        if(!confirm("Löschen?")) return;
        const tx = db.transaction(["images", "matches", "thumbs"], "readwrite");
        const imgStore = tx.objectStore("images");
        imgStore.delete(id);
        tx.objectStore("thumbs").delete(id);
        // Verweise auf dieses Bild aus den Rivalen-Listen der anderen entfernen
        const others = await new Promise(r => imgStore.getAll().onsuccess = e => r(e.target.result));
        others.forEach(o => {
            if (o.id != id && o.rivals && o.rivals.some(r => r.id == id)) {
                o.rivals = o.rivals.filter(r => r.id != id);
                imgStore.put(o);
            }
        });
        tx.oncomplete = () => { forgetImage(id); purgeUndoForImage(id); closeModal(); refreshUI(); };
    }
    // ---- Rückgängig (mehrstufig) ----
    const undoTop = () => { const st = undoStacks[currentTab]; return (st && st.length) ? st[st.length - 1] : null; };

    function updateUndoButton() {
        const btn = document.getElementById('undo-btn');
        if (!btn) return;
        const n = (undoStacks[currentTab] || []).length;
        btn.disabled = n === 0;
        btn.textContent = n > 1 ? `↩️ Rückgängig (${n})` : '↩️ Rückgängig';
        updateBackupChip();
    }

    // Nur die durch ein Duell veränderten Felder merken
    function duelFields(img) {
        return { id: img.id, elo: img.elo, wins: img.wins, losses: img.losses, streak: img.streak, peak: img.peak, history: img.history ? img.history.slice() : undefined };
    }
    function restoreDuelFields(cur, f) {
        cur.elo = f.elo; cur.wins = f.wins; cur.losses = f.losses;
        if (f.streak === undefined) delete cur.streak; else cur.streak = f.streak;
        if (f.peak === undefined) delete cur.peak; else cur.peak = f.peak;
        if (f.history === undefined) delete cur.history; else cur.history = f.history.slice();
        delete cur.isNewPeak;
    }
    function purgeUndoForImage(id) {
        Object.keys(undoStacks).forEach(t => { undoStacks[t] = undoStacks[t].filter(e => e.L.id != id && e.R.id != id); });
    }

    async function undoLastMatch() {
        const stack = undoStacks[currentTab];
        if (!stack || stack.length === 0) return;
        const entry = stack.pop();
        updateUndoButton();

        const tx = db.transaction(["images", "matches"], "readwrite");
        const imgStore = tx.objectStore("images");
        for (const f of [entry.L, entry.R]) {
            const cur = await idbGet(imgStore, f.id);
            if (cur) { restoreDuelFields(cur, f); imgStore.put(cur); } // Bild evtl. inzwischen gelöscht: überspringen
        }
        if (entry.matchId !== undefined) tx.objectStore("matches").delete(entry.matchId);
        await txDone(tx);

        removeMatchFromCache(entry.matchId);
        if (entry.logEl && entry.logEl.isConnected) entry.logEl.remove();
        const top = undoTop();
        lastVotedPair = top ? [top.L.id, top.R.id] : null;

        // Fokus-Zähler wiederherstellen, sofern der Fokus seither nicht geändert wurde
        const fb = entry.focusBefore;
        if (fb && fb.id !== null && (focusId === fb.id || focusId === null)) {
            focusId = fb.id; focusCount = fb.count;
            saveFocusState();
        }

        forcedPair = [entry.L.id, entry.R.id]; // das rückgängig gemachte Duell erneut zeigen
        refreshUI();
    }
    async function clearTab() {
        if(!confirm(`Alle Bilder im Tab "${currentTab}" löschen?`)) return;
        const tx = db.transaction(["images", "matches", "thumbs"], "readwrite");
        const mine = await wipeTab(currentTab, tx);

    function showToast(containerId, delta) {
		let container = document.getElementById(containerId);
		
		if (!container) {
			if (containerId.includes('left')) {
				container = document.getElementById('container-left') || document.getElementById('img-left');
			} else if (containerId.includes('right')) {
				container = document.getElementById('container-right') || document.getElementById('img-right');
			}
		}
	
		if (!container) {
			console.warn(`Toast-Container nicht gefunden: ${containerId}`);
			return;
		}
	
		const toast = document.createElement('div'); 
		toast.className = 'toast';
		toast.innerText = `+${Math.round(Math.abs(delta))}`; 
		
		// Grundfarbe basierend auf der Seite (Blau für links, Gelb für rechts)
		const isLeft = containerId.includes('left');
		toast.style.color = isLeft ? '#3b82f6' : '#eab308';
		
		// --- STYLING FÜR MAXIMALE SICHTBARKEIT ---
		toast.style.position = 'absolute';
		toast.style.left = '50%'; 
		toast.style.top = '45%'; // Leicht über der Mitte platziert wirkt dynamischer
		toast.style.transform = 'translate(-50%, -50%)'; // Perfekt zentrieren
		toast.style.fontSize = '4.5rem'; // Schön groß und wuchtig
		toast.style.fontWeight = '900'; // Extra fett
		
		// Der wichtigste Trick: Ein fetter dunkler Schatten außenherum, damit es sich von jedem Bild abhebt
		toast.style.textShadow = `
			-2px -2px 0 #000,  
			2px -2px 0 #000,
			-2px  2px 0 #000,
			2px  2px 0 #000,
			0px  5px 15px rgba(0, 0, 0, 0.8)
		`;
		
		toast.style.zIndex = '100'; // Garantiert über allen Badges und Bildern
		toast.style.pointerEvents = 'none'; // Klicks gehen durch das Element durch
		
		container.appendChild(toast);
		setTimeout(() => toast.remove(), 800);
	}

	async function setFocus(id) {
		const numId = Number(id);
		
		// 1. Fokus umschalten
		if (focusId === numId) {
			focusId = null;
			focusCount = 0;
		} else {
			focusId = numId;
			focusCount = settings.focusMatches;
		}
	
		// 2. Speichern & Banner-Update
		saveFocusState();
		await updateFocusUI();
	
		// 3. Update Detail-Ansicht (Falls das Bild in den Details offen ist)
		// Hier prüfen wir, ob ein Element der Detailansicht existiert (z.B. ein Button dort)
		if (document.querySelector('.peak-badge') || document.getElementById('details-overlay')) {
			showDetailsByID(numId);
		}
	
		// 4. Update Rangliste (Nur wenn sie wirklich offen ist!)
		// Wir prüfen, ob 'rank-table' existiert
		if (document.getElementById('rank-table')) {
			openFullRanking();

		loadMatchup();

	async function updateFocusUI() {
		const statusEl = document.getElementById("focus-status");
		if (!statusEl) return;
	
		if (focusId && focusCount > 0) {
			// Wir holen uns den Namen direkt aus der Datenbank
			const img = await new Promise(r => {
				const tx = db.transaction("images", "readonly");
				tx.objectStore("images").get(Number(focusId)).onsuccess = e => r(e.target.result);
			});
	
			const name = img ? img.name : "Bild";
	
			statusEl.innerHTML = `
				<div style="background:rgba(241,196,15,0.2); border:1px solid #f1c40f; padding:5px 15px; border-radius:20px; display:inline-block; color:#f1c40f; font-size:0.9em; backdrop-filter:blur(4px);">
					🎯 Fokus-Modus: <b>${name}</b> (${focusCount} verbleibend) 
					<span onclick="cancelFocus()" style="cursor:pointer; margin-left:10px; padding: 0 5px; background:rgba(0,0,0,0.3); border-radius:4px; font-size:0.8em; color:#fff;">Abbrechen</span>
				</div>`;
			statusEl.style.display = "block";
		} else {
			statusEl.innerHTML = "";
			statusEl.style.display = "none";
		}
	}
	async function editImageInfo(id) {
		// 1. Bild aus der DB laden
		const tx = db.transaction("images", "readonly");
		const store = tx.objectStore("images");
		const img = await new Promise(r => store.get(id).onsuccess = e => r(e.target.result));
	
		if (!img) return;
		const blobBefore = img.blob;
	
		// 2. Namen ändern
		const newName = prompt("Neuer Name für das Bild:", img.name);
		if (newName === null) return; // Bei Abbrechen aufhören
		img.name = newName;
	
		// 3. Bildquelle ändern?
		const changeImage = confirm("Möchtest du auch das Bild ändern?");
	
		if (changeImage) {
			const method = prompt("Wie möchtest du das Bild einfügen?\n[1] Lokale Datei hochladen\n[2] Bild-URL eintragen", "1");
	
			if (method === "1") {
				// WEG 1: Datei auswählen über temporäres Element im DOM
				const fileSelected = await new Promise((resolve) => {
					let fileInput = document.getElementById('temp-file-input');
					
					// Falls noch nicht vorhanden, erstellen und ins DOM einfügen
					if (!fileInput) {
						fileInput = document.createElement('input');
						fileInput.type = 'file';
						fileInput.id = 'temp-file-input';
						fileInput.style.display = 'none';
						document.body.appendChild(fileInput);
					}
	
					// Reset, falls vorher schonmal eine Datei gewählt war
					fileInput.value = '';
	
					// Event-Listener anhängen
					fileInput.onchange = (e) => {
						const file = e.target.files && e.target.files[0] ? e.target.files[0] : null;
						resolve(file);
					};
	
					// Klick im nächsten Tick ausführen
					setTimeout(() => {
						fileInput.click();
					}, 50);
				});
	
				if (fileSelected) {
					img.blob = fileSelected; 
				} else {
					return; // Abbruch
				}
	
			} else if (method === "2") {
				// WEG 2: URL
				const currentUrl = typeof img.blob === 'string' ? img.blob : "";
				const newUrl = prompt("Neue Bild-URL einfügen:", currentUrl);
	
				if (newUrl) {
					img.blob = newUrl;
				}
			}
		}
	
		// 4. In IndexedDB abspeichern (Neue Transaktion nutzen!)
		const saveTx = db.transaction("images", "readwrite");
		const saveStore = saveTx.objectStore("images");
		
		saveStore.put(img).onsuccess = () => {
			if (img.blob !== blobBefore) {
				// Bild wurde ersetzt: Zwischenspeicher und Vorschaubild verwerfen, Vorschau neu erzeugen
				forgetImage(img.id);
				const tTx = db.transaction("thumbs", "readwrite");
				tTx.objectStore("thumbs").delete(img.id);
				tTx.oncomplete = () => ensureThumbs();
			}
			alert("Änderungen gespeichert!");
			if (typeof showDetailsByID === 'function') {
				showDetailsByID(id);
			} else {
				location.reload();
			}
		};
	}
	function cancelFocus() {
		focusId = null;

		saveFocusState();   // Permanent speichern (aus Schritt 1 & 2)

	async function addTagDefinition(tabName, currentImgId) {
		const name = prompt("Name der neuen Eigenschaft:");
		if (!name) return;
	
		try {
			const tx = db.transaction("tagDefinitions", "readwrite");
			const store = tx.objectStore("tagDefinitions");
			
			// Wir speichern die Definition
			await new Promise((resolve, reject) => {
				const req = store.add({ tab: tabName, tagName: name, options: [] });
				req.onsuccess = resolve;
				req.onerror = reject;
			});
	
			// UI REFRESH mit der direkt übergebenen ID
			showDetailsByID(currentImgId);
	
		} catch (error) {
			console.error("Fehler beim Speichern der Definition:", error);
			alert("Fehler: Konnte Eigenschaft nicht speichern.");
		}
	}
	async function getTagDefinitionsForTab(tabName) {
		return new Promise(r => {
			const tx = db.transaction("tagDefinitions", "readonly");
			const store = tx.objectStore("tagDefinitions");
			const tags = [];
			store.openCursor().onsuccess = e => {
				const cursor = e.target.result;
				if (cursor) {
					if (cursor.value.tab === tabName) tags.push(cursor.value);
					cursor.continue();
				} else {
					r(sortTagDefs(tabName, tags));
				}
			};
		});
	}
	// Eigene Reihenfolge (Einstellungen) zuerst, danach alle übrigen in Anlegereihenfolge
	const isFitContain = tab => !!(settings.imageFit && settings.imageFit[tab] === 'contain');
	function setImageFit(on) {
		if (on) settings.imageFit[currentTab] = 'contain'; else delete settings.imageFit[currentTab];
		saveSettings();
		if (typeof loadMatchup === 'function') loadMatchup();
	}
	function sortTagDefs(tab, defs) {
		const custom = (settings.tagOrder && settings.tagOrder[tab]) || [];
		const rank = (d, i) => {
			const c = custom.indexOf(d.tagName);
			if (c >= 0) return c;
			return 1000 + i;
		};
		return defs.map((d, i) => ({ d: d, r: rank(d, i) })).sort((x, y) => x.r - y.r).map(x => x.d);
	}
	async function deleteTagDefinition(id, tagName, tabName, currentImgId) {
		if (!confirm(`Eigenschaft "${tagName}" löschen?`)) return;
	
		const tx = db.transaction("tagDefinitions", "readwrite");
		tx.objectStore("tagDefinitions").delete(id);
	
		tx.oncomplete = () => {
			showDetailsByID(currentImgId); // Nutzt die übergebene ID statt focusId
		};
	}
	
	// Tag-Typ umbenennen (inkl. Migration der Bilddaten)
	async function renameTagDefinition(id, oldName, tabName, currentImgId) {
		const newName = prompt(`Neuer Name für "${oldName}":`, oldName);
		if (!newName || newName === oldName) return;
	
		// 1. Definition in tagDefinitions ändern
		const txDef = db.transaction("tagDefinitions", "readwrite");
		const defStore = txDef.objectStore("tagDefinitions");
		const def = await new Promise(r => defStore.get(id).onsuccess = e => r(e.target.result));
		def.tagName = newName;
		defStore.put(def);

		// Gewichtung (Einstellungen) auf den neuen Namen übertragen
		if (settings.tagWeights[tabName] && Object.prototype.hasOwnProperty.call(settings.tagWeights[tabName], oldName)) {
			settings.tagWeights[tabName][newName] = settings.tagWeights[tabName][oldName];
			delete settings.tagWeights[tabName][oldName];
			saveSettings();
		}
	
		// 2. Alle Bilder in diesem Tab migrieren (damit die Werte erhalten bleiben)
		const txImg = db.transaction("images", "readwrite");
		const imgStore = txImg.objectStore("images");
		imgStore.openCursor().onsuccess = e => {
			const cursor = e.target.result;
			if (cursor) {
				const img = cursor.value;
				if (img.tab === tabName && img.tags && img.tags[oldName]) {
					img.tags[newName] = img.tags[oldName]; // Kopieren
					delete img.tags[oldName];              // Altes löschen
					cursor.update(img);
				}
				cursor.continue();
			}
		};
	
		txImg.oncomplete = () => showDetailsByID(currentImgId);
	}
	// Link zu einem Bild hinzufügen
	async function addLink(imgId) {
		const url = prompt("URL des Links (z.B. https://wikipedia.org/...):");
		if (!url) return;
		
		const customIcon = prompt("Optional: Eigene Icon-URL (leer lassen für Automatik):");
		
		const tx = db.transaction("images", "readwrite");
		const store = tx.objectStore("images");
		const img = await new Promise(r => store.get(imgId).onsuccess = e => r(e.target.result));
		
		if (!img.links) img.links = [];
		img.links.push({ url: url, icon: customIcon || null });
		
		store.put(img).onsuccess = () => showDetailsByID(imgId);
	}
	
	// Link entfernen
	async function deleteLink(imgId, index) {
		event.stopPropagation(); // Verhindert, dass der Link beim Löschen geöffnet wird
		if (!confirm("Link wirklich entfernen?")) return;
		
		const tx = db.transaction("images", "readwrite");
		const store = tx.objectStore("images");
		const img = await new Promise(r => store.get(imgId).onsuccess = e => r(e.target.result));
		
		img.links.splice(index, 1);
		
		store.put(img).onsuccess = () => showDetailsByID(imgId);
	}

				if (type !== 'number' && settingsOpenDefs.has(def.id)) {
					const opts = Array.isArray(def.options) ? def.options : [];

					const chipSt = 'display:inline-flex; align-items:center; gap:6px; background:#111; border:1px solid #2a2a2a; border-radius:999px; padding:3px 10px; font-size:0.88em; margin:0 6px 6px 0;';

						h += '<span style="' + chipSt + '"><span>' + escHtml(o) + '</span><span style="color:#777; font-family:monospace; font-size:0.85em;">' + (cnt[tagKey(o)] || 0) + '×</span>' +
							'<span onclick="renameTagOption(' + def.id + ', ' + oi + ')" style="cursor:pointer; opacity:0.65;" title="Umbenennen / zusammenführen">✏️</span>' +
							'<span onclick="deleteTagOption(' + def.id + ', ' + oi + ')" style="cursor:pointer; opacity:0.65;" title="Löschen">🗑️</span></span>';

					h += '<div style="display:flex; gap:6px; margin-top:4px;"><input id="set-newval-' + def.id + '" placeholder="Neuer Wert…" onkeydown="if(event.key===\'Enter\') addTagOptionFromSettings(' + def.id + ')" style="' + inp + ' flex:1; min-width:0;">' +
						'<button onclick="addTagOptionFromSettings(' + def.id + ')">+ Hinzufügen</button></div>';
					h += '<div style="' + hint + ' margin-top:6px;">Umbenennen auf einen vorhandenen Namen führt beide Werte zusammen. Löschen entfernt den Wert bei allen Bildern dieses Tabs.</div>';

			h += '</tbody></table>';
			h += '<div style="' + hint + ' margin-top:8px;">Die Reihenfolge gilt überall (Duell-Ansicht, Details, Studio, Filter, Statistik)' +
				(settings.tagOrder[currentTab] ? ' · <a href="#" onclick="resetTagOrder(); return false;" style="color:var(--accent);">auf Standard zurücksetzen</a>' : '') + '</div>';
			h += '<div style="' + hint + ' margin-top:8px;">' +
				'<b>Exakt:</b> ein Wert aus einer Liste, gleicher Wert zählt als Übereinstimmung.<br>' +

				'<b>Zahl (±):</b> freie Zahl (z. B. eine Jahreszahl), ein Abstand bis zur Toleranz zählt als Übereinstimmung.<br>' +
				'Gewicht: leer = Standard (' + RIVAL_DEFAULT_TAG_WEIGHT + '), 0 = Eigenschaft wird bei den Rivalen-Vorschlägen ignoriert, je höher, desto mehr zählt sie.</div>';

		h += '</div>';

		// --- Werte zu nicht mehr vorhandenen Eigenschaften ---
		const orphans = await findOrphanTags(currentTab, tagDefs);
		if (orphans.length) {
			h += '<div style="' + box + '">';
			h += '<h3 style="' + title + '">Übrig gebliebene Eigenschaftswerte (Tab „' + escHtml(currentTab) + '“)</h3>';
			h += '<div style="' + hint + ' margin:0 0 10px 0;">Diese Eigenschaften gibt es nicht mehr. Ihre Werte werden nirgends angezeigt, hängen aber noch an Bildern. Legst du eine Eigenschaft mit gleichem Namen neu an, sind die Werte wieder da.</div>';
			orphans.forEach(o => {
				h += '<div style="' + row + ' margin-bottom:6px;"><span>' + escHtml(o.name) + ' <span style="color:#777; font-size:0.85em;">(' + o.count + ' Bild' + (o.count === 1 ? '' : 'er') + ')</span></span>' +
					'<button class="danger" data-orphan="' + escHtml(o.name) + '" onclick="removeOrphanTag(this.dataset.orphan)">Werte entfernen</button></div>';

		h += '<div style="' + box + '">';
		h += '<h3 style="' + title + '">Daten</h3>';

	// Wert übernehmen, bereinigen, speichern und Eingabefelder auf den gültigen Wert setzen
	function updateSetting(key, raw) {
		settings = sanitizeSettings({ ...settings, [key]: raw }, settings);
		saveSettings();
		syncSettingsInputs();
	}

	function updateShare(key, percentRaw) {
		const n = Number(percentRaw);
		updateSetting(key, (percentRaw === '' || !isFinite(n)) ? '' : n / 100);
	}

	function syncSettingsInputs() {
		const set = (id, v) => { const el = document.getElementById(id); if (el && el.value != v) el.value = v; };
		set('set-matchupMode', settings.matchupMode);
		set('set-focusMatches', settings.focusMatches);
		set('set-eloWindow', settings.eloWindow);
		set('set-shareRival', Math.round(settings.shareRival * 100));
		set('set-shareOutside', Math.round(settings.shareOutside * 100));
		const nb = document.getElementById('set-shareNeighbor');
		if (nb) nb.textContent = 100 - Math.round(settings.shareRival * 100) - Math.round(settings.shareOutside * 100);
		const hintEl = document.getElementById('set-mode-hint');
		if (hintEl) hintEl.textContent = MATCHUP_MODES[settings.matchupMode];
		const std = document.getElementById('settings-standard');
		if (std) std.style.opacity = (settings.matchupMode === 'STANDARD') ? '1' : '0.45';
	}

	function setTheme(v) {
		const t = v === 'plain' ? 'plain' : 'arena';
		document.documentElement.setAttribute('data-theme', t);
		try { localStorage.setItem('theme', t); } catch (e) {}
	}
	// ----- Werte der Eigenschaften in den Einstellungen -----
	const settingsOpenDefs = new Set();
	async function toggleSettingsValues(defId) {
		defId = Number(defId);
		if (settingsOpenDefs.has(defId)) settingsOpenDefs.delete(defId); else settingsOpenDefs.add(defId);
		await reopenSettings();
	}
	async function addTagOptionFromSettings(defId) {
		const input = document.getElementById('set-newval-' + defId);
		if (!input) return;
		const added = await addTagOption(defId, input.value);
		if (added === null && input.value.trim() !== '') return;
		await reopenSettings();
		const again = document.getElementById('set-newval-' + defId);
		if (again) again.focus();
	}

	// ----- Reihenfolge der Eigenschaften -----
	async function moveTagOrder(defId, dir) {
		const defs = await getTagDefinitionsForTab(currentTab);
		const i = defs.findIndex(d => d.id === defId), j = i + dir;
		if (i < 0 || j < 0 || j >= defs.length) return;
		[defs[i], defs[j]] = [defs[j], defs[i]];
		settings.tagOrder[currentTab] = defs.map(d => d.tagName);
		saveSettings();
		await reopenSettings();
		refreshOpenDuelTags();
	}
	function resetTagOrder() {
		delete settings.tagOrder[currentTab];
		saveSettings();
		reopenSettings();
		refreshOpenDuelTags();
	}
	// Einstellungsfenster neu zeichnen, ohne dass die Scroll-Position verloren geht
	async function reopenSettings() {
		const m = document.getElementById('modal');
		const top = m ? m.scrollTop : 0;
		await openSettings();
		if (m) m.scrollTop = top;
	}
	function refreshOpenDuelTags() {
		if (curL) renderTagBadges('left', curL);
		if (curR) renderTagBadges('right', curR);
	}
	// ----- Werte gelöschter Eigenschaften -----
	async function findOrphanTags(tab, defs) {
		const names = new Set(defs.map(d => d.tagName));
		const imgs = await idbGetAll(db.transaction("images").objectStore("images"));
		const counts = new Map();
		imgs.forEach(i => {
			if (i.tab !== tab || !i.tags) return;
			Object.keys(i.tags).forEach(n => {
				if (names.has(n)) return;
				const t = i.tags[n];
				if (t && (String(t.value || '').trim() !== '' || (t.values && t.values.length))) counts.set(n, (counts.get(n) || 0) + 1);
			});
		});
		return [...counts.entries()].map(([name, count]) => ({ name: name, count: count })).sort((a, b) => a.name.localeCompare(b.name, 'de'));
	}
	async function removeOrphanTag(name) {
		if (!confirm('Die Werte von „' + name + '“ bei allen Bildern in „' + currentTab + '“ endgültig entfernen?\n\nDas lässt sich nicht rückgängig machen.')) return;
		const tx = db.transaction("images", "readwrite");
		const store = tx.objectStore("images");
		const imgs = await idbGetAll(store);
		imgs.forEach(i => {
			if (i.tab === currentTab && i.tags && Object.prototype.hasOwnProperty.call(i.tags, name)) { delete i.tags[name]; store.put(i); }
		});
		await txDone(tx);
		await reopenSettings();
	}

	function updateDailyGoal(el) {
		const n = Math.round(Number(el.value));
		if (el.value.trim() === '' || !isFinite(n) || n < 1) {
			delete settings.dailyGoals[currentTab];
			el.value = '';
		} else {
			settings.dailyGoals[currentTab] = Math.min(100000, n);
			el.value = settings.dailyGoals[currentTab];
		}
		saveSettings();
		loadImageCountAndUpdateProgress();
	}
	async function loadImageCountAndUpdateProgress() {
		const ctx = await loadFilterContext(currentTab);
		updateDailyProgress(ctx.images.length);
	}

	function updateTagWeight(el) {
		const tab = el.dataset.tab, tag = el.dataset.tag;
		const raw = el.value.trim();
		const n = Number(raw);
		if (!settings.tagWeights[tab]) settings.tagWeights[tab] = {};
		if (raw === '' || !isFinite(n) || n < 0) {
			delete settings.tagWeights[tab][tag];
			el.value = '';
		} else {
			settings.tagWeights[tab][tag] = Math.min(100, n);
			el.value = settings.tagWeights[tab][tag];
		}
		if (Object.keys(settings.tagWeights[tab]).length === 0) delete settings.tagWeights[tab];
		saveSettings();
	}

	function resetSettings() {
		if (!confirm("Alle Einstellungen (inkl. Tag-Gewichtungen) auf Standard zurücksetzen?")) return;
		settings = sanitizeSettings(null);
		saveSettings();
		openSettings();
	}
	// ===================== /EINSTELLUNGSFENSTER =====================

	// ===================== RANGLISTE: ANSICHT & MEHRFACHAUSWAHL =====================
	const RANK_COLS = [
		{ key: 'tier', label: 'Tier', cls: 'c-tier' }, { key: 'elo', label: 'Elo', cls: 'c-elo' },
		{ key: 'win', label: 'Winrate', cls: 'c-win' }, { key: 'm', label: 'Matches', cls: 'c-m' },
		{ key: 'cov', label: 'Coverage', cls: 'c-cov' }, { key: 'form', label: 'Form', cls: 'c-form' },
		{ key: 'focus', label: 'Fokus 🎯', cls: 'c-focus' }
	];
	const RANK_DEFAULT_COLS = RANK_COLS.map(c => c.key);
	let rankTagDefs = [], bulkSel = new Set();
	function getRankView() {
		let o = {};
		try { const v = JSON.parse(localStorage.getItem('rankView')); if (v && typeof v === 'object') o = v; } catch (e) {}
		if (o.tiles === undefined && window.innerWidth <= 700) o.tiles = true;   // auf dem Handy standardmäßig Kacheln
		return o;
	}
	function saveRankView(o) { try { localStorage.setItem('rankView', JSON.stringify(o)); } catch (e) {} }
	function applyRankCols() {
		const rv = getRankView(), vis = new Set(rv.cols || RANK_DEFAULT_COLS);
		let css = '';
		RANK_COLS.forEach(c => { if (!vis.has(c.key)) css += '#rank-table .' + c.cls + '{display:none !important;}'; });
		rankTagDefs.forEach((d, i) => { if (!vis.has('tag:' + d.tagName)) css += '#rank-table .ct' + i + '{display:none !important;}'; });
		let st = document.getElementById('rank-cols-style');
		if (!st) { st = document.createElement('style'); st.id = 'rank-cols-style'; document.head.appendChild(st); }
		st.textContent = css;
	}
	function setRankCol(key, on) {
		const rv = getRankView(), vis = new Set(rv.cols || RANK_DEFAULT_COLS);
		if (on) vis.add(key); else vis.delete(key);
		rv.cols = [...vis]; saveRankView(rv); applyRankCols();
	}
	function toggleRankTiles() {
		const rv = getRankView(); rv.tiles = !rv.tiles; saveRankView(rv);
		document.getElementById('rank-table').classList.toggle('tiles', !!rv.tiles);
		document.getElementById('rank-view-btn').textContent = rv.tiles ? '☰ Tabelle' : '▦ Kacheln';
	}
	function bulkRowVisible(row) { return !row.dataset.fhide && !row.dataset.shide; }
	function bulkToggle(id, on) {
		id = Number(id);
		if (on) bulkSel.add(id); else bulkSel.delete(id);
		const row = document.querySelector('#rank-table tr[data-id="' + id + '"]');
		if (row) row.classList.toggle('bulk-sel', on);
		renderBulkBar();
	}
	function bulkSelectAll(on) {
		document.querySelectorAll('#rank-table tbody tr').forEach(row => {
			if (on && !bulkRowVisible(row)) return;
			const id = Number(row.dataset.id), cb = row.querySelector('.bulk-cb');
			if (cb) cb.checked = on;
			if (on) bulkSel.add(id); else bulkSel.delete(id);
			row.classList.toggle('bulk-sel', on);
		});
		renderBulkBar();
	}
	function bulkClear() {
		bulkSel = new Set();
		document.querySelectorAll('#rank-table .bulk-cb').forEach(cb => { cb.checked = false; });
		document.querySelectorAll('#rank-table tr.bulk-sel').forEach(r => r.classList.remove('bulk-sel'));
		const all = document.querySelector('#rank-table th.c-sel input'); if (all) all.checked = false;
		renderBulkBar();
	}
	function renderBulkBar() {
		const bar = document.getElementById('bulk-bar');
		if (!bar) return;
		if (bulkSel.size === 0) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
		const keep = bar.dataset.tag;
		bar.style.display = 'block';
		let h = '<div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;"><b>' + bulkSel.size + ' ausgewählt</b>';
		if (rankTagDefs.length === 0) {
			h += '<span style="color:#888;">Keine Eigenschaften in diesem Tab.</span>';
		} else {
			h += '<select id="bulk-tag" onchange="bulkTagChanged()">' + rankTagDefs.map((d, i) => '<option value="' + i + '"' + (String(i) === keep ? ' selected' : '') + '>' + escHtml(d.tagName) + '</option>').join('') + '</select>';
			h += '<span id="bulk-val-mount"></span>';
			h += '<button onclick="bulkApply(false)">Setzen</button>';
			h += '<button class="secondary" onclick="bulkApply(true)" title="Wert der Eigenschaft bei allen Ausgewählten entfernen">Leeren</button>';
		}
		h += '<button class="secondary" style="margin-left:auto;" onclick="bulkClear()">Auswahl aufheben</button></div>';
		bar.innerHTML = h;
		if (rankTagDefs.length) bulkTagChanged();
	}
	function bulkTagChanged() {
		const sel = document.getElementById('bulk-tag'), mount = document.getElementById('bulk-val-mount');
		if (!sel || !mount) return;
		const def = rankTagDefs[Number(sel.value)];
		document.getElementById('bulk-bar').dataset.tag = sel.value;
		if (tagTypeOf(def) === 'number') {
			mount.innerHTML = '<input id="bulk-val" type="number" step="any" placeholder="Zahl" style="width:110px;">';
		} else {
			const opts = Array.isArray(def.options) ? def.options : [];
			mount.innerHTML = '<select id="bulk-val"><option value="">– Wert wählen –</option>' + opts.map(o => '<option value="' + escHtml(o) + '">' + escHtml(o) + '</option>').join('') + '<option value="__new__">＋ Neuer Wert…</option></select>' +
				(tagTypeOf(def) === 'multi' ? ' <span style="color:#888; font-size:0.8em;">(wird ergänzt)</span>' : '');
		}
	}
	async function bulkApply(clear) {
		const sel = document.getElementById('bulk-tag');
		if (!sel || bulkSel.size === 0) return;
		const def = rankTagDefs[Number(sel.value)], type = tagTypeOf(def);
		let value = '';
		if (!clear) {
			const el = document.getElementById('bulk-val');
			value = (el && el.value || '').trim();
			if (value === '') { alert('Bitte erst einen Wert wählen.'); return; }
			if (value === '__new__') {
				value = (prompt('Neuer Wert für „' + def.tagName + '“:') || '').trim();
				if (!value) return;
			}
			if (type === 'number' && !isFinite(parseTagNumber(value))) { alert('Bitte eine gültige Zahl eingeben.'); return; }
		} else if (!confirm('Wert „' + def.tagName + '“ bei ' + bulkSel.size + ' Einträgen entfernen?')) return;
		// Prompt/Confirm liegen vor der Transaktion (in einer offenen IndexedDB-Transaktion nicht erlaubt)
		const tx = db.transaction(["images", "tagDefinitions"], "readwrite");
		const imgStore = tx.objectStore("images");
		const defNow = await idbGet(tx.objectStore("tagDefinitions"), def.id);
		if (!defNow) return;
		if (!clear && type !== 'number') {
			const opts = Array.isArray(defNow.options) ? defNow.options : [];
			if (!opts.some(o => tagKey(o) === tagKey(value))) { defNow.options = opts.concat(value).sort(tagSort); tx.objectStore("tagDefinitions").put(defNow); }
			else value = opts.find(o => tagKey(o) === tagKey(value));
		}
		const ids = [...bulkSel];
		const imgs = [];
		for (const id of ids) { const im = await idbGet(imgStore, id); if (im) imgs.push(im); }
		imgs.forEach(im => {
			let arr;
			if (clear) arr = [];
			else if (type === 'multi') arr = getTagValues(im, defNow).concat(value);
			else arr = [value];
			setTagValues(im, defNow, arr);
			imgStore.put(im);
		});
		await txDone(tx);
		rankTagDefs = rankTagDefs.map(d => d.id === defNow.id ? defNow : d);
		const di = rankTagDefs.findIndex(d => d.id === defNow.id);
		imgs.forEach(im => {
			const cell = document.querySelector('#rank-table tr[data-id="' + im.id + '"] td.ct' + di);
			if (cell) cell.textContent = getTagValues(im, defNow).join(', ');
		});
		bulkTagChanged();
		const bb = document.getElementById('bulk-bar'); if (bb) { bb.style.borderColor = 'var(--win, #2ecc71)'; setTimeout(() => { bb.style.borderColor = ''; }, 800); }
	}


	// ===================== DETAIL-FENSTER: BLÄTTERN & RANG-VERLAUF =====================
	let currentDetailId = null, detailNavSkip = '';
	async function detailNav(dir) {
		if (!currentDetailId) return;
		const all = await idbGetAll(db.transaction("images").objectStore("images"));
		const cur = all.find(i => i.id === currentDetailId);
		if (!cur) return;
		const list = all.filter(i => i.tab === cur.tab).sort((a, b) => b.elo - a.elo);
		const idx = list.findIndex(i => i.id === cur.id), n = list.length;
		for (let step = 1; step < n; step++) {
			const c = list[(((idx + dir * step) % n) + n) % n];
			if (detailNavSkip) {
				const t = c.tags && c.tags[detailNavSkip];
				const has = t && ((Array.isArray(t.values) && t.values.length) || String(t.value || '').trim() !== '');
				if (has) continue;
			}
			await showDetailsByID(c.id);
			return;
		}
		const sel = document.getElementById('dt-skip');
		if (sel) { sel.style.borderColor = 'var(--accent-r, #f39c12)'; setTimeout(() => { sel.style.borderColor = ''; }, 900); }
	}
	document.addEventListener('keydown', e => {
		const m = document.getElementById('modal');
		if (!m || m.style.display === 'none' || !m.classList.contains('details-mode')) return;
		if (e.altKey || e.ctrlKey || e.metaKey) return;
		const t = e.target;
		if (t && (/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable)) return;
		if (document.getElementById('tag-values-overlay') && getComputedStyle(document.getElementById('tag-values-overlay')).display !== 'none') return;
		if (e.key === 'ArrowLeft') { e.preventDefault(); detailNav(-1); }
		else if (e.key === 'ArrowRight') { e.preventDefault(); detailNav(1); }
	});

	// Rang des Eintrags nach jedem seiner Duelle: Alle Duelle des Tabs werden der Reihe nach nachgerechnet (Start 1200, Gewinner +Δ, Verlierer −Δ)
	async function fillRankHistory(img) {
		const box = document.getElementById('dt-rank-history');
		if (!box) return;
		const [all, matches] = [await idbGetAll(db.transaction("images").objectStore("images")), await getMatches()];
		if (currentDetailId !== img.id) return;
		const ids = all.filter(i => i.tab === img.tab).map(i => i.id);
		const elo = new Map(ids.map(i => [i, 1200]));
		const ms = matches.filter(m => m.tab === img.tab && elo.has(m.leftId) && elo.has(m.rightId)).sort((a, b) => (Number(a.time) || 0) - (Number(b.time) || 0) || (a.id || 0) - (b.id || 0));
		const pts = [];
		ms.forEach(m => {
			const d = Math.abs(Number(m.delta) || 0), w = m.winnerId === 'left' ? m.leftId : m.rightId, l = m.winnerId === 'left' ? m.rightId : m.leftId;
			elo.set(w, elo.get(w) + d); elo.set(l, elo.get(l) - d);
			if (m.leftId === img.id || m.rightId === img.id) {
				const mine = elo.get(img.id); let rank = 1;
				elo.forEach((v, k) => { if (k !== img.id && v > mine) rank++; });
				pts.push(rank);
			}
		});
		if (pts.length < 2) { box.textContent = 'Noch zu wenige Duelle für einen Verlauf.'; return; }
		const N = ids.length, W = Math.max(300, Math.round(box.clientWidth - 16)), H = 160, pad = 30;
		let series = pts;
		if (series.length > 160) { const step = series.length / 160; series = Array.from({ length: 160 }, (_, i) => pts[Math.min(pts.length - 1, Math.floor(i * step))]); series[159] = pts[pts.length - 1]; }
		const lo = Math.min(...series), hi = Math.max(...series), span = Math.max(1, hi - lo);
		const x = i => pad + (W - pad - 8) * i / (series.length - 1);
		const y = r => 12 + (H - 24) * (r - lo) / span;  // Rang 1 oben
		const path = series.map((r, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r).toFixed(1)).join(' ');
		const best = Math.min(...pts), now = pts[pts.length - 1];
		box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:auto; display:block;">' +
			'<text x="2" y="16" fill="#888" font-size="11">#' + lo + '</text><text x="2" y="' + (H - 8) + '" fill="#888" font-size="11">#' + hi + '</text>' +
			'<line x1="' + pad + '" x2="' + (W - 8) + '" y1="12" y2="12" stroke="rgba(128,128,128,0.25)" stroke-dasharray="3 4"/>' +
			'<line x1="' + pad + '" x2="' + (W - 8) + '" y1="' + (H - 12) + '" y2="' + (H - 12) + '" stroke="rgba(128,128,128,0.25)" stroke-dasharray="3 4"/>' +
			'<path d="' + path + '" fill="none" stroke="var(--accent, #3b82f6)" stroke-width="2" stroke-linejoin="round"/>' +
			'<circle cx="' + x(series.length - 1) + '" cy="' + y(series[series.length - 1]) + '" r="4" fill="var(--accent-r, #f1c40f)"/></svg>' +
			'<div style="display:flex; justify-content:space-between; color:#888; font-size:0.8em; padding:2px 4px 0;"><span>Bester Rang: <b style="color:var(--win, #2ecc71)">#' + best + '</b></span><span>' + pts.length + ' Duelle · aktuell <b>#' + now + '</b> von ' + N + '</span></div>';
	}


	// ===================== STATISTIK: AUF-/ABSTEIGER, INKONSISTENZEN, UNSICHERE =====================
	// Spielt die Duelle eines Tabs nach (Start 1200, Gewinner +Δ, Verlierer −Δ) und liefert den Elo-Stand zu den gewünschten Zeitpunkten
	function replayElo(list, matches, cutoff) {
		const elo = new Map(list.map(i => [i.id, 1200])), seen = new Set(); let atCut = null;
		const ms = matches.filter(m => elo.has(m.leftId) && elo.has(m.rightId)).sort((a, b) => (Number(a.time) || 0) - (Number(b.time) || 0) || (a.id || 0) - (b.id || 0));
		ms.forEach(m => {
			if (atCut === null && (Number(m.time) || 0) >= cutoff) atCut = { elo: new Map(elo), seen: new Set(seen) };
			const d = Math.abs(Number(m.delta) || 0), w = m.winnerId === 'left' ? m.leftId : m.rightId, l = m.winnerId === 'left' ? m.rightId : m.leftId;
			elo.set(w, elo.get(w) + d); elo.set(l, elo.get(l) - d); seen.add(m.leftId); seen.add(m.rightId);
		});
		if (atCut === null) atCut = { elo: new Map(elo), seen: new Set(seen) };
		return { now: elo, cut: atCut.elo, cutSeen: atCut.seen };
	}
	function findInconsistencies(list, matches) {
		const names = new Map(list.map(i => [i.id, i.name]));
		const pair = new Map();
		matches.forEach(m => {
			if (!names.has(m.leftId) || !names.has(m.rightId)) return;
			const a = Math.min(m.leftId, m.rightId), b = Math.max(m.leftId, m.rightId), key = a + '|' + b;
			const rec = pair.get(key) || { a, b, aw: 0, bw: 0 };
			const winner = m.winnerId === 'left' ? m.leftId : m.rightId;
			if (winner === a) rec.aw++; else rec.bw++;
			pair.set(key, rec);
		});
		const beats = new Map(); // x -> Map(y -> Duelle gesamt), wenn x y mehrheitlich schlägt (mind. 2 Duelle)
		pair.forEach(r => {
			if (r.aw + r.bw < 2 || r.aw === r.bw) return;
			const [w, l] = r.aw > r.bw ? [r.a, r.b] : [r.b, r.a];
			if (!beats.has(w)) beats.set(w, new Map());
			beats.get(w).set(l, r.aw + r.bw);
		});
		const out = [];
		beats.forEach((bs, A) => bs.forEach((nAB, B) => {
			const cs = beats.get(B); if (!cs) return;
			cs.forEach((nBC, C) => {
				if (C === A || !(A < B && A < C)) return;
				const ca = beats.get(C); if (ca && ca.has(A)) out.push({ ids: [A, B, C], games: nAB + nBC + ca.get(A) });
			});
		}));
		out.sort((x, y) => y.games - x.games);
		return { cycles: out.length, top: out.slice(0, 6).map(c => ({ names: c.ids.map(i => names.get(i)), ids: c.ids, games: c.games })) };
	}
	function buildStatsInsights(list, matches) {
		const box = 'background:var(--surface, #1b1b1b); padding:15px; border-radius:16px; border:1px solid var(--line, #2a2a2a); margin-bottom:20px;';
		const head = t => '<h3 style="font-size:0.85em; margin:0 0 10px 0; color:#aaa; text-transform:uppercase; letter-spacing:0.5px;">' + t + '</h3>';
		const link = (id, name) => '<a href="#" onclick="showDetailsByID(' + id + '); return false;" style="color:inherit; font-weight:bold; text-decoration:none; border-bottom:1px dotted #777;">' + escHtml(name) + '</a>';
		let h = '';
		// Auf-/Absteiger (7 Tage)
		const cutoff = Date.now() - 7 * 86400000;
		const rep = replayElo(list, matches, cutoff);
		const rankMap = em => { const arr = [...em.entries()].sort((a, b) => b[1] - a[1]); const m = new Map(); arr.forEach(([id], i) => m.set(id, i + 1)); return m; };
		const rNow = rankMap(rep.now), rCut = rankMap(rep.cut);
		const moves = list.filter(i => rep.cutSeen.has(i.id)).map(i => ({ img: i, d: rCut.get(i.id) - rNow.get(i.id), elo: rep.now.get(i.id) - rep.cut.get(i.id) }));
		const risers = moves.filter(m => m.d > 0).sort((a, b) => b.d - a.d).slice(0, 5);
		const fallers = moves.filter(m => m.d < 0).sort((a, b) => a.d - b.d).slice(0, 5);
		const col = (title, arr, up) => '<div><div style="color:' + (up ? 'var(--win, #2ecc71)' : 'var(--loss, #e74c3c)') + '; font-weight:bold; font-size:0.85em; margin-bottom:6px;">' + title + '</div>' +
			(arr.length ? arr.map(m => '<div style="display:flex; justify-content:space-between; gap:8px; font-size:0.9em; padding:2px 0;"><span>' + link(m.img.id, m.img.name) + '</span><span style="color:' + (up ? 'var(--win, #2ecc71)' : 'var(--loss, #e74c3c)') + '; font-family:monospace;">' + (up ? '▲' : '▼') + Math.abs(m.d) + ' <span style="color:#777;">(' + (m.elo >= 0 ? '+' : '') + Math.round(m.elo) + ')</span></span></div>').join('') : '<div style="color:#666; font-size:0.85em;">Keine Bewegung.</div>') + '</div>';
		h += '<div style="' + box + '">' + head('Auf- und Absteiger (letzte 7 Tage)') + '<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">' + col('Aufsteiger', risers, true) + col('Absteiger', fallers, false) + '</div></div>';
		// Inkonsistenzen
		const inc = findInconsistencies(list, matches);
		h += '<div style="' + box + '">' + head('Widersprüche (A schlägt B, B schlägt C, C schlägt A)');
		if (!inc.cycles) h += '<div style="color:#888; font-size:0.9em;">Keine Dreierkreise gefunden – die Ergebnisse sind stimmig.</div>';
		else {
			h += '<div style="color:#888; font-size:0.85em; margin-bottom:6px;">' + inc.cycles + (inc.cycles === 1 ? ' Dreierkreis' : ' Dreierkreise') + ' (nur Paarungen mit mindestens 2 Duellen und klarem Sieger). Die auffälligsten:</div>';
			inc.top.forEach(c => { h += '<div style="font-size:0.9em; padding:2px 0;">' + c.ids.map((id, k) => link(id, c.names[k])).join(' <span style="color:#777;">›</span> ') + ' <span style="color:#777;">› </span>' + link(c.ids[0], c.names[0]) + ' <span style="color:#666; font-size:0.85em;">(' + c.games + ' Duelle)</span></div>'; });
		}
		h += '</div>';
		// Unsichere
		if (settings.uncertainBelow > 0) {
			const unc = list.filter(i => (i.wins + i.losses) < settings.uncertainBelow).sort((a, b) => (a.wins + a.losses) - (b.wins + b.losses));
			h += '<div style="' + box + '">' + head('Noch unsicher (unter ' + settings.uncertainBelow + ' Duellen)');
			h += unc.length ? '<div style="color:#888; font-size:0.85em; margin-bottom:6px;">' + unc.length + ' von ' + list.length + ' Einträgen. Mit den wenigsten Duellen:</div><div style="display:flex; flex-wrap:wrap; gap:6px;">' +
				unc.slice(0, 12).map(i => '<span style="background:var(--surface-2, #222); border:1px solid var(--line, #333); border-radius:12px; padding:2px 10px; font-size:0.85em;">' + link(i.id, i.name) + ' <span style="color:#777;">' + Math.floor(i.wins + i.losses) + '</span></span>').join('') + '</div>'
				: '<div style="color:#888; font-size:0.9em;">Alle Einträge haben genug Duelle.</div>';
			h += '</div>';
		}
		return h;
	}
