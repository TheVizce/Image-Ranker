	// ===================== BILDER HOCHLADEN & DUPLIKAT-ERKENNUNG =====================
	// dHash: 9x8 Graustufenbild, 64 Bit aus „Pixel heller als rechter Nachbar“; ähnliche Bilder haben wenig unterschiedliche Bits.
	async function computeImageHash(blob) {
		try {
			const bmp = await createImageBitmap(blob);
			const c = document.createElement('canvas'); c.width = 9; c.height = 8;
			const ctx = c.getContext('2d', { willReadFrequently: true });
			ctx.drawImage(bmp, 0, 0, 9, 8); if (bmp.close) bmp.close();
			const d = ctx.getImageData(0, 0, 9, 8).data;
			const g = i => d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
			let bits = '';
			for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) bits += g(y * 9 + x) > g(y * 9 + x + 1) ? '1' : '0';
			let hex = '';
			for (let i = 0; i < 64; i += 4) hex += parseInt(bits.slice(i, i + 4), 2).toString(16);
			return hex;
		} catch (e) { return null; }
	}
	function hashDistance(a, b) {
		let n = 0;
		for (let i = 0; i < 16; i++) { let x = parseInt(a[i], 16) ^ parseInt(b[i], 16); while (x) { n += x & 1; x >>= 1; } }
		return n;
	}
	const DUP_MAX_DISTANCE = 4;
	function showBusy(text) {
		let el = document.getElementById('busy-note');
		if (!el) { el = document.createElement('div'); el.id = 'busy-note'; document.body.appendChild(el); }
		el.textContent = text; el.style.display = text ? 'block' : 'none';
	}
	async function importImages(files) {
		files = [...files];
		if (!files.length) return;
		let skip = new Set(), hashes = new Map();
		try {
			// vorhandene Bilder ohne Hash nachziehen (einmalig)
			const existing = await idbGetAll(db.transaction("images").objectStore("images"));
			const missing = existing.filter(i => !i.hash && i.blob instanceof Blob);
			let done = 0;
			for (const im of missing) {
				showBusy('Duplikat-Prüfung: Bilder vorbereiten… ' + (++done) + '/' + missing.length);
				im.hash = await computeImageHash(im.blob) || '';
			}
			if (missing.length) {
				const tx = db.transaction("images", "readwrite");
				missing.forEach(im => { if (im.hash) { const store = tx.objectStore("images"); idbGet(store, im.id).then(cur => { if (cur) { cur.hash = im.hash; store.put(cur); } }); } });
				await txDone(tx);
			}
			const known = existing.filter(i => i.hash || missing.includes(i)).map(i => ({ name: i.name, tab: i.tab, hash: i.hash }));
			const dups = [];
			let k = 0;
			for (const f of files) {
				showBusy('Duplikat-Prüfung: ' + (++k) + '/' + files.length);
				const h = await computeImageHash(f); hashes.set(f, h || '');
				if (!h) continue;
				const hit = known.find(x => x.hash && hashDistance(x.hash, h) <= DUP_MAX_DISTANCE);
				if (hit) { dups.push({ f, hit }); skip.add(f); }
				else known.push({ name: f.name, tab: currentTab, hash: h, fromBatch: true });
			}
			showBusy('');
			if (dups.length) {
				const lines = dups.slice(0, 8).map(d => '• ' + d.f.name + '  ≈  „' + d.hit.name + '“' + (d.hit.fromBatch ? ' (in dieser Auswahl)' : (d.hit.tab !== currentTab ? ' (Tab ' + d.hit.tab + ')' : ''))).join('\n') + (dups.length > 8 ? '\n… und ' + (dups.length - 8) + ' weitere' : '');
				const addAnyway = confirm(dups.length + ' von ' + files.length + ' Bildern sehen bereits vorhandenen Bildern ähnlich:\n\n' + lines + '\n\nOK = trotzdem alle hinzufügen\nAbbrechen = Duplikate überspringen');
				if (addAnyway) skip = new Set();
			}
		} catch (e) { console.warn('Duplikat-Prüfung übersprungen:', e); showBusy(''); skip = new Set(); }
		const toAdd = files.filter(f => !skip.has(f));
		if (!toAdd.length) { document.getElementById('file-input').value = ''; return; }
		const tx = db.transaction("images", "readwrite");
		for (let f of toAdd) tx.objectStore("images").add({ tab: currentTab, name: f.name.split('.')[0], blob: f, elo: 1200, wins: 0, losses: 0, history: [1200], peak: 1200, y: 50, hash: hashes.get(f) || '' });
		tx.oncomplete = () => { document.getElementById('file-input').value = ''; refreshUI(); ensureThumbs(); };
	}

	// ===================== DATENPFLEGE =====================
	// Findet Altlasten: Duelle zu gelöschten Bildern, Vorschaubilder ohne Bild, Rivalen-Verweise ins Leere,
	// Eigenschaftswerte ohne Eigenschaft. Gelöscht wird erst nach Klick auf „Bereinigen“.
	async function scanData() {
		const tx = db.transaction(["images", "matches", "thumbs", "tagDefinitions"], "readonly");
		const images = await idbGetAll(tx.objectStore("images"));
		const matches = await idbGetAll(tx.objectStore("matches"));
		const defs = await idbGetAll(tx.objectStore("tagDefinitions"));
		const thumbs = await idbGetAll(tx.objectStore("thumbs"));
		const byId = new Map(images.map(i => [i.id, i]));
		const orphanMatches = matches.filter(m => !byId.has(m.leftId) || !byId.has(m.rightId));
		const orphanThumbs = thumbs.filter(t => !byId.has(t.id));
		// Duelle nach dem fehlenden Bild gruppieren
		const gone = new Map();
		orphanMatches.forEach(m => {
			[[m.leftId, m.rightId, 'left'], [m.rightId, m.leftId, 'right']].forEach(([me, other, side]) => {
				if (byId.has(me)) return;
				const g = gone.get(me) || { id: me, n: 0, wins: 0, last: 0, tabs: new Set(), partners: new Map() };
				g.n++; if (m.winnerId === side) g.wins++;
				g.last = Math.max(g.last, Number(m.time) || 0); if (m.tab) g.tabs.add(m.tab);
				const o = byId.get(other); if (o) g.partners.set(o.name, (g.partners.get(o.name) || 0) + 1);
				gone.set(me, g);
			});
		});
		const badRivals = [];
		const defKey = new Set(defs.map(d => d.tab + '\u0000' + d.tagName));
		const orphanTags = new Map();
		images.forEach(i => {
			(i.rivals || []).forEach(r => { if (!byId.has(r.id)) badRivals.push({ owner: i.name, ownerId: i.id, rivalId: r.id, status: r.status }); });
			Object.keys(i.tags || {}).forEach(n => {
				if (defKey.has(i.tab + '\u0000' + n)) return;
				const k = i.tab + '\u0000' + n, g = orphanTags.get(k) || { tab: i.tab, name: n, count: 0, values: new Set() };
				const v = String((i.tags[n] && i.tags[n].value) || '').trim();
				g.count++; if (v) g.values.add(v);
				orphanTags.set(k, g);
			});
		});
		return { images, matches, orphanMatches, orphanThumbs, badRivals, orphanTags: [...orphanTags.values()], gone: [...gone.values()].sort((a, b) => b.n - a.n) };
	}
	async function openMaintenance() {
		const r = await scanData();
		const fmtDate = t => t ? new Date(t).toLocaleDateString('de-DE') : '–';
		const sec = (title, n, body, hint) => '<details style="background:var(--surface, #111); border:1px solid var(--line, #222); border-radius:10px; margin-bottom:8px;"' + (n ? ' open' : '') + '>' +
			'<summary style="cursor:pointer; padding:10px 12px; display:flex; justify-content:space-between; gap:10px;"><span>' + title + '</span>' +
			'<b style="color:' + (n ? 'var(--accent-r, #f39c12)' : 'var(--win, #2ecc71)') + ';">' + n + '</b></summary>' +
			'<div style="padding:0 12px 10px; font-size:0.85em; color:#aaa;">' + (hint ? '<div style="color:#777; margin-bottom:6px;">' + hint + '</div>' : '') + (n ? body : '<div style="color:#777;">Nichts gefunden.</div>') + '</div></details>';
		const more = (arr, max, fn) => arr.slice(0, max).map(fn).join('') + (arr.length > max ? '<div style="color:#777; padding-top:4px;">… und ' + (arr.length - max) + ' weitere</div>' : '');
		const li = t => '<div style="padding:3px 0; border-top:1px solid var(--line, #1d1d1d);">' + t + '</div>';
		let h = '<div style="max-width:640px; margin:0 auto;"><h2 style="margin:0 0 6px 0;">🧹 Daten prüfen</h2>';
		h += '<div style="color:#888; font-size:0.85em; margin-bottom:12px;">' + r.images.length + ' Bilder, ' + r.matches.length + ' Duelle insgesamt. Klappe die Punkte auf, um zu sehen, was genau gefunden wurde. Gelöscht wird erst nach Klick auf „Bereinigen“.</div>';

		h += sec('Duelle zu gelöschten Bildern', r.orphanMatches.length,
			'<div style="margin-bottom:4px;">Diese Duelle gehören zu Bildern, die es nicht mehr gibt (' + r.gone.length + ' gelöschte Bilder):</div>' +
			more(r.gone, 25, g => li('<b style="color:#ccc;">Gelöschtes Bild #' + g.id + '</b> – ' + g.n + ' Duelle (' + g.wins + ' Siege, ' + (g.n - g.wins) + ' Niederlagen), zuletzt am ' + fmtDate(g.last) + (g.tabs.size ? ', Tab ' + [...g.tabs].map(escHtml).join('/') : '') +
				(g.partners.size ? '<br><span style="color:#777;">gegen: ' + [...g.partners.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([n, c]) => escHtml(n) + (c > 1 ? ' (' + c + '×)' : '')).join(', ') + (g.partners.size > 5 ? ' …' : '') + '</span>' : ''))) +
			'<div style="margin-top:8px; color:#c9a227;">Folge des Löschens: Die Elo-Werte stehen an den Bildern und bleiben unverändert. Diese Duelle zählen danach aber nicht mehr in Tagesziel, Aktivität und Statistiken mit.</div>',
			'Entstehen, wenn ein Bild gelöscht wurde, aber seine Duelle in der Datenbank blieben.');

		const kb = Math.round(r.orphanThumbs.reduce((n, t) => n + ((t.blob && t.blob.size) || 0), 0) / 1024);
		h += sec('Überflüssige Vorschaubilder', r.orphanThumbs.length,
			'<div>' + r.orphanThumbs.length + ' kleine Vorschaubilder (zusammen ca. ' + kb + ' KB) für Bilder-IDs, die es nicht mehr gibt: ' + escHtml(r.orphanThumbs.slice(0, 12).map(t => '#' + t.id).join(', ')) + (r.orphanThumbs.length > 12 ? ' …' : '') + '</div>' +
			'<div style="margin-top:6px; color:#c9a227;">Folge des Löschens: keine – sie werden bei Bedarf neu erzeugt und gehören zu keinem Bild.</div>');

		h += sec('Rivalen-Verweise auf gelöschte Bilder', r.badRivals.length,
			more(r.badRivals, 25, b => li('<b style="color:#ccc;">' + escHtml(b.owner) + '</b> hat als Rivalen (' + (b.status === 'confirmed' ? 'bestätigt' : b.status === 'dismissed' ? 'abgelehnt' : escHtml(String(b.status))) + ') das gelöschte Bild #' + b.rivalId)) +
			'<div style="margin-top:8px; color:#c9a227;">Folge des Löschens: Die Verweise ins Leere verschwinden. Echte Rivalen bleiben.</div>');

		h += sec('Eigenschaftswerte ohne passende Eigenschaft', r.orphanTags.length,
			more(r.orphanTags, 25, g => li('<b style="color:#ccc;">' + escHtml(g.name) + '</b> (Tab ' + escHtml(g.tab) + ') – bei ' + g.count + ' Bildern' + (g.values.size ? '<br><span style="color:#777;">Werte: ' + escHtml([...g.values].slice(0, 8).join(', ')) + (g.values.size > 8 ? ' …' : '') + '</span>' : ''))) +
			'<div style="margin-top:8px; color:#8fbf8f;">Wird NICHT gelöscht: Die Werte bleiben gespeichert und tauchen wieder auf, wenn du die Eigenschaft mit gleichem Namen neu anlegst. Entfernen kannst du sie in den Einstellungen.</div>',
			'Die Eigenschaft wurde gelöscht, ihre Werte stehen aber noch an den Bildern.');

		const total = r.orphanMatches.length + r.orphanThumbs.length + r.badRivals.length;
		h += '<div style="color:#777; font-size:0.8em; margin:10px 0;">„Bereinigen“ entfernt die ersten drei Punkte. Tipp: Mach vorher ein Backup (💾 oben).</div>';
		h += '<div style="display:flex; gap:8px; justify-content:flex-end;"><button class="secondary" onclick="openSettings()">Zurück</button>' +
			'<button class="secondary" onclick="exportFullSystem()">💾 Backup</button>' +
			'<button ' + (total ? '' : 'disabled ') + 'onclick="runMaintenance()">Bereinigen</button></div></div>';
		showModal(h);
	}
	async function runMaintenance() {
		const r = await scanData();
		const ids = new Set(r.images.map(i => i.id));
		const tx = db.transaction(["images", "matches", "thumbs"], "readwrite");
		r.orphanMatches.forEach(m => tx.objectStore("matches").delete(m.id));
		r.orphanThumbs.forEach(k => tx.objectStore("thumbs").delete(k));
		r.images.forEach(i => {
			if ((i.rivals || []).some(x => !ids.has(x.id))) { i.rivals = i.rivals.filter(x => ids.has(x.id)); tx.objectStore("images").put(i); }
		});
		await txDone(tx);
		invalidateMatchCache();
		await refreshUI();
		await openMaintenance();
	}


	// ===================== MATCH-CACHE =====================
	// Alle Duelle werden einmal gelesen und im Speicher gehalten (IndexedDB bleibt die Quelle der Wahrheit).
	// Dazu gibt es pro Bild einen Index (Duelle, Gegner mit Anzahl), damit nicht bei jedem Duell alle Duelle durchsucht werden.
	let matchPromise = null, matchCache = null, matchIndex = null;

	function getMatches() {
		if (!matchPromise) {
			matchPromise = new Promise(r => { db.transaction("matches").objectStore("matches").getAll().onsuccess = e => r(e.target.result || []); })
				.then(arr => { matchCache = arr; return arr; });
		}
		return matchPromise;
	}
	function invalidateMatchCache() { matchPromise = null; matchCache = null; matchIndex = null; }

	function indexMatch(idx, m) {
		[[Number(m.leftId), Number(m.rightId)], [Number(m.rightId), Number(m.leftId)]].forEach(([a, b]) => {
			let arr = idx.byImage.get(a); if (!arr) { arr = []; idx.byImage.set(a, arr); }
			arr.push(m);
			let opp = idx.opp.get(a); if (!opp) { opp = new Map(); idx.opp.set(a, opp); }
			opp.set(b, (opp.get(b) || 0) + 1);
		});
	}
	async function getMatchIndex() {
		const ms = await getMatches();
		if (!matchIndex) {
			const idx = { byImage: new Map(), opp: new Map() };
			ms.forEach(m => indexMatch(idx, m));
			matchIndex = idx;
		}
		return matchIndex;
	}
	function addMatchToCache(m) {
		if (matchCache) { matchCache.push(m); if (matchIndex) indexMatch(matchIndex, m); }
		else invalidateMatchCache(); // Laden läuft noch -> später neu lesen
	}
	function removeMatchFromCache(id) {
		if (!matchCache) { invalidateMatchCache(); return; }
		for (let i = matchCache.length - 1; i >= 0; i--) {
			if (matchCache[i].id === id) { matchCache.splice(i, 1); break; }
		}
		matchIndex = null;
	}
	const opponentsOf = (idx, id) => idx.opp.get(Number(id)) || new Map();
	const matchesOf = (idx, id) => idx.byImage.get(Number(id)) || [];
	// Anzahl verschiedener Gegner von "id" innerhalb der Bild-ID-Menge idSet
	function distinctOpponentCount(idx, id, idSet) {
		let n = 0;
		opponentsOf(idx, id).forEach((count, opp) => { if (idSet.has(opp)) n++; });
		return n;
	}
	// ===================== /MATCH-CACHE =====================

	// ===================== BILD-URLS & VORSCHAUBILDER =====================
	// Object-URLs werden zwischengespeichert (statt bei jeder Anzeige neu erzeugt und nie freigegeben zu werden).
	// Für kleine Darstellungen (Listen, Log, Chips) gibt es Vorschaubilder im Store "thumbs" - sie sind nicht Teil des Exports.
	const THUMB_MAX = 200;       // längste Seite in Pixel
	const FULL_URL_LIMIT = 60;   // so viele Vollbild-URLs bleiben gleichzeitig erhalten (älteste werden freigegeben)
	const fullUrls = new Map();  // id -> { url, size, type }
	const thumbBlobs = new Map();// id -> Blob
	const thumbUrls = new Map(); // id -> url

	function imgUrl(img, kind) {
		if (!img) return '';
		if (kind === 'thumb') {
			let u = thumbUrls.get(img.id);
			if (!u && thumbBlobs.has(img.id)) { u = URL.createObjectURL(thumbBlobs.get(img.id)); thumbUrls.set(img.id, u); }
			if (u) return u;
		}
		const b = img.blob;
		if (!(b instanceof Blob)) return b || '';
		const hit = fullUrls.get(img.id);
		if (hit && hit.size === b.size && hit.type === b.type) {
			fullUrls.delete(img.id); fullUrls.set(img.id, hit); // als zuletzt benutzt markieren
			return hit.url;
		}
		if (hit) { URL.revokeObjectURL(hit.url); fullUrls.delete(img.id); }
		const url = URL.createObjectURL(b);
		fullUrls.set(img.id, { url: url, size: b.size, type: b.type });
		while (fullUrls.size > FULL_URL_LIMIT) {
			const oldest = fullUrls.keys().next().value;
			URL.revokeObjectURL(fullUrls.get(oldest).url);
			fullUrls.delete(oldest);
		}
		return url;
	}

	// Alles zu einem Bild vergessen (gelöscht oder Bild ersetzt)
	function forgetImage(id) {
		const f = fullUrls.get(id); if (f) { URL.revokeObjectURL(f.url); fullUrls.delete(id); }
		const t = thumbUrls.get(id); if (t) { URL.revokeObjectURL(t); thumbUrls.delete(id); }
		thumbBlobs.delete(id);
	}

	async function makeThumb(blob) {
		let url = null;
		try {
			url = URL.createObjectURL(blob);
			const im = new Image();
			im.src = url;
			await im.decode();
			const scale = Math.min(1, THUMB_MAX / Math.max(im.naturalWidth, im.naturalHeight));
			const w = Math.max(1, Math.round(im.naturalWidth * scale)), h = Math.max(1, Math.round(im.naturalHeight * scale));
			const c = document.createElement('canvas');
			c.width = w; c.height = h;
			const ctx = c.getContext('2d');
			ctx.fillStyle = '#111'; ctx.fillRect(0, 0, w, h); // Transparenz (PNG) auf dunklem Grund
			ctx.drawImage(im, 0, 0, w, h);
			return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
		} catch (e) {
			return null; // z. B. nicht dekodierbares Format -> es wird das Originalbild verwendet
		} finally {
			if (url) URL.revokeObjectURL(url);
		}
	}

	async function loadStoredThumbs() {
		const rows = await idbGetAll(db.transaction("thumbs").objectStore("thumbs"));
		rows.forEach(r => { if (r && r.blob instanceof Blob) thumbBlobs.set(r.id, r.blob); });
	}

	let thumbJobRunning = false;
	// Erzeugt fehlende Vorschaubilder nacheinander im Hintergrund und räumt verwaiste auf
	async function ensureThumbs() {
		if (thumbJobRunning) return;
		thumbJobRunning = true;
		try {
			const images = await idbGetAll(db.transaction("images").objectStore("images"));
			const ids = new Set(images.map(i => i.id));
			const orphans = [...thumbBlobs.keys()].filter(id => !ids.has(id));
			if (orphans.length) {
				const tx = db.transaction("thumbs", "readwrite");
				orphans.forEach(id => { tx.objectStore("thumbs").delete(id); forgetImage(id); });
				await txDone(tx);
			}
			const missing = images.filter(i => i.blob instanceof Blob && !thumbBlobs.has(i.id));
			let done = 0;
			for (const img of missing) {
				const tb = await makeThumb(img.blob);
				if (tb) {
					const tx = db.transaction("thumbs", "readwrite");
					tx.objectStore("thumbs").put({ id: img.id, blob: tb });
					await txDone(tx);
					thumbBlobs.set(img.id, tb);
				}
				done++;
				if (done % 10 === 0) await new Promise(r => setTimeout(r, 0)); // Oberfläche atmen lassen
			}
			if (missing.length > 0 && document.getElementById('top20-list')) updateRanking(); // Seitenleiste mit Vorschaubildern neu zeichnen
		} catch (err) {
			console.warn("Vorschaubilder konnten nicht erzeugt werden:", err);
		} finally {
			thumbJobRunning = false;
		}
	}
	// ===================== /BILD-URLS & VORSCHAUBILDER =====================

	// ===================== EIGENSCHAFTS-WERTE =====================
	// Jede Eigenschaft (tagDefinitions) hat einen Typ (def.type):
	//   "exact"  Exakt: ein Wert aus einer Liste (def.options)
	//   "multi"  Mehrfachauswahl: mehrere Werte aus der Liste (def.options), Bild speichert tags[Name].values = [...]
	//   "number" Zahl: freie Zahl, beim Vergleich zählt ein Abstand bis def.tolerance (±) als Übereinstimmung
	// tags[Name].value ist bei allen Typen ein Text (bei "multi" die Werte mit ", " verbunden) und wird für Anzeige/Badges genutzt.
	const TAG_TYPES = { exact: "Exakt", multi: "Mehrfachauswahl", number: "Zahl (±)" };
	const TAG_DEFAULT_TOLERANCE = 2;
	const tagTypeOf = def => (def && Object.prototype.hasOwnProperty.call(TAG_TYPES, def.type)) ? def.type : 'exact';
	const tagKey = v => String(v === undefined || v === null ? '' : v).trim().toLowerCase();
	const tagSort = (a, b) => String(a).localeCompare(String(b), 'de', { numeric: true, sensitivity: 'base' });
	const parseTagNumber = v => { const s = String(v === undefined || v === null ? '' : v).trim().replace(',', '.'); return s === '' ? NaN : Number(s); };

	function getTagTolerance(def) {
		if (!def || def.tolerance === undefined || def.tolerance === null || def.tolerance === '') return TAG_DEFAULT_TOLERANCE;
		const n = Number(def.tolerance);
		return (isFinite(n) && n >= 0) ? n : TAG_DEFAULT_TOLERANCE;
	}

	function idbGetAll(store) {
		return new Promise(r => { store.getAll().onsuccess = e => r(e.target.result); });
	}
	const txDone = tx => new Promise(r => { tx.oncomplete = r; tx.onerror = r; tx.onabort = r; });

	// Werte eines Bildes für eine Eigenschaft als Liste (bei "exact"/"number" höchstens ein Eintrag)
	function getTagValuesAs(img, tagName, type) {
		const t = img.tags && img.tags[tagName];
		if (!t) return [];
		const src = (type === 'multi' && Array.isArray(t.values)) ? t.values : [t.value];
		const out = [], seen = new Set();
		src.forEach(v => {
			const str = String(v === undefined || v === null ? '' : v).trim();
			if (str && !seen.has(tagKey(str))) { seen.add(tagKey(str)); out.push(str); }
		});
		return type === 'multi' ? out : out.slice(0, 1);
	}
	function setTagValuesAs(img, tagName, type, arr) {
		if (!img.tags) img.tags = {};
		const t = img.tags[tagName] || (img.tags[tagName] = { value: "", showBadge: true });
		if (type === 'multi') { t.values = arr.slice(); t.value = arr.join(', '); }
		else { delete t.values; t.value = arr.length ? arr[0] : ""; }
	}
	const getTagValues = (img, def) => getTagValuesAs(img, def.tagName, tagTypeOf(def));
	const setTagValues = (img, def, arr) => setTagValuesAs(img, def.tagName, tagTypeOf(def), arr);

	// Wendet fn(wert) -> neuer Wert | null (entfernen) auf alle Werte an. Gibt true zurück, wenn sich etwas geändert hat.
	function mapImageTagValues(img, def, fn) {
		if (img.tab !== def.tab || !img.tags || !img.tags[def.tagName]) return false;
		const type = tagTypeOf(def);
		const t = img.tags[def.tagName];
		const after = [], seen = new Set();
		getTagValues(img, def).forEach(v => {
			const r = fn(v);
			const str = (r === null || r === undefined) ? '' : String(r).trim();
			if (str && !seen.has(tagKey(str))) { seen.add(tagKey(str)); after.push(str); }
		});
		const rawNow = type === 'multi'
			? JSON.stringify(Array.isArray(t.values) ? t.values : (t.value === undefined || t.value === null || t.value === '' ? [] : [t.value]))
			: JSON.stringify(t.value === undefined || t.value === null ? '' : t.value);
		const rawNew = type === 'multi' ? JSON.stringify(after) : JSON.stringify(after.length ? after[0] : '');
		if (rawNow === rawNew) return false;
		setTagValues(img, def, after);
		return true;
	}

	// Einmalige Übernahme der bisherigen Freitext-Werte: Pro Eigenschaft ohne Werteliste werden die vorhandenen
	// Werte (ohne Beachtung von Groß-/Kleinschreibung und Leerzeichen zusammengefasst) zur Liste.
	// Gespeichert wird die am häufigsten verwendete Schreibweise; die Bilder werden darauf vereinheitlicht.
	async function migrateTagOptions() {
		const tx = db.transaction(["tagDefinitions", "images"], "readwrite");
		const defStore = tx.objectStore("tagDefinitions");
		const imgStore = tx.objectStore("images");
		const defs = await idbGetAll(defStore);
		const todo = defs.filter(d => tagTypeOf(d) !== 'number' && !Array.isArray(d.options));
		if (todo.length === 0) return;
		const images = await idbGetAll(imgStore);
		const changedImages = new Set();

		todo.forEach(def => {
			const groups = new Map(); // key -> Map(Schreibweise -> Anzahl)
			images.forEach(img => {
				if (img.tab !== def.tab) return;
				getTagValues(img, def).forEach(v => {
					const k = tagKey(v);
					if (!groups.has(k)) groups.set(k, new Map());
					groups.get(k).set(v, (groups.get(k).get(v) || 0) + 1);
				});
			});

			const canonical = new Map(); // key -> gewählte Schreibweise
			groups.forEach((variants, k) => {
				let best = null, bestCount = -1;
				variants.forEach((count, spelling) => { if (count > bestCount) { best = spelling; bestCount = count; } });
				canonical.set(k, best);
			});

			images.forEach(img => {
				if (mapImageTagValues(img, def, v => canonical.get(tagKey(v)))) changedImages.add(img);
			});

			def.options = [...canonical.values()].sort(tagSort);
			defStore.put(def);
		});

		changedImages.forEach(img => imgStore.put(img));
		await txDone(tx);
		console.info("Eigenschaftswerte migriert:", todo.length, "Eigenschaften,", changedImages.size, "Bilder vereinheitlicht");
	}

	// Ergänzt fehlende Werte: Alles, was Bilder als Wert nutzen, aber nicht in der Werteliste der Eigenschaft steht
	// (z. B. nach dem Import eines Backups), wird in die Liste aufgenommen. Es wird nichts gelöscht oder umgeschrieben.
	async function syncTagOptionsFromImages() {
		const tx = db.transaction(["tagDefinitions", "images"], "readwrite");
		const defStore = tx.objectStore("tagDefinitions");
		const defs = await idbGetAll(defStore);
		const images = await idbGetAll(tx.objectStore("images"));
		let changed = 0;
		defs.forEach(def => {
			if (tagTypeOf(def) === 'number') return;
			const opts = Array.isArray(def.options) ? def.options.slice() : [];
			const known = new Set(opts.map(tagKey));
			let added = false;
			images.forEach(img => {
				if (img.tab !== def.tab) return;
				getTagValues(img, def).forEach(v => {
					if (!known.has(tagKey(v))) { known.add(tagKey(v)); opts.push(v); added = true; }
				});
			});
			if (added || !Array.isArray(def.options)) { def.options = opts.sort(tagSort); defStore.put(def); changed++; }
		});
		await txDone(tx);
		if (changed) console.info("Eigenschaftslisten ergänzt:", changed);
	}

	const tagSelectStyle = 'width:100%; background:#000; border:1px solid #333; color:#eee; padding:3px 5px; border-radius:4px; font-size:0.75em; outline:none; box-sizing:border-box;';

	// Eingabeelement für den Wert einer Eigenschaft eines Bildes (je nach Typ)
	function buildTagControl(img, def) {
		const type = tagTypeOf(def);
		const opts = Array.isArray(def.options) ? def.options : [];
		const vals = getTagValuesAs(img, def.tagName, type);

		if (type === 'number') {
			return '<input type="number" step="any" placeholder="Zahl" value="' + escHtml(vals[0] || '') + '" onchange="onTagNumberChange(' + img.id + ', ' + def.id + ', this)" style="' + tagSelectStyle + '">';
		}

		if (type === 'multi') {
			let h = '';
			if (vals.length) {
				h += '<div style="display:flex; flex-wrap:wrap; gap:3px; margin-bottom:4px;">';
				vals.forEach((v, i) => {
					h += '<span style="display:inline-flex; align-items:center; gap:3px; background:#1d2a3a; border:1px solid #2c4a6b; border-radius:10px; padding:1px 6px; font-size:0.7em;">' + escHtml(v) +
						'<span onclick="removeTagMultiValue(' + img.id + ', ' + def.id + ', ' + i + ')" title="Entfernen" style="cursor:pointer; color:#ff6b6b;">✕</span></span>';
				});
				h += '</div>';
			}
			const chosen = new Set(vals.map(tagKey));
			h += '<select onchange="onTagMultiAdd(' + img.id + ', ' + def.id + ', this)" style="' + tagSelectStyle + '">';
			h += '<option value="">＋ hinzufügen…</option>';
			opts.filter(o => !chosen.has(tagKey(o))).forEach(o => { h += '<option value="' + escHtml(o) + '">' + escHtml(o) + '</option>'; });
			h += '<option value="__new__">＋ Neuer Wert…</option></select>';
			return h;
		}

		const cur = vals[0] || '';
		const inList = cur === '' || opts.some(o => tagKey(o) === tagKey(cur));
		let h = '<select onchange="onTagSelectChange(' + img.id + ', ' + def.id + ', this)" style="' + tagSelectStyle + '">';
		h += '<option value=""' + (cur === '' ? ' selected' : '') + '>–</option>';
		if (!inList) h += '<option value="' + escHtml(cur) + '" selected>' + escHtml(cur) + ' (nicht in Liste)</option>';
		opts.forEach(o => {
			h += '<option value="' + escHtml(o) + '"' + (cur !== '' && tagKey(o) === tagKey(cur) ? ' selected' : '') + '>' + escHtml(o) + '</option>';
		});
		h += '<option value="__new__">＋ Neuer Wert…</option>';
		h += '</select>';
		return h;
	}

	// Fügt einen Wert zur Liste hinzu (ohne Doppelte). Gibt die gültige Schreibweise zurück oder null.
	async function addTagOption(defId, rawValue) {
		const value = String(rawValue === undefined || rawValue === null ? '' : rawValue).trim();
		if (!value) return null;
		const tx = db.transaction("tagDefinitions", "readwrite");
		const store = tx.objectStore("tagDefinitions");
		const def = await idbGet(store, Number(defId));
		if (!def) return null;
		if (!Array.isArray(def.options)) def.options = [];
		const existing = def.options.find(o => tagKey(o) === tagKey(value));
		if (existing !== undefined) return existing;
		def.options.push(value);
		def.options.sort(tagSort);
		store.put(def);
		await txDone(tx);
		return value;
	}

	// Setzt die Werte einer Eigenschaft bei einem Bild (String oder Liste; [] / '' = leeren)
	async function setImageTagValues(imgId, defId, values) {
		const arr = (Array.isArray(values) ? values : [values]).map(v => String(v === undefined || v === null ? '' : v).trim()).filter(Boolean);
		const tx = db.transaction(["images", "tagDefinitions"], "readwrite");
		const def = await idbGet(tx.objectStore("tagDefinitions"), Number(defId));
		const imgStore = tx.objectStore("images");
		const img = await idbGet(imgStore, Number(imgId));
		if (!def || !img) return;
		setTagValues(img, def, arr);
		imgStore.put(img);
		await txDone(tx);
	}

	async function onTagSelectChange(imgId, defId, sel) {
		let value = sel.value;
		if (value === '__new__') {
			const input = prompt("Neuer Wert:");
			const added = input ? await addTagOption(defId, input) : null;
			if (added === null) { showDetailsByID(imgId); return; } // Abbruch: Anzeige zurücksetzen
			value = added;
		}
		await setImageTagValues(imgId, defId, value);
		showDetailsByID(imgId); // aktualisiert z. B. auch die Rivalen-Vorschläge
	}

	async function readImageAndDef(imgId, defId) {
		const tx = db.transaction(["images", "tagDefinitions"], "readonly");
		const def = await idbGet(tx.objectStore("tagDefinitions"), Number(defId));
		const img = await idbGet(tx.objectStore("images"), Number(imgId));
		return { img, def };

	async function onTagMultiAdd(imgId, defId, sel) {
		let value = sel.value;
		if (value === '') return;
		if (value === '__new__') {
			const input = prompt("Neuer Wert:");
			const added = input ? await addTagOption(defId, input) : null;
			if (added === null) { showDetailsByID(imgId); return; }
			value = added;
		}
		const { img, def } = await readImageAndDef(imgId, defId);
		if (!img || !def) return;
		await setImageTagValues(imgId, defId, [...getTagValues(img, def), value]);

	async function removeTagMultiValue(imgId, defId, index) {
		const { img, def } = await readImageAndDef(imgId, defId);

		await setImageTagValues(imgId, defId, getTagValues(img, def).filter((v, i) => i !== index));

	async function onTagNumberChange(imgId, defId, input) {
		const raw = input.value.trim();
		if (raw === '') {
			await setImageTagValues(imgId, defId, []);
		} else {
			const n = parseTagNumber(raw);
			if (!isFinite(n)) { showDetailsByID(imgId); return; }
			await setImageTagValues(imgId, defId, String(n));
		}
		showDetailsByID(imgId);
	}

	// ---- Typ einer Eigenschaft ändern (Einstellungen) ----
	async function changeTagType(defId, newType) {
		defId = Number(defId);
		if (!Object.prototype.hasOwnProperty.call(TAG_TYPES, newType)) { openSettings(); return; }
		const tx0 = db.transaction(["tagDefinitions", "images"], "readonly");
		const def0 = await idbGet(tx0.objectStore("tagDefinitions"), defId);
		if (!def0) return;
		const oldType = tagTypeOf(def0);
		if (oldType === newType) return;
		const images0 = await idbGetAll(tx0.objectStore("images"));

		let lossy = 0;
		images0.forEach(img => {
			if (img.tab !== def0.tab || !img.tags || !img.tags[def0.tagName]) return;
			const vals = getTagValuesAs(img, def0.tagName, oldType);
			if (newType === 'number') { if (vals.length > 1 || (vals.length === 1 && !isFinite(parseTagNumber(vals[0])))) lossy++; }
			else if (newType === 'exact' && vals.length > 1) lossy++;
		});
		if (lossy > 0) {
			const what = newType === 'number'
				? lossy + ' Bild(er) haben Werte, die keine einzelne Zahl sind. Diese Werte werden geleert.'
				: lossy + ' Bild(er) haben mehrere Werte. Es bleibt jeweils nur der erste.';
			if (!confirm('Typ von "' + def0.tagName + '" auf "' + TAG_TYPES[newType] + '" ändern?\n' + what)) { openSettings(); return; }
		}

		const tx = db.transaction(["tagDefinitions", "images"], "readwrite");
		const defStore = tx.objectStore("tagDefinitions");
		const imgStore = tx.objectStore("images");
		const def = await idbGet(defStore, defId);
		const images = await idbGetAll(imgStore);
		images.forEach(img => {
			if (img.tab !== def.tab || !img.tags || !img.tags[def.tagName]) return;
			const vals = getTagValuesAs(img, def.tagName, oldType);
			let out;
			if (newType === 'number') { const n = vals.length ? parseTagNumber(vals[0]) : NaN; out = isFinite(n) ? [String(n)] : []; }
			else if (newType === 'exact') out = vals.slice(0, 1);
			else out = vals;
			setTagValuesAs(img, def.tagName, newType, out);
			imgStore.put(img);
		});
		def.type = newType;
		if (newType === 'number' && def.tolerance === undefined) def.tolerance = TAG_DEFAULT_TOLERANCE;
		if (oldType === 'number') delete def.options; // Werteliste wird aus den vorhandenen Werten neu aufgebaut
		defStore.put(def);
		await txDone(tx);
		if (oldType === 'number') await migrateTagOptions();
		openSettings();
	}

	async function updateTagTolerance(defId, el) {
		const raw = String(el.value).trim().replace(',', '.');
		const n = raw === '' ? NaN : Number(raw);
		const tx = db.transaction("tagDefinitions", "readwrite");
		const store = tx.objectStore("tagDefinitions");
		const def = await idbGet(store, Number(defId));
		if (!def) return;
		if (isFinite(n) && n >= 0) { def.tolerance = n; store.put(def); }
		el.value = getTagTolerance(def);
		await txDone(tx);
	}

	// ---- Werte verwalten (Overlay über der Detailansicht) ----
	let tagManagerImgId = null;

		if (imgId !== undefined) tagManagerImgId = Number(imgId);

		const opts = Array.isArray(def.options) ? def.options : [];

		const counts = {};
		images.forEach(img => {

					'<span style="color:#666; font-size:0.8em; font-family:monospace;">' + (counts[tagKey(o)] || 0) + '×</span>' +
					'<span onclick="renameTagOption(' + defId + ', ' + i + ')" style="cursor:pointer; opacity:0.6;" title="Umbenennen / zusammenführen">✏️</span>' +
					'<span onclick="deleteTagOption(' + defId + ', ' + i + ')" style="cursor:pointer; opacity:0.6;" title="Löschen">🗑️</span>' +
				'</div>';
			});
		}
		h += '</div>';
		h += '<div style="display:flex; gap:6px;">' +
			'<input id="tag-new-value" placeholder="Neuer Wert…" onkeydown="if(event.key===\'Enter\') addTagOptionFromManager(' + defId + ')" style="flex:1; min-width:0; background:#1a1a1a; border:1px solid #333; color:#eee; border-radius:4px; padding:6px 8px;">' +
			'<button onclick="addTagOptionFromManager(' + defId + ')">+ Hinzufügen</button></div>';
		h += '</div>';
		ov.innerHTML = h;
		const inp = document.getElementById('tag-new-value');
		if (inp) inp.focus();
	}

	function closeTagValueManager() {
		const ov = document.getElementById('tag-values-overlay');

		const id = tagManagerImgId;

	async function addTagOptionFromManager(defId) {

		if (!input) return;

	// Nach einer Änderung an den Werten: das offene Verwaltungsfenster oder die Einstellungen neu zeichnen
	async function refreshTagValueUi(defId) {
		if (document.getElementById('tag-values-overlay')) await openTagValueManager(defId);
		else if (document.getElementById('set-theme')) await reopenSettings();
	}

	// Wert umbenennen. Entspricht der neue Name einem anderen vorhandenen Wert, werden beide zusammengeführt.
	async function renameTagOption(defId, index) {
		defId = Number(defId);
		const tx0 = db.transaction("tagDefinitions", "readonly");
		const def0 = await idbGet(tx0.objectStore("tagDefinitions"), defId);
		if (!def0 || !def0.options || def0.options[index] === undefined) return;
		const oldValue = def0.options[index];

		const input = prompt('Neuer Name für "' + oldValue + '":', oldValue);
		if (input === null) return;
		const newValue = input.trim();
		if (!newValue || newValue === oldValue) return;

		const mergeIdx = def0.options.findIndex((o, i) => i !== index && tagKey(o) === tagKey(newValue));
		if (mergeIdx >= 0 && !confirm('"' + def0.options[mergeIdx] + '" gibt es bereits. Beide Werte zusammenführen?')) return;
		const finalValue = mergeIdx >= 0 ? def0.options[mergeIdx] : newValue;

		const tx = db.transaction(["tagDefinitions", "images"], "readwrite");
		const defStore = tx.objectStore("tagDefinitions");
		const imgStore = tx.objectStore("images");
		const def = await idbGet(defStore, defId);
		const images = await idbGetAll(imgStore);
		def.options = def.options.filter((o, i) => i !== index && !(mergeIdx >= 0 && tagKey(o) === tagKey(finalValue)));
		def.options.push(finalValue);
		def.options.sort(tagSort);
		defStore.put(def);
		images.forEach(img => {
			if (mapImageTagValues(img, def, v => tagKey(v) === tagKey(oldValue) ? finalValue : v)) imgStore.put(img);
		});
		await txDone(tx);
		await refreshTagValueUi(defId);
	}

	// Wert löschen: Bilder verlieren diesen Wert bei dieser Eigenschaft
	async function deleteTagOption(defId, index) {
		defId = Number(defId);
		const tx0 = db.transaction(["tagDefinitions", "images"], "readonly");
		const def0 = await idbGet(tx0.objectStore("tagDefinitions"), defId);
		if (!def0 || !def0.options || def0.options[index] === undefined) return;
		const value = def0.options[index];
		const images0 = await idbGetAll(tx0.objectStore("images"));
		const count = images0.filter(img => img.tab === def0.tab && getTagValues(img, def0).some(v => tagKey(v) === tagKey(value))).length;

		if (!confirm('Wert "' + value + '" löschen?' + (count ? '\n' + count + ' Bild(er) verlieren diesen Wert.' : ''))) return;

		const tx = db.transaction(["tagDefinitions", "images"], "readwrite");
		const defStore = tx.objectStore("tagDefinitions");
		const imgStore = tx.objectStore("images");
		const def = await idbGet(defStore, defId);
		const images = await idbGetAll(imgStore);
		def.options = def.options.filter(o => tagKey(o) !== tagKey(value));
		defStore.put(def);
		images.forEach(img => {
			if (mapImageTagValues(img, def, v => tagKey(v) === tagKey(value) ? null : v)) imgStore.put(img);
		});

	// ===================== /EIGENSCHAFTS-WERTE =====================

	// ===================== ANZEIGE-EINSTELLUNGEN (pro Gerät) =====================
	const uiPrefs = (() => {
		let o = {};
		try { o = JSON.parse(localStorage.getItem('uiPrefs')) || {}; } catch (e) {}
		return { extras: o.extras !== false, keys: o.keys !== false };
	})();
	function applyUiPrefs() { document.documentElement.setAttribute('data-extras', uiPrefs.extras ? 'on' : 'off'); }
	applyUiPrefs();
	function setUiPref(key, on) {
		uiPrefs[key] = !!on;
		try { localStorage.setItem('uiPrefs', JSON.stringify(uiPrefs)); } catch (e) {}
		applyUiPrefs();
		if (key === 'extras') {
			if (curL && curR) { displaySide('left', curL); displaySide('right', curR); updateProbDisplay(); }
			loadImageCountAndUpdateProgress();

	// Tastatur: ← / → stimmen ab, Strg/Cmd+Z macht das letzte Duell rückgängig
	let keyBusy = false;
	document.addEventListener('keydown', async e => {
		if (!uiPrefs.keys || e.repeat || e.altKey || keyBusy) return;
		const t = e.target;
		if (t && (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(t.tagName) || t.isContentEditable)) return;

		if (open('modal') || open('matchupStudioModal') || open('tag-values-overlay')) return;
		const undo = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z';
		if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && !undo) return;
		e.preventDefault();
		keyBusy = true;
		try {
			if (undo) await undoLastMatch();

		} finally { setTimeout(() => { keyBusy = false; }, 350); }
	});

	// ===================== TAGESZIEL =====================
	function roundToNiceNumber(val) {
		if (val <= 50) return Math.ceil(val / 10) * 10;   // Rundet auf 10er (z. B. 16 -> 20, 32 -> 40)
		if (val <= 200) return Math.ceil(val / 25) * 25; // Rundet auf 25er (z. B. 68 -> 75, 112 -> 125)
		return Math.ceil(val / 50) * 50;                 // Rundet auf 50er (z. B. 299 -> 300, 410 -> 450)
	}
	// Automatisches Tagesziel: 30 % der Bilder des Tabs, mindestens 30, auf "schöne" Zahl gerundet
	const autoDailyGoal = imageCount => roundToNiceNumber(Math.max(30, imageCount * 0.3));
	// Eigener Wert aus den Einstellungen, sonst der automatische
	function getDailyGoal(tab, imageCount) {
		const g = settings.dailyGoals && settings.dailyGoals[tab];
		return g >= 1 ? g : autoDailyGoal(imageCount);
	}
	function dayStartMs() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime(); }

	const SESSION_START = Date.now();
	let lastDailyCount = null, lastDailyKey = '';
	const dayKeyOf = t => { const d = new Date(t); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };

	async function updateDailyProgress(imageCount) {
		const el = document.getElementById('daily-status');
		if (!el) return;
		const matches = await getMatches();
		const start = dayStartMs();
		const perDay = new Map();
		let count = 0, session = 0, total = 0;
		for (const m of matches) {
			if (m.tab !== currentTab) continue;
			total++;
			if (m.time) {
				const k = dayKeyOf(m.time);
				perDay.set(k, (perDay.get(k) || 0) + 1);
				if (m.time >= start) count++;
				if (m.time >= SESSION_START) session++;
			}
		}
		const goal = getDailyGoal(currentTab, imageCount);
		const pct = count / goal;
		const color = pct >= 1.5 ? '#bd93f9' : pct >= 1 ? '#50fa7b' : pct >= 0.5 ? '#ffb86c' : '#ff5555';

		// Zielerreichung heute: Ring kurz pulsieren lassen
		const key = currentTab + '|' + dayKeyOf(Date.now());
		const justHit = lastDailyKey === key && lastDailyCount !== null && lastDailyCount < goal && count >= goal;
		lastDailyKey = key; lastDailyCount = count;

		if (!uiPrefs.extras) {
			el.innerHTML = '<div title="Duelle heute in diesem Tab (Ziel in den Einstellungen änderbar)" style="display:inline-flex; align-items:center; gap:8px; background:var(--surface, #111); border:1px solid var(--line, #222); border-radius:20px; padding:4px 14px; margin-bottom:6px; font-size:0.8em; color:#aaa;">' +
				'<span>📅 Heute</span><b style="color:' + color + ';">' + count + ' / ' + goal + '</b>' +
				'<span style="display:inline-block; width:90px; height:6px; background:#222; border-radius:3px; overflow:hidden;"><span style="display:block; height:100%; width:' + Math.min(100, Math.round(pct * 100)) + '%; background:' + color + ';"></span></span>' +
				'<span>' + Math.round(pct * 100) + ' %' + (pct >= 1 ? ' ✅' : '') + '</span></div>';
			const wk = document.getElementById('week-chart'); if (wk) wk.innerHTML = '';
			return;
		}

		// letzte 7 Tage + Serie
		const day = i => new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate() - i);
		const week = [];
		for (let i = 6; i >= 0; i--) { const d = day(i); week.push({ d: d, n: perDay.get(dayKeyOf(d)) || 0, today: i === 0 }); }
		const avg7 = Math.round(week.reduce((a, w) => a + w.n, 0) / 7);
		let streak = 0;
		for (let i = 0; i < 400; i++) {
			const n = perDay.get(dayKeyOf(day(i))) || 0;
			if (n >= goal) streak++;
			else if (i === 0) continue; // heute darf noch offen sein
			else break;
		}

		// Abdeckung des gesamten Tabs (gespielte Paarungen / mögliche Paarungen)
		let covTxt = '–', covSub = 'der Paarungen';
		if (duelCtx && duelCtx.tab === currentTab && duelCtx.n > 1) {
			let pairs2 = 0;
			duelCtx.ids.forEach(id => { pairs2 += distinctOpponentCount(duelCtx.idx, id, duelCtx.ids); });
			const possible = duelCtx.n * (duelCtx.n - 1);
			covTxt = (Math.floor((pairs2 / possible) * 1000) / 10).toFixed(1).replace('.', ',') + ' %';
			covSub = Math.round(pairs2 / 2) + ' von ' + (possible / 2) + ' Paaren';
		}

		const R = 17, C = 2 * Math.PI * R;
		const ring = '<svg class="cp-ring' + (justHit ? ' hit' : '') + '" width="40" height="40" viewBox="0 0 40 40" style="color:' + color + ';">' +
			'<circle cx="20" cy="20" r="' + R + '" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>' +
			'<circle cx="20" cy="20" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + (C * Math.min(1, pct)).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 20 20)"/>' +
			'<text x="20" y="24" text-anchor="middle" style="fill:' + color + ';">' + (pct >= 1 ? '✓' : Math.round(pct * 100) + ' %') + '</text></svg>';
		const chip = (inner, extra) => '<div class="cp-chip' + (extra || '') + '">' + inner + '</div>';
		el.innerHTML = '<div class="cp-strip">' +
			chip(ring + '<div><div class="cp-main">Heute ' + count + ' / ' + goal + '</div><div class="cp-sub">' + (pct >= 1 ? 'Tagesziel erreicht 🎉' : 'noch ' + (goal - count) + ' bis zum Ziel') + '</div></div>') +
			chip('<div><div class="cp-main">🔥 ' + streak + (streak === 1 ? ' Tag' : ' Tage') + '</div><div class="cp-sub">Ziel in Folge geschafft</div></div>', ' nobadge') +
			chip('<div><div class="cp-main">Ø ' + avg7 + ' pro Tag</div><div class="cp-sub">letzte 7 Tage</div></div>', ' nobadge') +
			chip('<div><div class="cp-main">' + covTxt + '</div><div class="cp-sub">Abdeckung · ' + covSub + '</div></div>', ' nobadge') +
			chip('<div><div class="cp-main">' + total + ' Duelle</div><div class="cp-sub">+' + session + ' in dieser Sitzung</div></div>', ' nobadge') +
			'</div>';

		// 7-Tage-Diagramm in der linken Leiste
		const wkEl = document.getElementById('week-chart');
		if (wkEl) {
			const max = Math.max(goal, ...week.map(w => w.n), 1);
			const goalPct = (goal / max) * 100;
			wkEl.innerHTML = '<div class="wk-title"><span>Letzte 7 Tage</span><span><b>' + week.reduce((a, w) => a + w.n, 0) + '</b> Duelle</span></div>' +
				'<div class="wk-bars"><div class="wk-goal" style="bottom:' + goalPct.toFixed(1) + '%;" title="Tagesziel ' + goal + '"></div>' +
				week.map(w => '<div class="wk-bar' + (w.n >= goal ? ' hit' : '') + (w.today ? ' today' : '') + '" style="height:' + Math.max(2, (w.n / max) * 100).toFixed(1) + '%;" title="' + w.d.toLocaleDateString('de-DE') + ': ' + w.n + ' Duelle"></div>').join('') + '</div>' +
				'<div class="wk-labels">' + week.map(w => '<span' + (w.today ? ' class="today"' : '') + '>' + w.d.toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', '') + '</span>').join('') + '</div>';
		}
	}
	// ===================== /TAGESZIEL =====================

	// ===================== TAG-FILTER =====================
	// Ein Filter besteht aus Bedingungen (UND-verknüpft):
	//   Exakt / Mehrfachauswahl:  { tag, values: [...] }   Bild passt, wenn es mindestens einen der Werte hat ("(leer)" = kein Wert)
	//   Zahl:                     { tag, min, max }        Bild passt, wenn sein Wert im Bereich liegt (Bilder ohne Zahl passen nicht)
	// Zwei unabhängige Filter pro Tab: "match" (Duelle, im Browser gespeichert) und "list" (Rangliste, nur bis zum Neuladen).
	const EMPTY_MARK = '__empty__';
	const matchFilters = (() => {
		try { const o = JSON.parse(localStorage.getItem('matchFilters')); return (o && typeof o === 'object') ? o : {}; }
		catch (e) { return {}; }
	})();
	const listFilters = {};
	let matchFilterDirty = false;
	let listFilterOpen = false;

	function saveMatchFilters() {
		try { localStorage.setItem('matchFilters', JSON.stringify(matchFilters)); } catch (e) { console.warn("Filter konnte nicht gespeichert werden.", e); }
	}
	function getFilter(ctx, tab) {
		const store = ctx === 'match' ? matchFilters : listFilters;
		if (!store[tab] || !Array.isArray(store[tab].conds)) store[tab] = { conds: [] };
		return store[tab];
	}
	const hasNum = v => v !== undefined && v !== null && v !== '' && isFinite(Number(v));
	function condActive(c) {
		return (Array.isArray(c.values) && c.values.length > 0) || hasNum(c.min) || hasNum(c.max);
	}
	const filterIsActive = f => !!(f && Array.isArray(f.conds) && f.conds.some(condActive));

	async function getDefsByName(tab) {
		const defs = await getTagDefinitionsForTab(tab);
		return new Map(defs.map(d => [d.tagName, d]));
	}

	function imageMatchesFilter(img, filter, defsByName) {
		for (const c of filter.conds) {
			const def = defsByName.get(c.tag);
			if (!def) continue;
			const type = tagTypeOf(def);
			if (type === 'number') {
				const hasMin = hasNum(c.min), hasMax = hasNum(c.max);
				if (!hasMin && !hasMax) continue;
				const vals = getTagValuesAs(img, c.tag, 'number');
				const n = vals.length ? parseTagNumber(vals[0]) : NaN;
				if (!isFinite(n)) return false;
				if (hasMin && n < Number(c.min)) return false;
				if (hasMax && n > Number(c.max)) return false;
			} else {
				if (!Array.isArray(c.values) || c.values.length === 0) continue;
				const keys = new Set(c.values.map(tagKey));
				const vals = getTagValuesAs(img, c.tag, type);
				const ok = vals.length === 0 ? keys.has(EMPTY_MARK) : vals.some(v => keys.has(tagKey(v)));
				if (!ok) return false;
			}
		}
		return true;
	}

	function describeFilter(f) {
		const parts = [];
		f.conds.filter(condActive).forEach(c => {
			if (Array.isArray(c.values) && c.values.length) {
				parts.push(c.tag + ': ' + c.values.map(v => v === EMPTY_MARK ? '(leer)' : v).join(', '));
			} else {
				const a = hasNum(c.min), b = hasNum(c.max);
				parts.push(c.tag + ': ' + (a && b ? c.min + '–' + c.max : a ? 'ab ' + c.min : 'bis ' + c.max));
			}
		});
		return parts.join(' · ');
	}

	async function loadFilterContext(tab) {
		const defs = await getTagDefinitionsForTab(tab);
		const all = await idbGetAll(db.transaction("images").objectStore("images"));
		return { defs: defs, defsByName: new Map(defs.map(d => [d.tagName, d])), images: all.filter(i => i.tab === tab).sort((a, b) => b.elo - a.elo) };
	}

	// ---- Editor (wird in ein Element mit der ID flt-<ctx>-mount gezeichnet) ----
	async function renderFilterEditor(ctx) {
		const mount = document.getElementById('flt-' + ctx + '-mount');
		if (!mount) return;
		const tab = currentTab;
		const { defs, defsByName, images } = await loadFilterContext(tab);
		const filter = getFilter(ctx, tab);
		filter.conds = filter.conds.filter(c => defsByName.has(c.tag)); // Bedingungen gelöschter Eigenschaften entfernen
		const used = new Set(filter.conds.map(c => c.tag));
		const inp = 'background:#1a1a1a; border:1px solid #333; color:#eee; border-radius:4px; padding:5px 8px; font-size:0.9em;';

		let h = '';
		if (defs.length === 0) {
			h += '<div style="color:#666; font-style:italic; padding:8px 0;">In diesem Tab gibt es noch keine Eigenschaften, nach denen gefiltert werden könnte.</div>';
		}
		filter.conds.forEach((c, i) => {
			const def = defsByName.get(c.tag);
			const type = tagTypeOf(def);
			h += '<div style="background:#111; border:1px solid #222; border-radius:8px; padding:10px; margin-bottom:8px;">';
			h += '<div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">' +
				'<select onchange="fltSetTag(\'' + ctx + '\', ' + i + ', this.value)" style="' + inp + ' flex:1;">' +
					defs.filter(d => d.tagName === c.tag || !used.has(d.tagName)).map(d => '<option value="' + escHtml(d.tagName) + '"' + (d.tagName === c.tag ? ' selected' : '') + '>' + escHtml(d.tagName) + ' (' + TAG_TYPES[tagTypeOf(d)] + ')</option>').join('') +
				'</select>' +
				'<span onclick="fltRemove(\'' + ctx + '\', ' + i + ')" title="Bedingung entfernen" style="cursor:pointer; color:#ff6b6b; font-size:1.1em;">✕</span></div>';

			if (type === 'number') {
				const nums = images.map(im => { const v = getTagValuesAs(im, c.tag, 'number'); return v.length ? parseTagNumber(v[0]) : NaN; }).filter(isFinite);
				const lo = nums.length ? Math.min(...nums) : '', hi = nums.length ? Math.max(...nums) : '';
				h += '<div style="display:flex; align-items:center; gap:8px;">von ' +
					'<input type="number" step="any" placeholder="' + lo + '" value="' + (hasNum(c.min) ? c.min : '') + '" onchange="fltSetRange(\'' + ctx + '\', ' + i + ', \'min\', this.value)" style="' + inp + ' width:100px;"> bis ' +
					'<input type="number" step="any" placeholder="' + hi + '" value="' + (hasNum(c.max) ? c.max : '') + '" onchange="fltSetRange(\'' + ctx + '\', ' + i + ', \'max\', this.value)" style="' + inp + ' width:100px;">' +
					'<span style="color:#666; font-size:0.8em;">(Bilder ohne Zahl passen nicht)</span></div>';
			} else {
				const opts = Array.isArray(def.options) ? def.options : [];
				const sel = new Set((c.values || []).map(tagKey));
				const chip = (label, idx, key) => {
					const on = sel.has(key);
					return '<label style="display:inline-flex; align-items:center; gap:4px; border-radius:12px; padding:2px 9px; font-size:0.8em; cursor:pointer; user-select:none; border:1px solid ' + (on ? '#2c4a6b' : '#333') + '; background:' + (on ? '#1d2a3a' : '#1a1a1a') + ';">' +
						'<input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="fltToggle(\'' + ctx + '\', ' + i + ', ' + idx + ', this.checked)" style="margin:0;">' + escHtml(label) + '</label>';
				};
				h += '<div style="display:flex; flex-wrap:wrap; gap:5px; max-height:130px; overflow-y:auto;">' +
					opts.map((o, idx) => chip(o, idx, tagKey(o))).join('') + chip('(leer)', -1, EMPTY_MARK) + '</div>';
				h += '<div style="color:#666; font-size:0.8em; margin-top:6px;">' + (type === 'multi' ? 'Passt, wenn das Bild mindestens einen der gewählten Werte hat.' : 'Passt, wenn der Wert einer der gewählten ist.') + '</div>';
			}
			h += '</div>';
		});

		const free = defs.filter(d => !used.has(d.tagName));
		h += '<div style="display:flex; align-items:center; gap:12px;">' +
			'<button onclick="fltAdd(\'' + ctx + '\')" ' + (free.length === 0 ? 'disabled' : '') + '>+ Bedingung</button>';
		if (filterIsActive(filter)) {
			const n = images.filter(im => imageMatchesFilter(im, filter, defsByName)).length;
			h += '<span style="font-weight:bold; color:' + (n < 2 && ctx === 'match' ? 'var(--loss)' : 'var(--accent)') + ';">' + n + ' von ' + images.length + ' Bildern passen</span>';
			if (n < 2 && ctx === 'match') h += '<span style="color:var(--loss); font-size:0.85em;">Für Duelle werden mindestens 2 gebraucht, sonst wird der Filter ignoriert.</span>';
		}
		h += '</div>';
		mount.innerHTML = h;
	}

	async function fltChanged(ctx) {
		if (ctx === 'match') { saveMatchFilters(); matchFilterDirty = true; updateFilterUI(null); }
		else await applyListFilter();
		await renderFilterEditor(ctx);
	}
	async function fltAdd(ctx) {
		const { defs } = await loadFilterContext(currentTab);
		const filter = getFilter(ctx, currentTab);
		const used = new Set(filter.conds.map(c => c.tag));
		const next = defs.find(d => !used.has(d.tagName));
		if (!next) return;
		filter.conds.push({ tag: next.tagName });
		await renderFilterEditor(ctx); // leere Bedingung ändert den Filter noch nicht
	}
	async function fltRemove(ctx, i) {
		getFilter(ctx, currentTab).conds.splice(i, 1);
		await fltChanged(ctx);
	}
	async function fltSetTag(ctx, i, tag) {
		getFilter(ctx, currentTab).conds[i] = { tag: tag };
		await fltChanged(ctx);
	}
	async function fltToggle(ctx, i, optIdx, checked) {
		const c = getFilter(ctx, currentTab).conds[i];
		if (!c) return;
		let value = EMPTY_MARK;
		if (optIdx >= 0) {
			const defs = await getTagDefinitionsForTab(currentTab);
			const def = defs.find(d => d.tagName === c.tag);
			value = def && def.options ? def.options[optIdx] : undefined;
			if (value === undefined) return;
		}
		const set = new Set((c.values || []).map(tagKey));
		c.values = (c.values || []).filter(v => tagKey(v) !== tagKey(value));
		if (checked) c.values.push(value);
		await fltChanged(ctx);
	}
	async function fltSetRange(ctx, i, which, raw) {
		const c = getFilter(ctx, currentTab).conds[i];
		if (!c) return;
		const n = parseTagNumber(raw);
		c[which] = isFinite(n) ? n : null;
		await fltChanged(ctx);
	}
	async function fltClear(ctx) {
		getFilter(ctx, currentTab).conds = [];
		await fltChanged(ctx);
	}

		el.innerHTML = '<div style="background:rgba(142,68,173,0.2); border:1px solid #8e44ad; padding:5px 15px; border-radius:20px; display:inline-block; color:#d7a8ec; font-size:0.85em; margin-bottom:6px;">' +

	// ---- Ranglisten-Filter (blendet Zeilen aus; "(#n)" zeigt den Platz innerhalb des Filters) ----
	async function applyListFilter() {
		const rows = document.querySelectorAll('#rank-table tbody tr');
		if (!rows.length) return;
		const f = getFilter('list', currentTab);
		let pass = null;
		if (filterIsActive(f)) {
			const ctxData = await loadFilterContext(currentTab);
			pass = new Set(ctxData.images.filter(im => imageMatchesFilter(im, f, ctxData.defsByName)).map(im => String(im.id)));
		}
